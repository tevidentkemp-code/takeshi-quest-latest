<!-- PAGE 2: PLAYER SELECT -->
<section id="players" class="card section hidden">
  <div class="ms-card">
    <div class="ms-intake-heading">
      <span class="ms-intake-kicker">SET UP YOUR GAME</span>
      <span id="msModeLabel" class="ms-mode-label">CLASSIC</span>
      <h2 class="ms2-title">MATCH CARD</h2>
      <p class="ms-intake-intro">Add your players, then choose the match length.</p>
    </div>

    <div class="ms2-addrow">
      <button id="msAddRegisteredBtn" class="btn ms2-btn ms2-add-saved" type="button">
        <span class="ms2-ic" aria-hidden="true">
          <svg viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6"/><path d="M7 9v6"/><circle cx="21" cy="4.5" r="2.2"/><path d="M21 7v6"/><path d="M16.5 10.5 21 9l4.5 1.5"/><path d="M21 13l-2.8 8"/><path d="M21 13l2.8 8"/></svg>
        </span>
        <span>ADD SAVED</span>
      </button>
      <button id="msAddGuestBtn" class="btn ms2-btn ms2-add-guest" type="button">
        <span class="ms2-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </span>
        <span>ADD GUEST</span>
      </button>
    </div>

    <button id="msRegisterPlayerBtn" class="btn ms2-btn ms2-save-new" type="button">
      <span class="ms2-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
      </span>
      <span>SAVE NEW PLAYER</span>
    </button>

    <div class="ms-roster-heading"><span>YOUR LINE-UP</span><span id="msRosterCount">0 / 6 selected</span></div>
    <div id="msPlayersList" class="ms-players-list ms2-slots" role="group" aria-label="Selected players"></div>

    <div id="msMinHint" class="ms-hint" role="status" aria-live="polite" aria-atomic="true">Add 2 players to continue.</div>
  </div>

  <button id="startMatchBtn" class="btn ms-start ms-primary" type="button" aria-describedby="msMinHint" disabled>
    SELECT MATCH LENGTH
  </button>

  <button id="startScreenBtn" class="btn ms2-back" type="button"><span class="ms2-back-ar" aria-hidden="true">&#8592;</span><span class="ms2-back-txt">BACK</span></button>
</section> <!-- end #players -->
