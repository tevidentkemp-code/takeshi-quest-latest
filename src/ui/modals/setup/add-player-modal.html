    <!-- Add Player Modal -->
    <div id="addPlayerModal" class="modal-backdrop hidden">
      <div class="modal np-modal" role="dialog" aria-modal="true" aria-labelledby="npTitle">
        <div class="np-top">
          <!-- Duplicate back arrow removed; the close (×) is the single
               dismiss control (audit D-3). Grid keeps the title centred. -->
          <span class="np-top-spacer" aria-hidden="true"></span>
          <div class="np-head">
            <div id="npTitle" class="np-title">NEW PLAYER</div>
            <div class="np-sub">SAVED TO THE PLAYER HUB</div>
          </div>
          <button id="npCloseBtn" class="np-close" type="button" aria-label="Close">×</button>
        </div>

        <div class="modal-body np-body">
          <div class="np-field np-avatar-field">
            <div class="np-label">AVATAR</div>
            <div id="newPlayerAvatarPicker" class="sq-avatar-picker-host"></div>
          </div>

          <div class="np-field">
            <label class="np-label" for="newPlayerFirst">FIRST NAME</label>
            <input id="newPlayerFirst" type="text" autocomplete="given-name" placeholder="e.g. Luke" />
          </div>

          <div class="np-field np-nick">
            <label class="np-label" for="newPlayerNickname">NICKNAME</label>
            <div class="np-nick-row">
              <input id="newPlayerNickname" type="text" autocomplete="off" placeholder="e.g. The Nuke" />
              <button id="genNicknameBtn" class="np-gen" type="button" aria-label="Generate nickname">⟳</button>
            </div>
          </div>

          <div class="np-field">
            <label class="np-label" for="newPlayerLast">LAST NAME</label>
            <input id="newPlayerLast" type="text" autocomplete="family-name" placeholder="e.g. Littler" />
          </div>

          <div class="np-field">
            <label class="np-label" for="newPlayerInitials">INITIALS</label>
            <input id="newPlayerInitials" type="text" inputmode="text" maxlength="3" autocomplete="off" placeholder="e.g. LL" />
          </div>
        </div>

        <div id="npSaveStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="modal-footer np-footer">
          <button id="savePlayerBtn" class="btn np-save" type="button" disabled>SAVE PLAYER</button>
        </div>
      </div>
    </div>
