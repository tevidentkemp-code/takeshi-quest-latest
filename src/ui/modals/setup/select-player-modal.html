<!-- Select Player Modal -->
<div id="selectPlayerModal" class="modal-backdrop hidden">
  <div class="modal sp-modal">
    <div class="sp2-head">
      <div class="sp2-title">SELECT PLAYERS</div>
    </div>
    <div class="modal-body">
      <div class="sp2-search">
        <span class="sp2-search-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
        </span>
        <input id="spSearchInput" type="text" placeholder="Search players ..." autocomplete="off" />
      </div>
      <div class="sp2-chips" role="group" aria-label="Sort players">
        <button class="sp2-chip active" data-sort="recent" type="button">RECENT</button>
        <button class="sp2-chip" data-sort="az" type="button">A-Z</button>
        <button class="sp2-chip" data-sort="rank" type="button">RANK</button>
      </div>
      <div id="spPlayerList" class="sp-list sp2-list"></div>
      <!-- Hidden native select stays as the canonical value carrier for legacy
           hooks (fix129 dedupe reads its options). -->
      <select id="existingPlayerSelect" class="sp-native-select" aria-hidden="true" tabindex="-1">
        <option value="">Select a saved player...</option>
      </select>
    </div>
    <div class="modal-footer sp2-footer">
      <!-- SAVE NEW PLAYER lives on the Match Card only; removed from this dialog. -->
      <button id="confirmSelectPlayerBtn" class="btn sp2-confirm" type="button">CONFIRM PLAYERS</button>
      <button id="cancelSelectPlayerBtn" class="btn ms2-back sp2-back" type="button"><span class="ms2-back-ar" aria-hidden="true">&#8592;</span><span class="ms2-back-txt">BACK</span></button>
    </div>
  </div>
</div>
