<!-- Match Length Modal (Players > Start Match) -->
<div id="matchLengthModal" class="modal-backdrop hidden">
  <div class="modal ml-modal">
    <div class="ml-top">
      <!-- Single back control lives in the footer (#mlFooterBackBtn); the
           duplicate header arrow was removed (audit D-3). -->
      <div class="ml-head">
        <div class="ml-title">MATCH LENGTH</div>
        <div class="ml-sub">SELECT NUMBER OF GAMES</div>
      </div>
    </div>

    <div class="modal-body">
      <div id="mlGrid" class="ml-grid" role="group" aria-label="Select number of games"></div>
      <div id="mlHint" class="ml-hint">
        <span class="ml-hint-ico" aria-hidden="true">i</span>
        <span id="mlHintText"></span>
      </div>
    </div>

    <div class="modal-footer ml-footer">
      <button id="mlFooterBackBtn" class="btn ml-foot-back ms2-back" type="button"><span class="ms2-back-ar" aria-hidden="true">&#8592;</span><span class="ms2-back-txt">BACK</span></button>
      <!-- Label swaps via JS based on mode -->
      <button id="mlStartBtn" class="btn ms-start ms-primary" type="button" disabled>SET THROW ORDER <span class="ms-arrow">▶</span></button>
    </div>
  </div>
</div>
