          positive_tests = r'''

  // SC-025 positive Trophy/Award and Milestone parity. Reuse the existing
  // player-name/game denominator truth while making award counts deterministic.
  await page.evaluate(() => {
    const baseSb = window.sb;
    const byCode = {
      giant_slayer: [
        { player_id:'p1', cnt:3, xp:30 },
        { player_id:'p2', cnt:2, xp:20 },
      ],
      score_100: [
        { player_id:'p1', cnt:1, xp:30 },
        { player_id:'p2', cnt:1, xp:30 },
      ],
    };
    const wrapped = {
      from(table){
        if (table !== 'v_player_achievements') return baseSb.from(table);
        let selectedCode = '';
        const q = {
          select(){ return q; },
          eq(col, value){ if (col === 'code') selectedCode = String(value || ''); return q; },
          then(resolve){ resolve({ data:(byCode[selectedCode] || []).map(r => ({ ...r })), error:null }); },
          catch(){ return q; },
        };
        return q;
      }
    };
    window.sb = wrapped; window.__sb = wrapped;
