name: SC-025 league average toggle
on:
  push:
    branches:
      - sc025-league-average-toggle
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc025-league-average-toggle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded SC-025 patch
        run: |
          python3 tools/ui-smoke/sc025-patch.py
          python3 tools/ui-smoke/sc025-fix-test.py
          git diff --check
          node --check tools/ui-smoke/verify-sc009.js
          node --check tools/ui-smoke/verify-sc025.js
          git diff --stat
      - name: Install UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run SC-025 and standard regressions
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-sc008.js
          node tools/ui-smoke/verify-sc009.js
          node tools/ui-smoke/verify-sc025.js
          node tools/ui-smoke/verify-sc010.js
          node tools/ui-smoke/verify-sc014.js
          node tools/ui-smoke/smoke.js
          node tools/ui-smoke/verify-saveplayer-card.js
      - name: Commit bounded product and regression files only
        run: |
          git diff --check
          git rm .github/workflows/sc025-build.yml tools/ui-smoke/sc025-patch.py tools/ui-smoke/sc025-fix-test.py
          git add index.html tools/ui-smoke/verify-sc009.js tools/ui-smoke/verify-sc025.js
          git status --short
          git config user.name 'tevidentkemp-code'
          git config user.email 'tevidentkemp@gmail.com'
          git commit -m 'SC-025: add all-time and average award leagues'
          git push origin HEAD:sc025-league-average-toggle
