name: SC-030 DMD transient channel

on:
  push:
    branches: [sc030-dmd-v2-modular]
    paths:
      - scripts/sc030-add-dmd-transient-channel.mjs
      - .github/workflows/sc030-dmd-transient-channel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc030-dmd-transient-channel
  cancel-in-progress: false

jobs:
  verify-transient-channel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Confirm production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Apply exact transient-channel patch in verification workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sc030-transient-generated sc030-transient-write
          mkdir -p sc030-transient-generated sc030-transient-write
          node scripts/sc030-add-dmd-transient-channel.mjs sc030-transient-generated/patch-evidence.json
          node --check src/legacy/scripts/inline-007.js
          node --check src/live-game/dmd/controller.mjs
          node --check src/live-game/dmd/bootstrap.mjs
          node tools/ui-smoke/verify-sc030-dmd-v2.mjs | tee sc030-transient-unit-results.txt
          node scripts/verify-modularization.mjs | tee sc030-transient-modular-results.txt
          node scripts/build-core-js-from-source.mjs --verify-current | tee sc030-transient-core-js-results.txt
          git diff --check -- \
            src/legacy/scripts/inline-007.js \
            src/live-game/dmd/controller.mjs \
            src/live-game/dmd/bootstrap.mjs \
            src/legacy/intentional-patches.json \
            tools/ui-smoke/verify-sc030-dmd-v2.mjs \
            tools/ui-smoke/verify-sc030-dmd-runtime.js

      - name: Confirm HTML source remains current
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-index-from-source.mjs \
            --output sc030-transient-generated/index.html \
            --evidence sc030-transient-generated/html-build-evidence.json \
            | tee sc030-transient-html-results.txt
          cmp -s sc030-transient-generated/index.html index.html

      - name: Stage exact verified write set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            sc030-transient-write/src/legacy/scripts \
            sc030-transient-write/src/live-game/dmd \
            sc030-transient-write/src/legacy \
            sc030-transient-write/tools/ui-smoke
          cp src/legacy/scripts/inline-007.js sc030-transient-write/src/legacy/scripts/inline-007.js
          cp src/live-game/dmd/controller.mjs sc030-transient-write/src/live-game/dmd/controller.mjs
          cp src/live-game/dmd/bootstrap.mjs sc030-transient-write/src/live-game/dmd/bootstrap.mjs
          cp src/legacy/intentional-patches.json sc030-transient-write/src/legacy/intentional-patches.json
          cp tools/ui-smoke/verify-sc030-dmd-v2.mjs sc030-transient-write/tools/ui-smoke/verify-sc030-dmd-v2.mjs
          cp tools/ui-smoke/verify-sc030-dmd-runtime.js sc030-transient-write/tools/ui-smoke/verify-sc030-dmd-runtime.js
          cp sc030-transient-generated/patch-evidence.json sc030-transient-write/patch-evidence.json

      - name: Install deterministic UI test dependencies
        shell: bash
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run transient restoration and full behaviour regression
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-sc030-dmd-runtime.js | tee sc030-transient-dmd-runtime-results.txt
          node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc030-transient-undo-results.txt
          node tools/ui-smoke/verify-sc014.js | tee sc030-transient-setup-results.txt
          node tools/ui-smoke/smoke.js | tee sc030-transient-smoke-results.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc030-transient-classic-results.txt
          node tools/ui-smoke/verify-training-modes.js | tee sc030-transient-training-results.txt
          node tools/ui-smoke/verify-progression-modes.js | tee sc030-transient-progression-results.txt
          node tools/ui-smoke/verify-pstats.js | tee sc030-transient-pstats-results.txt
          node tools/ui-smoke/verify-p23.js | tee sc030-transient-admin-close-results.txt
          node tools/ui-smoke/verify-n5-stacking.js | tee sc030-transient-admin-stacking-results.txt

      - name: Package verified transient write set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc030-transient-write
          retention-days: 1
          path: sc030-transient-write/

      - name: Keep transient-channel QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc030-transient-evidence
          retention-days: 7
          path: |
            sc030-transient-generated/
            sc030-transient-*-results.txt
            qa-artifacts

  commit-verified-transient-channel:
    needs: verify-transient-channel
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Confirm branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sc030-dmd-v2-modular
          test "$(git rev-parse origin/sc030-dmd-v2-modular)" = "${GITHUB_SHA}"

      - name: Download verified transient write set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sc030-transient-write
          path: sc030-transient-write

      - name: Validate and commit only approved transient-channel files
        shell: bash
        run: |
          set -euo pipefail
          expected=$'patch-evidence.json\nsrc/legacy/intentional-patches.json\nsrc/legacy/scripts/inline-007.js\nsrc/live-game/dmd/bootstrap.mjs\nsrc/live-game/dmd/controller.mjs\ntools/ui-smoke/verify-sc030-dmd-runtime.js\ntools/ui-smoke/verify-sc030-dmd-v2.mjs'
          actual="$(find sc030-transient-write -type f -printf '%P\n' | sort)"
          test "$actual" = "$expected"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const evidence = JSON.parse(fs.readFileSync('sc030-transient-write/patch-evidence.json', 'utf8'));
          if (evidence.scoringChanged !== false || evidence.rulesChanged !== false || evidence.persistentDataChanged !== false) {
            throw new Error('transient-channel safety contract changed');
          }
          const map = {
            renderer:'src/legacy/scripts/inline-007.js',
            controller:'src/live-game/dmd/controller.mjs',
            bootstrap:'src/live-game/dmd/bootstrap.mjs',
            patches:'src/legacy/intentional-patches.json',
            unit:'tools/ui-smoke/verify-sc030-dmd-v2.mjs',
            runtime:'tools/ui-smoke/verify-sc030-dmd-runtime.js'
          };
          for (const [key,path] of Object.entries(map)) {
            const current = fs.readFileSync(path);
            const verified = fs.readFileSync(`sc030-transient-write/${path}`);
            if (sha(current) !== evidence.files[key].oldSha256) throw new Error(`${path} moved since verified input`);
            if (sha(verified) !== evidence.files[key].newSha256) throw new Error(`${path} verified output hash mismatch`);
          }
          NODE
          cp sc030-transient-write/src/legacy/scripts/inline-007.js src/legacy/scripts/inline-007.js
          cp sc030-transient-write/src/live-game/dmd/controller.mjs src/live-game/dmd/controller.mjs
          cp sc030-transient-write/src/live-game/dmd/bootstrap.mjs src/live-game/dmd/bootstrap.mjs
          cp sc030-transient-write/src/legacy/intentional-patches.json src/legacy/intentional-patches.json
          cp sc030-transient-write/tools/ui-smoke/verify-sc030-dmd-v2.mjs tools/ui-smoke/verify-sc030-dmd-v2.mjs
          cp sc030-transient-write/tools/ui-smoke/verify-sc030-dmd-runtime.js tools/ui-smoke/verify-sc030-dmd-runtime.js
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -v '^sc030-transient-write/' || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/legacy/scripts/inline-007\.js|src/live-game/dmd/(controller|bootstrap)\.mjs|src/legacy/intentional-patches\.json|tools/ui-smoke/verify-sc030-dmd-v2\.mjs|tools/ui-smoke/verify-sc030-dmd-runtime\.js)$' || true)"
          if [ -n "$bad" ]; then
            echo "Refusing write: unexpected transient-channel files:"
            echo "$bad"
            exit 1
          fi
          git diff --check -- \
            src/legacy/scripts/inline-007.js \
            src/live-game/dmd/controller.mjs \
            src/live-game/dmd/bootstrap.mjs \
            src/legacy/intentional-patches.json \
            tools/ui-smoke/verify-sc030-dmd-v2.mjs \
            tools/ui-smoke/verify-sc030-dmd-runtime.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/legacy/scripts/inline-007.js \
            src/live-game/dmd/controller.mjs \
            src/live-game/dmd/bootstrap.mjs \
            src/legacy/intentional-patches.json \
            tools/ui-smoke/verify-sc030-dmd-v2.mjs \
            tools/ui-smoke/verify-sc030-dmd-runtime.js
          git commit -m "SC-030: preserve DMD baseline across controller scenes [skip ci]"
          git push origin HEAD:sc030-dmd-v2-modular
