name: SXP-04 side quest materialize + preview

on:
  push:
    branches: [sxp-04-sidequest-xp-controls]
    paths:
      - package.json
      - package-lock.json
      - vite.config.mjs
      - scripts/**
      - src/**
      - assets/**
      - tools/ui-smoke/**
      - .github/workflows/sxp04-sidequest-materialize.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sxp04-sidequest-materialize
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Confirm production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Install architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Materialize canonical runtime
        run: node scripts/materialize-runtime.mjs

      - name: Verify generated source authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/build-core-styles-from-source.mjs --verify-current

      - name: Run side-quest regression guard
        run: node tools/ui-smoke/verify-sxp04-sidequest.mjs

      - name: Install deterministic build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Vite candidate
        run: npm run build

      - name: Verify Vite dist contract
        run: npm run verify:dist

      - name: Install deterministic UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run scoring smoke offline
        shell: bash
        env:
          SQ_APP_URL: http://127.0.0.1:8123/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 --directory dist >/tmp/sxp04-sidequest-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/smoke.js | tee sxp04-sidequest-smoke.txt

      - name: Run classic visual fit
        shell: bash
        env:
          SQ_APP_URL: http://127.0.0.1:8124/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sxp04-sidequest-fit-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sxp04-sidequest-visual-fit.txt

      - name: Stage generated runtime + offline preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sxp04-sidequest-write
          mkdir -p sxp04-sidequest-write/runtime
          cp index.html sxp04-sidequest-write/runtime/index.html
          mkdir -p sxp04-sidequest-write/runtime/src/legacy/styles sxp04-sidequest-write/runtime/src/legacy/scripts
          cp src/legacy/styles/inline-002.css sxp04-sidequest-write/runtime/src/legacy/styles/inline-002.css
          cp src/legacy/scripts/inline-005.js sxp04-sidequest-write/runtime/src/legacy/scripts/inline-005.js

          mkdir -p sxp04-sidequest-write/preview/sxp04-sidequest
          cp -a dist/. sxp04-sidequest-write/preview/sxp04-sidequest/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sxp04-sidequest-write/preview/sxp04-sidequest/index.html')
          s=p.read_text()
          guard='''<script id="sxp04-sidequest-offline-guard">(function(){var f=window.fetch;window.fetch=function(i,o){var u=String((i&&i.url)||i||"");if(/supabase\\.co/i.test(u))return Promise.reject(new TypeError("SXP-04 side quest preview blocks Supabase"));return f.apply(this,arguments)};try{var W=window.WebSocket;window.WebSocket=function(u,p){if(/supabase\\.co/i.test(String(u||"")))throw new Error("SXP-04 side quest preview blocks Supabase WebSocket");return new W(u,p)}}catch(_){}})();</script>'''
          s=s.replace('<head>','<head>\n'+guard,1)
          p.write_text(s)
          PY
          cat > sxp04-sidequest-write/preview/sxp04-sidequest/SXP04_SIDEQUEST_BUILD.txt <<EOF
          SXP-04 SIDE QUEST OFFLINE PREVIEW
          Source commit: ${GITHUB_SHA}
          Supabase requests are blocked in this visual/control preview.
          XP rules/data are unchanged; network-latency acceptance must be performed against the authorised live-data environment.
          Production main remains unchanged.
          EOF
          grep -q 'sxp04-sidequest-offline-guard' sxp04-sidequest-write/preview/sxp04-sidequest/index.html

      - name: Package generated outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sxp04-sidequest-write
          retention-days: 1
          include-hidden-files: true
          path: sxp04-sidequest-write/

      - name: Keep QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sxp04-sidequest-evidence
          retention-days: 14
          path: |
            sxp04-sidequest-smoke.txt
            sxp04-sidequest-visual-fit.txt
            sc031-vite-build-evidence.json

  commit-generated:
    needs: verify
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Confirm branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sxp-04-sidequest-xp-controls
          test "$(git rev-parse origin/sxp-04-sidequest-xp-controls)" = "${GITHUB_SHA}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sxp04-sidequest-write
          path: sxp04-sidequest-write

      - name: Apply only generated runtime and preview
        shell: bash
        run: |
          set -euo pipefail
          cp sxp04-sidequest-write/runtime/index.html index.html
          cp sxp04-sidequest-write/runtime/src/legacy/styles/inline-002.css src/legacy/styles/inline-002.css
          cp sxp04-sidequest-write/runtime/src/legacy/scripts/inline-005.js src/legacy/scripts/inline-005.js
          rm -rf preview/sxp04-sidequest
          mkdir -p preview
          cp -a sxp04-sidequest-write/preview/sxp04-sidequest preview/sxp04-sidequest
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -v '^sxp04-sidequest-write/' || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(index.html|src/legacy/styles/inline-002.css|src/legacy/scripts/inline-005.js|preview/sxp04-sidequest/)' || true)"
          if [ -n "$bad" ]; then
            echo 'Refusing generated write: unexpected changed paths:'
            echo "$bad"
            exit 1
          fi
          test -n "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/legacy/styles/inline-002.css src/legacy/scripts/inline-005.js preview/sxp04-sidequest
          git commit -m 'SXP-04: materialize side quest runtime and preview [skip ci]'
          git push origin HEAD:sxp-04-sidequest-xp-controls
