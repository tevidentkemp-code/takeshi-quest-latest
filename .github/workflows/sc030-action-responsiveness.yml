name: SC-030 action responsiveness

on:
  push:
    branches: [sc030-dmd-v2-modular]
    paths:
      - scripts/sc030-modernize-actions.mjs
      - tools/ui-smoke/verify-sc030-actions-runtime.js
      - .github/workflows/sc030-action-responsiveness.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc030-action-responsiveness
  cancel-in-progress: false

jobs:
  verify-action-responsiveness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Confirm production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Apply exact action responsiveness patch in verification workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sc030-actions-generated sc030-actions-write
          mkdir -p sc030-actions-generated sc030-actions-write
          node scripts/sc030-modernize-actions.mjs sc030-actions-generated/patch-evidence.json
          node --check src/live-game/live-v2.js
          git diff --check -- src/live-game/live-v2.js

      - name: Build compatibility core JS from patched semantic source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-core-js-from-source.mjs \
            --output sc030-actions-generated/inline-005.js \
            --evidence sc030-actions-generated/js-build-evidence.json \
            | tee sc030-actions-js-build-results.txt
          cp sc030-actions-generated/inline-005.js src/legacy/scripts/inline-005.js
          node --check src/legacy/scripts/inline-005.js
          git diff --check -- src/live-game/live-v2.js src/legacy/scripts/inline-005.js

      - name: Confirm modular and HTML source contracts remain current
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-modularization.mjs | tee sc030-actions-modular-results.txt
          node scripts/render-index-from-source.mjs \
            --output sc030-actions-generated/index.html \
            --evidence sc030-actions-generated/html-build-evidence.json \
            | tee sc030-actions-html-results.txt
          cmp -s sc030-actions-generated/index.html index.html

      - name: Stage exact verified write set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sc030-actions-write/src/live-game sc030-actions-write/src/legacy/scripts
          cp src/live-game/live-v2.js sc030-actions-write/src/live-game/live-v2.js
          cp src/legacy/scripts/inline-005.js sc030-actions-write/src/legacy/scripts/inline-005.js
          cp sc030-actions-generated/patch-evidence.json sc030-actions-write/patch-evidence.json
          cp sc030-actions-generated/js-build-evidence.json sc030-actions-write/js-build-evidence.json

      - name: Install deterministic UI test dependencies
        shell: bash
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run action responsiveness and full behaviour regression
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-sc030-actions-runtime.js | tee sc030-actions-focused-results.txt
          node tools/ui-smoke/verify-sc030-dmd-runtime.js | tee sc030-actions-dmd-runtime-results.txt
          node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc030-actions-undo-results.txt
          node tools/ui-smoke/verify-sc014.js | tee sc030-actions-setup-results.txt
          node tools/ui-smoke/smoke.js | tee sc030-actions-smoke-results.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc030-actions-classic-results.txt
          node tools/ui-smoke/verify-training-modes.js | tee sc030-actions-training-results.txt
          node tools/ui-smoke/verify-progression-modes.js | tee sc030-actions-progression-results.txt
          node tools/ui-smoke/verify-pstats.js | tee sc030-actions-pstats-results.txt
          node tools/ui-smoke/verify-p23.js | tee sc030-actions-admin-close-results.txt
          node tools/ui-smoke/verify-n5-stacking.js | tee sc030-actions-admin-stacking-results.txt

      - name: Package verified action write set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc030-actions-write
          retention-days: 1
          path: sc030-actions-write/

      - name: Keep action QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc030-actions-evidence
          retention-days: 7
          path: |
            sc030-actions-generated/
            sc030-actions-*-results.txt
            qa-artifacts

  commit-verified-actions:
    needs: verify-action-responsiveness
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Confirm branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sc030-dmd-v2-modular
          test "$(git rev-parse origin/sc030-dmd-v2-modular)" = "${GITHUB_SHA}"

      - name: Download verified action write set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sc030-actions-write
          path: sc030-actions-write

      - name: Validate and commit only semantic source plus generated JS
        shell: bash
        run: |
          set -euo pipefail
          expected=$'js-build-evidence.json\npatch-evidence.json\nsrc/legacy/scripts/inline-005.js\nsrc/live-game/live-v2.js'
          actual="$(find sc030-actions-write -type f -printf '%P\n' | sort)"
          test "$actual" = "$expected"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const patch = JSON.parse(fs.readFileSync('sc030-actions-write/patch-evidence.json', 'utf8'));
          const js = JSON.parse(fs.readFileSync('sc030-actions-write/js-build-evidence.json', 'utf8'));
          const current = fs.readFileSync('src/live-game/live-v2.js');
          const source = fs.readFileSync('sc030-actions-write/src/live-game/live-v2.js');
          const runtime = fs.readFileSync('sc030-actions-write/src/legacy/scripts/inline-005.js');
          if (patch.target !== 'src/live-game/live-v2.js') throw new Error('unexpected action patch target');
          if (patch.replacedSkipHandlers !== 3 || patch.skipHelperCount !== 1 || patch.undoHelperCount !== 1) throw new Error('unexpected action patch scope');
          if (patch.nonVsSkipDelayRemoved !== true || patch.nonVsUndoHardClearRemoved !== true || patch.undoBaselineResyncAdded !== true) throw new Error('action modernization contract incomplete');
          if (patch.vsShadowLegacyTimingPreserved !== true || patch.scoringFunctionChanged !== false || patch.rulesChanged !== false || patch.persistentDataChanged !== false) throw new Error('action safety contract changed');
          if (sha(current) !== patch.oldSha256) throw new Error('branch Live V2 source moved since verified patch input');
          if (sha(source) !== patch.newSha256) throw new Error('verified Live V2 source hash mismatch');
          if (js.authority !== 'semantic-js-source' || js.runtimeTarget !== 'src/legacy/scripts/inline-005.js') throw new Error('unexpected JS source authority');
          if (sha(runtime) !== js.runtimeSha256) throw new Error('generated core JS hash mismatch');
          NODE
          cp sc030-actions-write/src/live-game/live-v2.js src/live-game/live-v2.js
          cp sc030-actions-write/src/legacy/scripts/inline-005.js src/legacy/scripts/inline-005.js
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -v '^sc030-actions-write/' || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/live-game/live-v2\.js|src/legacy/scripts/inline-005\.js)$' || true)"
          if [ -n "$bad" ]; then
            echo "Refusing write: unexpected action files:"
            echo "$bad"
            exit 1
          fi
          git diff --check -- src/live-game/live-v2.js src/legacy/scripts/inline-005.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/live-game/live-v2.js src/legacy/scripts/inline-005.js
          git commit -m "SC-030: make Skip immediate and preserve Undo DMD state [skip ci]"
          git push origin HEAD:sc030-dmd-v2-modular
