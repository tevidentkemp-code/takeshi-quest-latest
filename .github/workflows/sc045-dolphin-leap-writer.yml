name: SC-045 dolphin leap writer
on:
  push:
    branches: [sc045-dmd-arcade-language]
    paths:
      - tools/sc045_dolphin_leap_polish.py
      - .github/workflows/sc045-dolphin-leap-writer.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sc045-dmd-arcade-language
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Apply final dolphin silhouette
        run: python3 tools/sc045_dolphin_leap_polish.py
      - name: Verify source integrity and build
        run: |
          set -euo pipefail
          node --check src/legacy/scripts/inline-007.js
          npm ci --prefix scripts --ignore-scripts
          node scripts/verify-modularization.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
          git diff --check
      - name: Prove bounded write set
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'src/legacy/intentional-patches.json\nsrc/legacy/scripts/inline-007.js'
      - name: Commit verified renderer polish
        run: |
          set -euo pipefail
          git config user.name 'shateki-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/legacy/scripts/inline-007.js src/legacy/intentional-patches.json
          git commit -m 'SC-045: make dolphin unmistakably dolphin'
          git push origin HEAD:sc045-dmd-arcade-language
