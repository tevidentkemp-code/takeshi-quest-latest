name: SC-013 extract target analytics source
on:
  push:
    branches: [fix/sc013-spider-scale-eligibility]
    paths: [.github/workflows/sc013-extract.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sc013-spider-scale-eligibility
      - name: Extract exact target areas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          out=Path('_sc013_extract'); out.mkdir(exist_ok=True)
          markers={
            'radar':'function drawRadar',
            'spider':'window.openPlayerSpiderDialog',
            'hit-ranks':'Target Hit % global rank source used',
            'points-ranks':'Target Points % global rank source used',
            'compare':'function __sqBuildTargetComparePlayers',
            'wire':'function __sqWireBoardInspect',
          }
          for name, marker in markers.items():
            i=s.find(marker)
            if i<0:
              Path(out/f'{name}.txt').write_text(f'MARKER NOT FOUND: {marker}\n')
              continue
            a=max(0,i-12000); b=min(len(s),i+30000)
            Path(out/f'{name}.txt').write_text(s[a:b])
            print(name, i, a, b)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _sc013_extract
          git commit -m 'SC-013: extract exact target analytics source' || exit 0
          git push
