name: SC-034 dedicated probe

on:
  push:
    branches: [sc034-dedicated-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc034-dedicated-probe
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install source tooling
        run: npm ci --prefix scripts --ignore-scripts
      - name: Verify source authority and build
        run: |
          node scripts/verify-modularization.mjs
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/build-core-styles-from-source.mjs --verify-current
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: SC-034 source only
        env:
          SQ_APP_URL: http://127.0.0.1:8123/index.html
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc034-probe-source.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          timeout 180s node tools/ui-smoke/verify-sc034-add-player.js
      - name: SC-034 dist only
        env:
          SQ_APP_URL: http://127.0.0.1:8124/index.html
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc034-probe-dist.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          timeout 180s node tools/ui-smoke/verify-sc034-add-player.js
