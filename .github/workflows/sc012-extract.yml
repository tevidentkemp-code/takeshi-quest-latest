name: SC-012 temporary target source extract
on:
  push:
    branches: [feature/sc012-target-rankings-spider-compare]
    paths: [.github/workflows/sc012-extract.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sc012-target-rankings-spider-compare
      - name: Extract relevant target UI source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text().splitlines()
          p=Path('_sc012_extract'); p.mkdir(exist_ok=True)
          ranges={
            'target-fetch-core.txt':(40600,41780),
            'spider-core.txt':(43600,44480),
            'modern-target-ui.txt':(52200,53180)
          }
          for fn,(a,b) in ranges.items():
            (p/fn).write_text('\n'.join(f'{i+1}: {lines[i]}' for i in range(a-1,min(b,len(lines)))))
          PY
      - name: Commit extract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _sc012_extract/*.txt
          git commit -m 'SC-012: refresh focused target UI extracts' || exit 0
          git push
