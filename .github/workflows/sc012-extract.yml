name: SC-012 temporary target source extract
on:
  push:
    branches: [feature/sc012-target-rankings-spider-compare]
    paths: [.github/workflows/sc012-extract.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sc012-target-rankings-spider-compare
      - name: Extract relevant target UI source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text().splitlines()
          specs=[
            ('hit-dialog','openPlayerTargetHitDialog'),
            ('points-dialog','openPlayerTargetPointsDialog'),
            ('hit-fetch','__sqFetchPlayerTargetHitPctRows'),
            ('points-fetch','__sqFetchPlayerTargetPointsPctRows'),
            ('spider','openPlayerSpiderDialog'),
            ('area-hit','showPlayerAreaSummary'),
            ('area-points','showPlayerPointsAreaSummary'),
            ('target-pct','__sqTargetPct'),
            ('rank-text','P #'),
            ('global-rank','globalRank'),
            ('player-rank','playerRank')
          ]
          p=Path('_sc012_extract'); p.mkdir(exist_ok=True)
          for label,needle in specs:
            hits=[i for i,l in enumerate(lines) if needle in l]
            out=['===== '+needle+' HITS '+str([h+1 for h in hits])+' =====']
            for h in hits[:20]:
              a=max(0,h-220); b=min(len(lines),h+900)
              out.append('\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b)))
            (p/(label+'.txt')).write_text('\n\n'.join(out))
          PY
      - name: Commit extract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _sc012_extract/*.txt
          git commit -m 'SC-012: refresh temporary target UI extracts' || exit 0
          git push
