name: SC-042 source authority regeneration
on:
  push:
    branches:
      - sc042-postgame-acceptance-hotfix-v2
    paths:
      - .github/workflows/sc042-source-authority-writer.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sc042-postgame-acceptance-hotfix-v2
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Regenerate semantic compatibility runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts --ignore-scripts
          node scripts/build-core-js-from-source.mjs --output src/legacy/scripts/inline-005.js
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/verify-modularization.mjs
          node --check src/legacy/scripts/inline-005.js
      - name: Prove bounded generated write
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "src/legacy/scripts/inline-005.js"
          git diff --check
      - name: Commit generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "shateki-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/legacy/scripts/inline-005.js
          git commit -m "SC-042: regenerate compatibility runtime"
          git push origin HEAD:sc042-postgame-acceptance-hotfix-v2
