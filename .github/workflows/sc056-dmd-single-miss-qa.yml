name: SC-056 DMD Single Miss QA
on:
  pull_request:
    paths:
      - src/live-game/live-v2.js
      - src/legacy/scripts/inline-005.js
      - tools/ui-smoke/verify-sc056-dmd-single-miss.mjs
      - tools/ui-smoke/verify-sc056-dmd-single-miss.js
      - assets/release-metadata.json
      - .github/workflows/sc056-dmd-single-miss-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install architecture tooling
        run: npm ci --prefix scripts --ignore-scripts
      - name: Static contract
        run: |
          set -euo pipefail
          node --check src/live-game/live-v2.js
          node --check tools/ui-smoke/verify-sc056-dmd-single-miss.mjs
          node --check tools/ui-smoke/verify-sc056-dmd-single-miss.js
          node tools/ui-smoke/verify-sc056-dmd-single-miss.mjs
          node scripts/build-core-js-from-source.mjs --verify-current
      - name: Build exact candidate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Source and dist single-MISS acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc056-source.log 2>&1 & spid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc056-dist.log 2>&1 & dpid=$!
          trap 'kill "$spid" "$dpid" || true' EXIT
          SQ_APP_URL=http://127.0.0.1:8123/index.html node tools/ui-smoke/verify-sc056-dmd-single-miss.js
          SQ_APP_URL=http://127.0.0.1:8124/index.html node tools/ui-smoke/verify-sc056-dmd-single-miss.js
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
