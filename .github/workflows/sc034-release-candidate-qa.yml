name: SC-034 live Add Player QA

on:
  push:
    branches: [sc034-live-add-player]
    paths:
      - src/**
      - tools/ui-smoke/**
      - scripts/**
      - package.json
      - package-lock.json
      - vite.config.*
      - .github/workflows/sc034-release-candidate-qa.yml
  pull_request:
    paths:
      - src/**
      - tools/ui-smoke/**
      - scripts/**
      - package.json
      - package-lock.json
      - vite.config.*
      - .github/workflows/sc034-release-candidate-qa.yml

permissions:
  contents: read

concurrency:
  group: sc034-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Confirm accepted SC-033 ancestry and clean delivery surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sc033-auto-throw-order
          git merge-base --is-ancestor fb959555b692af32d9381b46a0513e59b199c769 HEAD
          git diff --check fb959555b692af32d9381b46a0513e59b199c769...HEAD

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Verify semantic source authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-modularization.mjs | tee sc034-modular.txt
          node scripts/build-core-js-from-source.mjs --verify-current | tee sc034-js-authority.txt
          node scripts/build-core-styles-from-source.mjs --verify-current | tee sc034-css-authority.txt
          node --check src/app/router-ui.js
          node --check src/game/engine.js
          node --check src/legacy/scripts/inline-030.js
          node --check tools/ui-smoke/verify-sc034-add-player.js

      - name: Build exact stacked candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee sc034-vite-build.txt
          npm run verify:dist | tee sc034-dist-verify.txt

      - name: Install deterministic browser QA
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Source runtime acceptance
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts-sc034-source
          SQ_APP_URL: http://127.0.0.1:8123/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc034-source.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          timeout 180s node tools/ui-smoke/verify-sc034-add-player.js | tee sc034-source-add-player.txt
          timeout 180s node tools/ui-smoke/verify-sc033-throw-order.js | tee sc034-source-sc033.txt
          node tools/ui-smoke/smoke.js | tee sc034-source-smoke.txt
          node tools/ui-smoke/verify-sc014.js | tee sc034-source-setup.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc034-source-classic.txt
          node tools/ui-smoke/verify-sc042-record-integrity.js | tee sc034-source-record.txt
          node tools/ui-smoke/verify-sc045-dmd-arcade.js | tee sc034-source-dmd.txt
          node tools/ui-smoke/verify-cloud-failure-resilience.js | tee sc034-source-cloud.txt

      - name: Built dist runtime acceptance
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts-sc034-dist
          SQ_APP_URL: http://127.0.0.1:8124/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc034-dist.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          timeout 180s node tools/ui-smoke/verify-sc034-add-player.js | tee sc034-dist-add-player.txt
          timeout 180s node tools/ui-smoke/verify-sc033-throw-order.js | tee sc034-dist-sc033.txt
          node tools/ui-smoke/smoke.js | tee sc034-dist-smoke.txt
          node tools/ui-smoke/verify-sc042-record-integrity.js | tee sc034-dist-record.txt
          node tools/ui-smoke/verify-cloud-failure-resilience.js | tee sc034-dist-cloud.txt

      - name: Final candidate cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check fb959555b692af32d9381b46a0513e59b199c769...HEAD
          git status --short

      - name: Keep SC-034 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sc034-release-candidate-evidence
          retention-days: 14
          path: |
            sc034-*.txt
            qa-artifacts-sc034-source/
            qa-artifacts-sc034-dist/
