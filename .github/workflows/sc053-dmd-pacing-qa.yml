name: SC-053 DMD Pacing + Motion QA
on:
  pull_request:
    paths:
      - src/game/engine.js
      - src/live-game/live-v2.js
      - src/legacy/scripts/inline-005.js
      - src/legacy/scripts/inline-007.js
      - src/legacy/scripts/inline-025.js
      - src/legacy/intentional-patches.json
      - tools/ui-smoke/verify-sc053-dmd-pacing.mjs
      - tools/ui-smoke/verify-sc053-dmd-pacing.js
      - .github/workflows/sc053-dmd-pacing-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install architecture tooling
        run: npm ci --prefix scripts --ignore-scripts
      - name: Renderer evidence
        run: |
          sha256sum src/legacy/scripts/inline-007.js src/legacy/scripts/inline-025.js
          wc -c src/legacy/scripts/inline-007.js src/legacy/scripts/inline-025.js
      - name: Static pacing + motion contracts
        run: |
          node --check src/game/engine.js
          node --check src/live-game/live-v2.js
          node --check src/legacy/scripts/inline-007.js
          node --check tools/ui-smoke/verify-sc053-dmd-pacing.mjs
          node --check tools/ui-smoke/verify-sc053-dmd-pacing.js
          node tools/ui-smoke/verify-sc053-dmd-pacing.mjs
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/verify-modularization.mjs
      - name: Build exact candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Source and dist animation acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc053-source.log 2>&1 & spid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc053-dist.log 2>&1 & dpid=$!
          trap 'kill "$spid" "$dpid" || true' EXIT
          export SQ_APP_URL=http://127.0.0.1:8123/index.html
          node tools/ui-smoke/verify-sc053-dmd-pacing.js
          node tools/ui-smoke/verify-sc032-dmd-runtime.js
          node tools/ui-smoke/verify-sc045-dmd-arcade.js
          export SQ_APP_URL=http://127.0.0.1:8124/index.html
          node tools/ui-smoke/verify-sc053-dmd-pacing.js
          node tools/ui-smoke/verify-sc032-dmd-runtime.js
          node tools/ui-smoke/verify-sc045-dmd-arcade.js
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
