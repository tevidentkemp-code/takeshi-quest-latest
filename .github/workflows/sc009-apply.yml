name: SC009 apply and QA
on:
  push:
    branches:
      - fix/sc009-achievement-ui-parity

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[sc009-applied]') && !contains(github.event.head_commit.message, '[sc009-qa-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded SC-009 client patch
        run: python tools/sc009_patch.py
      - name: Static source guards and app-script syntax
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          req=["code:'david_and_goliath'","name:'Mini Maxi'","name:'Maxi'","name:'Mini D’s'","name:'Double D’s'","name:'Sharpshooter’s Game'","section('Trophies / Awards'",'function __sqMisfireCase','function __sqMisfireDetail','uniqueWon && neverBehind']
          missing=[x for x in req if x not in s]
          if missing: raise SystemExit('missing '+repr(missing))
          if s.count("code:'david_and_goliath'") != 1: raise SystemExit('duplicate D&G')
          if "if (best >= 14) add('untouchable')" in s: raise SystemExit('legacy Untouchable detector remains')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          hits=[x for x in scripts if 'const SQ_ACH =' in x and 'openPlayerStatsDialog' in x]
          if len(hits)!=1: raise SystemExit(f'expected one app script, got {len(hits)}')
          Path('/tmp/sc009-app.js').write_text(hits[0],encoding='utf-8')
          print('static guards PASS')
      - name: Syntax check application script
        run: node --check /tmp/sc009-app.js
      - name: Install smoke dependencies
        working-directory: tools/ui-smoke
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tools/ui-smoke
        run: npx playwright install --with-deps chromium
      - name: Serve app
        shell: bash
        run: |
          python3 -m http.server 8123 >/tmp/sc009-http.log 2>&1 &
          echo $! >/tmp/sc009-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8123/index.html >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/sc009-http.log
          exit 1
      - name: Prepare legacy screenshot directory
        run: |
          sudo mkdir -p /home/user/takeshi-quest-latest/docs/ui-audit/screenshots
          sudo chown -R "$USER":"$USER" /home/user/takeshi-quest-latest
      - name: Run regressions and capture output
        working-directory: tools/ui-smoke
        shell: bash
        run: |
          set +e
          : > /tmp/sc009-qa-report.txt
          fail=0
          for spec in "verify-pstats.js|Player Stats regression" "verify-sc008.js|SC-008 regression" "verify-sc009.js|SC-009 regression" "smoke.js|Full mobile smoke"; do
            file="${spec%%|*}"
            label="${spec#*|}"
            echo "===== $label ($file) =====" | tee -a /tmp/sc009-qa-report.txt
            node "$file" 2>&1 | tee -a /tmp/sc009-qa-report.txt
            rc=${PIPESTATUS[0]}
            echo "EXIT=$rc" | tee -a /tmp/sc009-qa-report.txt
            echo | tee -a /tmp/sc009-qa-report.txt
            if [ "$rc" -ne 0 ]; then fail=1; fi
          done
          echo "$fail" > /tmp/sc009-qa-failed
          exit 0
      - name: Persist diagnostics if any regression failed
        shell: bash
        run: |
          if [ "$(cat /tmp/sc009-qa-failed)" = "0" ]; then exit 0; fi
          cp /tmp/sc009-qa-report.txt .sc009/qa-report.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .sc009/qa-report.txt
          git commit -m "[sc009-qa-output] capture regression diagnostics"
          git push
          exit 1
      - name: Commit patched client
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "[sc009-applied] canonical achievement UI parity"
          git push
