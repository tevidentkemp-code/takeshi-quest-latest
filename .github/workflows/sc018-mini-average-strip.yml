name: SC-018 mini average strip QA
on:
  push:
    branches: [sc018-mini-average-strip]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded SC-018 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          replacements = [
              (
                  '.livev2panel .v2MiniAvg{\n  min-height:24px;',
                  '.livev2panel .v2MiniAvg{\n  min-height:48px;'
              ),
              (
                  '<span class="v2MiniMetric"><span class="v2MiniLab">3R AV</span><strong id="v2Mini3R${i}">–</strong></span>',
                  '<span class="v2MiniMetric"><span class="v2MiniLab">3AV</span><strong id="v2Mini3R${i}">–</strong></span>'
              ),
              (
                  '<span class="v2MiniMetric"><span class="v2MiniLab">MTC AV</span><strong id="v2MiniMtc${i}">–</strong></span>',
                  '<span class="v2MiniMetric"><span class="v2MiniLab">MAV</span><strong id="v2MiniMtc${i}">–</strong></span>'
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'index replacement count {count}, expected 1: {old[:80]!r}')
              s = s.replace(old, new, 1)
          index.write_text(s)

          test = Path('tools/ui-smoke/verify-classic-visual-fit.js')
          t = test.read_text()
          replacements = [
              ("includes('3R AV'), '3R AV label present'", "includes('3AV'), '3AV label present'"),
              ("includes('MTC AV'), 'MTC AV label present'", "includes('MAV'), 'MAV label present'"),
              ("'rendered 3R AV matches helper'", "'rendered 3AV matches helper'"),
              ("'rendered MTC AV matches helper'", "'rendered MAV matches helper'"),
              ("console.log('PASS compact 3R AV / MTC AV strip');", "console.log('PASS doubled 3AV / MAV strip');"),
              (
                  "return {gap:pad.top-panel.bottom, height:host.height, width:host.width, canvasWidth:canvas.getBoundingClientRect().width, overflow:document.documentElement.scrollWidth>innerWidth+1};",
                  "const mini=document.querySelector('#liveV2Panel .v2MiniAvg[data-p=\"0\"]');\n        const miniRect=mini?.getBoundingClientRect();\n        const miniMetrics=[...document.querySelectorAll('#liveV2Panel .v2MiniMetric')];\n        return {gap:pad.top-panel.bottom, height:host.height, width:host.width, canvasWidth:canvas.getBoundingClientRect().width, overflow:document.documentElement.scrollWidth>innerWidth+1, miniHeight:miniRect?.height||0, miniOverflow:miniMetrics.some(el=>el.scrollWidth>el.clientWidth+1)};"
              ),
              (
                  "assert(!fit.overflow, 'no horizontal overflow');\n      assert(Math.abs(fit.canvasWidth-fit.width)<2,'canvas fits actual host width');",
                  "assert(!fit.overflow, 'no horizontal overflow');\n      assert(!fit.miniOverflow, '3AV / MAV metrics fit their rectangle width');\n      assert(fit.miniHeight>=47.5 && fit.miniHeight<=49.5, 'mini-average rectangle is doubled from 24px to 48px');\n      assert(Math.abs(fit.canvasWidth-fit.width)<2,'canvas fits actual host width');"
              ),
          ]
          for old, new in replacements:
              count = t.count(old)
              if count != 1:
                  raise SystemExit(f'test replacement count {count}, expected 1: {old[:100]!r}')
              t = t.replace(old, new, 1)
          test.write_text(t)
          PY
          rm .github/workflows/sc018-mini-average-strip.yml
          git diff --check
          git diff -- index.html tools/ui-smoke/verify-classic-visual-fit.js
      - name: Install existing test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run targeted visual regression
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-classic-visual-fit.js | tee classic-visual-results.txt
      - name: Run full scoring smoke
        run: |
          set -o pipefail
          node tools/ui-smoke/smoke.js | tee smoke-results.txt
      - name: Commit tested bounded patch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/ui-smoke/verify-classic-visual-fit.js .github/workflows/sc018-mini-average-strip.yml
          git commit -m 'fix(sc018): resize and relabel live averages'
          git push origin HEAD:sc018-mini-average-strip
      - name: Keep QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc018-mini-average-evidence
          path: |
            qa-artifacts
            *-results.txt
