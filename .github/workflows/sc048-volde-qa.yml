name: SC-048 Volde Misfires QA
on:
  pull_request:
    paths:
      - src/live-game/xp-breakdown.mjs
      - src/ui/modals.js
      - src/legacy/scripts/inline-005.js
      - supabase/migrations/20260921190000_sc048_volde_misfires.sql
      - tools/ui-smoke/verify-sc048-volde.mjs
      - tools/ui-smoke/verify-sc008.js
      - tools/ui-smoke/verify-sc009.js
      - tools/ui-smoke/verify-sc010.js
      - .github/workflows/sc048-volde-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install architecture tooling
        run: npm ci --prefix scripts --ignore-scripts
      - name: Volde contracts
        run: |
          node --check src/live-game/xp-breakdown.mjs
          node --check src/ui/modals.js
          node --check tools/ui-smoke/verify-sc048-volde.mjs
          node tools/ui-smoke/verify-sc048-volde.mjs
          node tools/ui-smoke/verify-sc038-xp-breakdown.mjs
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/verify-modularization.mjs
      - name: Build exact candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Source and dist Misfire acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc048-source.log 2>&1 & spid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc048-dist.log 2>&1 & dpid=$!
          trap 'kill "$spid" "$dpid" || true' EXIT
          export SQ_APP_URL=http://127.0.0.1:8123/index.html
          node tools/ui-smoke/verify-sc009.js
          node tools/ui-smoke/verify-sc010.js
          node tools/ui-smoke/verify-sc038-ui.js
          export SQ_APP_URL=http://127.0.0.1:8124/index.html
          node tools/ui-smoke/verify-sc009.js
          node tools/ui-smoke/verify-sc010.js
          node tools/ui-smoke/verify-sc038-ui.js
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
