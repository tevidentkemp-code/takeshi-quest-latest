name: SC-048 Volde Misfires QA
on:
  pull_request:
    paths:
      - 'assets/release-metadata.json'
      - 'src/live-game/xp-breakdown.mjs'
      - 'src/ui/modals.js'
      - 'src/legacy/scripts/inline-005.js'
      - 'supabase/migrations/*sc048*'
      - 'supabase/rollback/*sc048*'
      - 'tools/ui-smoke/verify-sc008.js'
      - 'tools/ui-smoke/verify-sc009.js'
      - 'tools/ui-smoke/verify-sc010.js'
      - 'tools/ui-smoke/verify-sc038-xp-breakdown.mjs'
      - 'tools/ui-smoke/verify-sc048-volde.mjs'
      - 'tools/ui-smoke/verify-sc050-release-notes.mjs'
      - '.github/workflows/sc048-volde-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
      - run: npm ci
      - name: Install architecture tooling
        run: npm ci --prefix scripts --ignore-scripts
      - name: Static Volde and release contracts
        run: |
          node --check src/live-game/xp-breakdown.mjs
          node --check src/ui/modals.js
          node tools/ui-smoke/verify-sc048-volde.mjs
          node tools/ui-smoke/verify-sc038-xp-breakdown.mjs
          node tools/ui-smoke/verify-sc050-release-notes.mjs
          node scripts/build-core-js-from-source.mjs --verify-current
      - name: Build exact candidate
        run: |
          npm run materialize
          npm run build
          npm run verify:dist
      - name: Install browser QA
        run: |
          npm ci --prefix tools/ui-smoke --ignore-scripts
          npx --prefix tools/ui-smoke playwright install --with-deps chromium
      - name: Source and dist affected-flow regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc048-source.log 2>&1 &
          spid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc048-dist.log 2>&1 &
          dpid=$!
          trap 'kill "$spid" "$dpid" || true' EXIT
          node tools/ui-smoke/verify-sc008.js
          node tools/ui-smoke/verify-sc009.js
          node tools/ui-smoke/verify-sc010.js
          node tools/ui-smoke/verify-sc038-ui.js
          node tools/ui-smoke/verify-sc050-release-notes.js
          SQ_APP_URL=http://127.0.0.1:8124/index.html node tools/ui-smoke/verify-sc008.js
          SQ_APP_URL=http://127.0.0.1:8124/index.html node tools/ui-smoke/verify-sc009.js
          SQ_APP_URL=http://127.0.0.1:8124/index.html node tools/ui-smoke/verify-sc010.js
          SQ_APP_URL=http://127.0.0.1:8124/index.html node tools/ui-smoke/verify-sc038-ui.js
          SQ_APP_URL=http://127.0.0.1:8124/index.html node tools/ui-smoke/verify-sc050-release-notes.js
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
