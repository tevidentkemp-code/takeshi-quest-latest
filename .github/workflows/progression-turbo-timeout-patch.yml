name: Progression Turbo timeout patch

on:
  push:
    branches:
      - fix/progression-turbo-timeout

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/progression-turbo-timeout
          fetch-depth: 0

      - name: Apply bounded Progression Turbo read patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"  async function fetchModeScores\(mode\)\{\n.*?\n  \}\n\n  async function loadMode\(mode\)\{",
              re.S,
          )
          new_fetch = (
              "  async function fetchModeScores(mode){\n"
              "    const client = window.sb || (typeof sb !== 'undefined' ? sb : null);\n"
              "    if (!client || typeof client.from !== 'function') throw new Error('Supabase client unavailable');\n"
              "\n"
              "    if (mode === 'turbo'){\n"
              "      const { data, error } = await client\n"
              "        .from('v_games_turbo_clean')\n"
              "        .select('id,created_at,state,totals')\n"
              "        .order('created_at', { ascending:true })\n"
              "        .limit(5000);\n"
              "      if (error) throw error;\n"
              "\n"
              "      const wanted = String(name || '').trim().toLowerCase();\n"
              "      return (Array.isArray(data) ? data : [])\n"
              "        .map(g=>{\n"
              "          const state = g && g.state && typeof g.state === 'object' ? g.state : {};\n"
              "          const players = Array.isArray(state.players) ? state.players : [];\n"
              "          const idx = players.findIndex(p=>{\n"
              "            const playerName = (p && typeof p === 'object') ? p.name : p;\n"
              "            return String(playerName || '').trim().toLowerCase() === wanted;\n"
              "          });\n"
              "          if (idx < 0) return NaN;\n"
              "          const totals = Array.isArray(g && g.totals) ? g.totals : [];\n"
              "          return Number(totals[idx]);\n"
              "        })\n"
              "        .filter(v=>Number.isFinite(v) && v >= 0);\n"
              "    }\n"
              "\n"
              "    const { data, error } = await client\n"
              "      .from('v_player_game_scores_official_clean')\n"
              "      .select('game_id,ts,player_name,score')\n"
              "      .ilike('player_name', name)\n"
              "      .order('ts', { ascending:true })\n"
              "      .limit(5000);\n"
              "    if (error) throw error;\n"
              "    return (Array.isArray(data) ? data : [])\n"
              "      .map(r=>Number(r && r.score))\n"
              "      .filter(v=>Number.isFinite(v) && v >= 0);\n"
              "  }"
          )

          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected one bounded Progression fetchModeScores block, found {len(matches)}')
          replacement = new_fetch + "\n\n  async function loadMode(mode){"
          text = pattern.sub(lambda _m: replacement, text, count=1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Diff integrity
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI smoke dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start local app server
        run: |
          python3 -m http.server 8123 >/tmp/shateki-http.log 2>&1 &
          echo $! >/tmp/shateki-http.pid
          sleep 2

      - name: Verify Progression mode isolation and Turbo timeout path
        working-directory: tools/ui-smoke
        run: node verify-progression-modes.js

      - name: Run full UI smoke suite
        working-directory: tools/ui-smoke
        run: node smoke.js

      - name: Commit verified index patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: avoid Turbo progression score-view timeout'
          git push origin HEAD:fix/progression-turbo-timeout
