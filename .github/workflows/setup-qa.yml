name: Setup regression QA
on:
  pull_request:
    paths:
      - index.html
      - tools/ui-smoke/**
      - .github/workflows/setup-qa.yml
  push:
    branches: [sc014-setup-intake-polish]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded SC-020 race-reference patch on head branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = "      const RP = []; for (let i = 0; i < recTo; i++){ if (recData[i] != null) RP.push([X(i), Math.max(padT, Y(recData[i]))]); }"
          new = """      const RP = [];
          for (let i = 0; i < recTo; i++){
            if (recData[i] == null) continue;
            const x = X(i), rawY = Y(recData[i]);
            if (rawY >= padT){ RP.push([x, rawY]); continue; }
            if (RP.length){
              const prev = RP[RP.length - 1], span = rawY - prev[1];
              const t = span ? Math.max(0, Math.min(1, (padT - prev[1]) / span)) : 1;
              RP.push([prev[0] + (x - prev[0]) * t, padT]);
            } else RP.push([x, padT]);
            break;
          }"""
          if old in text:
            text = text.replace(old, new, 1)
          elif 'const x = X(i), rawY = Y(recData[i]);' not in text:
            raise SystemExit('SC-020 index target not found')

          bad_indent = """      const RP = [];
          for (let i = 0; i < recTo; i++){
          if (recData[i] == null) continue;
          const x = X(i), rawY = Y(recData[i]);
          if (rawY >= padT){ RP.push([x, rawY]); continue; }
          if (RP.length){
          const prev = RP[RP.length - 1], span = rawY - prev[1];
          const t = span ? Math.max(0, Math.min(1, (padT - prev[1]) / span)) : 1;
          RP.push([prev[0] + (x - prev[0]) * t, padT]);
          } else RP.push([x, padT]);
          break;
          }"""
          good_indent = "      const RP = [];\n      for (let i = 0; i < recTo; i++){\n        if (recData[i] == null) continue;\n        const x = X(i), rawY = Y(recData[i]);\n        if (rawY >= padT){ RP.push([x, rawY]); continue; }\n        if (RP.length){\n          const prev = RP[RP.length - 1], span = rawY - prev[1];\n          const t = span ? Math.max(0, Math.min(1, (padT - prev[1]) / span)) : 1;\n          RP.push([prev[0] + (x - prev[0]) * t, padT]);\n        } else RP.push([x, padT]);\n        break;\n      }"
          # YAML block indentation can strip the visual leading whitespace above;
          # normalise the generated JS block to the source file's six-space level.
          raw_bad = "      const RP = [];\nfor (let i = 0; i < recTo; i++){\n  if (recData[i] == null) continue;\n  const x = X(i), rawY = Y(recData[i]);\n  if (rawY >= padT){ RP.push([x, rawY]); continue; }\n  if (RP.length){\n    const prev = RP[RP.length - 1], span = rawY - prev[1];\n    const t = span ? Math.max(0, Math.min(1, (padT - prev[1]) / span)) : 1;\n    RP.push([prev[0] + (x - prev[0]) * t, padT]);\n  } else RP.push([x, padT]);\n  break;\n}"
          if raw_bad in text:
            text = text.replace(raw_bad, good_indent, 1)
          index.write_text(text)

          test = Path('tools/ui-smoke/verify-classic-visual-fit.js')
          t = test.read_text()
          old_out = "      const out={max:motion.maxV,last:recordPath[recordPath.length-1]||null,minY:recordPath.length?Math.min(...recordPath.map(p=>p[1])):null};"
          new_out = "      const topY=19; const out={max:motion.maxV,last:recordPath[recordPath.length-1]||null,topHits:recordPath.filter(p=>Math.abs(p[1]-topY)<.75).length,pathLen:recordPath.length};"
          old_assert = "    assert(graph.last&&graph.last[0]>370,'high-score reference reaches the final round');\n    assert(graph.minY>=18,'off-scale high-score continuation stays visibly inside the chart');\n    console.log('PASS local graph scale with full high-score reference');"
          new_assert = "    assert(graph.last&&Math.abs(graph.last[1]-19)<.75,'high-score reference terminates at chart ceiling');\n    assert.equal(graph.topHits,1,'high-score reference hits the chart ceiling once without a horizontal plateau');\n    assert(graph.pathLen<14,'off-scale high-score continuation is not drawn across later rounds');\n    console.log('PASS local graph scale with clipped high-score reference');"
          changed = False
          if old_out in t:
            t = t.replace(old_out, new_out, 1); changed = True
          elif 'topHits:recordPath.filter' not in t:
            raise SystemExit('SC-020 visual-test output target not found')
          if old_assert in t:
            t = t.replace(old_assert, new_assert, 1); changed = True
          elif 'high-score reference hits the chart ceiling once without a horizontal plateau' not in t:
            raise SystemExit('SC-020 visual-test assertion target not found')
          if changed: test.write_text(t)
          PY
          if git diff --quiet -- index.html tools/ui-smoke/verify-classic-visual-fit.js; then
            echo 'SC-020 patch already present; no branch write needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html tools/ui-smoke/verify-classic-visual-fit.js
            git commit -m 'style(sc020): align bounded race-reference patch'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install existing test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD -- .github/workflows/setup-qa.yml tools/ui-smoke index.html
      - name: Run setup and full scoring journey offline
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-sc014.js | tee setup-results.txt
          node tools/ui-smoke/smoke.js | tee smoke-results.txt
          node tools/ui-smoke/verify-saveplayer-card.js | tee saved-player-results.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee classic-visual-results.txt
      - name: Keep review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-qa-evidence
          path: |
            qa-artifacts
            *-results.txt
