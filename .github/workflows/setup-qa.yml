name: Setup regression QA

on:
  pull_request:
    paths:
      - index.html
      - src/**
      - tools/ui-smoke/**
      - package.json
      - package-lock.json
      - vite.config.*
      - .github/workflows/setup-qa.yml
  push:
    branches: [sc014-setup-intake-polish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0

      - name: Install deterministic test dependencies
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD -- .github/workflows/setup-qa.yml tools/ui-smoke src index.html

      - name: Run setup and full scoring journey offline
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-sc028.js | tee sc028-results.txt
          node tools/ui-smoke/verify-pstats.js | tee pstats-results.txt
          node tools/ui-smoke/verify-sc008.js | tee sc008-results.txt
          node tools/ui-smoke/verify-sc009.js | tee sc009-results.txt
          node tools/ui-smoke/verify-sc010.js | tee sc010-results.txt
          node tools/ui-smoke/verify-sc025.js | tee sc025-results.txt
          node tools/ui-smoke/verify-sc014.js | tee setup-results.txt
          node tools/ui-smoke/smoke.js | tee smoke-results.txt
          node tools/ui-smoke/verify-saveplayer-card.js | tee saved-player-results.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee classic-visual-results.txt

      - name: Keep review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setup-qa-evidence
          retention-days: 14
          path: |
            qa-artifacts
            *-results.txt
