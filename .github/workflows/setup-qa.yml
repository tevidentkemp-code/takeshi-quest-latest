name: Setup regression QA
on:
  pull_request:
    paths:
      - index.html
      - tools/ui-smoke/**
      - .github/workflows/setup-qa.yml
  push:
    branches: [sc014-setup-intake-polish]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Temporary SC-021 live chart source extraction
        run: python3 tools/ui-smoke/extract-sc021-live-chart.py | tee sc021-extract.txt
      - name: Keep temporary inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: sc021-source-extract
          path: sc021-extract.txt
