name: Setup regression QA
on:
  pull_request:
    paths:
      - index.html
      - tools/ui-smoke/**
      - .github/workflows/setup-qa.yml
  push:
    branches: [sc014-setup-intake-polish]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded SC-019 Turbo High Score repair
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: python3 tools/ui-smoke/apply-sc019-patch.py
      - name: Commit bounded SC-019 patch if needed
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- index.html tools/ui-smoke/league-fixture.js tools/ui-smoke/verify-league-arcade.js; then
            echo 'SC-019 patch already present.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html tools/ui-smoke/league-fixture.js tools/ui-smoke/verify-league-arcade.js
            git commit -m 'fix(sc019): restore Turbo High Score League from clean materialized feed'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install existing test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD -- .github/workflows/setup-qa.yml tools/ui-smoke index.html
      - name: Run league regression
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-league-arcade.js | tee league-results.txt
      - name: Run setup and full scoring journey offline
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -o pipefail
          node tools/ui-smoke/verify-sc014.js | tee setup-results.txt
          node tools/ui-smoke/smoke.js | tee smoke-results.txt
          node tools/ui-smoke/verify-saveplayer-card.js | tee saved-player-results.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee classic-visual-results.txt
      - name: Keep review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-qa-evidence
          path: |
            qa-artifacts
            *-results.txt
