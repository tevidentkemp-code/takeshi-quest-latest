name: SC-045 premium pinball art writer
on:
  push:
    branches: [sc045-dmd-arcade-language]
    paths:
      - tools/sc045_art_polish.py
      - .github/workflows/sc045-art-polish-writer.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sc045-dmd-arcade-language
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Confirm SC-045 lineage
        run: git merge-base --is-ancestor 8b2647bb92083d4a9b6fcb3a9de01c4a8643c29d HEAD
      - name: Apply premium art patch
        run: python3 tools/sc045_art_polish.py
      - name: Verify source architecture and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts --ignore-scripts
          npm ci --ignore-scripts --no-audit --no-fund
          node --check src/legacy/scripts/inline-007.js
          node scripts/verify-modularization.mjs
          npm run build
          npm run verify:dist
          git diff --check
      - name: Prove bounded write set
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          changed="$(git status --short | awk '{print $2}' | sort)"
          for f in $changed; do
            case "$f" in
              src/legacy/scripts/inline-007.js|src/legacy/intentional-patches.json|tools/sc045_art_polish.py) ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done
      - name: Commit verified art source only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- tools/sc045_art_polish.py
          git config user.name "shateki-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/legacy/scripts/inline-007.js src/legacy/intentional-patches.json
          git diff --cached --check
          git commit -m "SC-045: polish DMD scenes to classic pinball art direction"
          git push origin HEAD:sc045-dmd-arcade-language
