name: SC-047 post-game corrective QA
on:
  push:
    branches: [sc047-postgame-corrective]
    paths:
      - src/app/state.js
      - src/game/engine.js
      - src/legacy/scripts/inline-005.js
      - src/legacy/scripts/inline-007.js
      - src/legacy/scripts/inline-045.js
      - src/legacy/intentional-patches.json
      - src/live-game/postgame-flow.mjs
      - tools/ui-smoke/verify-sc047-postgame-corrective.js
      - tools/ui-smoke/verify-sc047-postgame-corrective.mjs
      - .github/workflows/sc047-postgame-corrective-qa.yml
  pull_request:
    paths:
      - src/app/state.js
      - src/game/engine.js
      - src/legacy/scripts/inline-005.js
      - src/legacy/scripts/inline-007.js
      - src/legacy/scripts/inline-045.js
      - src/legacy/intentional-patches.json
      - src/live-game/postgame-flow.mjs
      - tools/ui-smoke/verify-sc047-postgame-corrective.js
      - tools/ui-smoke/verify-sc047-postgame-corrective.mjs
      - .github/workflows/sc047-postgame-corrective-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Static and architecture contracts
        run: |
          set -euo pipefail
          npm ci --prefix scripts --ignore-scripts
          node tools/ui-smoke/verify-sc047-postgame-corrective.mjs
          node --check src/app/state.js
          node --check src/game/engine.js
          node --check src/legacy/scripts/inline-007.js
          node --check src/legacy/scripts/inline-045.js
          node --check src/live-game/postgame-flow.mjs
          node scripts/verify-modularization.mjs
          node scripts/build-core-js-from-source.mjs --verify-current
      - name: Build exact candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Source and dist acceptance
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc047-source.log 2>&1 & spid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc047-dist.log 2>&1 & dpid=$!
          trap 'kill "$spid" "$dpid" || true' EXIT
          export SQ_APP_URL=http://127.0.0.1:8123/index.html
          export SQ_SCREENSHOTS=${{ github.workspace }}/qa-artifacts-sc047-source
          node tools/ui-smoke/verify-sc047-postgame-corrective.js
          node tools/ui-smoke/verify-sc042-postgame-polish.js
          export SQ_APP_URL=http://127.0.0.1:8124/index.html
          export SQ_SCREENSHOTS=${{ github.workspace }}/qa-artifacts-sc047-dist
          node tools/ui-smoke/verify-sc047-postgame-corrective.js
          node tools/ui-smoke/verify-sc042-postgame-polish.js
      - name: Branch whitespace
        run: |
          git fetch origin main --quiet
          git diff --check origin/main...HEAD
      - name: Keep visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sc047-postgame-corrective-evidence
          retention-days: 14
          path: |
            qa-artifacts-sc047-source/
            qa-artifacts-sc047-dist/
