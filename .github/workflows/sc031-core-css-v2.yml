name: SC-031 core CSS v2 validation

on:
  push:
    branches: [sc031-modular-architecture-migration]
    paths:
      - scripts/split-core-styles-v2.mjs
      - scripts/verify-core-styles-v2.mjs
      - scripts/split-core-styles.mjs
      - src/legacy/styles/inline-002.css
      - src/legacy/migration-manifest.json
      - tools/ui-smoke/**
      - .github/workflows/sc031-core-css-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc031-core-css-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Confirm production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Install deterministic migration tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts --ignore-scripts

      - name: Generate 27 semantic core CSS source domains
        run: node scripts/split-core-styles-v2.mjs

      - name: Verify 27 semantic domains and byte-identical runtime
        run: node scripts/verify-core-styles-v2.mjs

      - name: Guard generated scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/legacy/migration-manifest\.json|src/legacy/styles/inline-002\.css|src/styles/.*)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected generated changes:"
            echo "$bad"
            exit 1
          fi
          git diff --check

      - name: Install deterministic UI test dependencies
        working-directory: tools/ui-smoke
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run full behaviour regression against split source
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-sc014.js | tee sc031-css-setup-results.txt
          node tools/ui-smoke/smoke.js | tee sc031-css-smoke-results.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc031-css-classic-results.txt
          node tools/ui-smoke/verify-training-modes.js | tee sc031-css-training-results.txt
          node tools/ui-smoke/verify-progression-modes.js | tee sc031-css-progression-results.txt
          node tools/ui-smoke/verify-pstats.js | tee sc031-css-pstats-results.txt

      - name: Upload verified semantic source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc031-core-css-v2-source
          retention-days: 2
          path: |
            src/styles
            src/legacy/migration-manifest.json
            src/legacy/styles/inline-002.css

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc031-core-css-v2-evidence
          retention-days: 7
          path: |
            qa-artifacts
            sc031-css-*-results.txt
            src/styles/core-source-manifest.json
