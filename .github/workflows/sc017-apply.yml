name: SC-017 bounded Live Game patch
on:
  push:
    branches: [sc017-live-race-avgs]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact SC-017 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def replace_one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          # 1) Add the compact average strip directly below each existing player info pill.
          replace_one(
              '''      <div class=\"v2WinDots\" id=\"v2WinDots${i}\"></div>\n    </div>\n  `).join(\"\");''',
              '''      <div class=\"v2WinDots\" id=\"v2WinDots${i}\"></div>\n      <div class=\"v2MiniAvg\" aria-label=\"Player 3-dart averages\">\n        <span class=\"v2MiniAvgMetric\"><span class=\"v2MiniAvgLab\">3R AV</span><span class=\"v2MiniAvgVal\" id=\"v2Mini3R${i}\">–</span></span>\n        <span class=\"v2MiniAvgMetric\"><span class=\"v2MiniAvgLab\">MTC AV</span><span class=\"v2MiniAvgVal\" id=\"v2MiniMtc${i}\">–</span></span>\n      </div>\n    </div>\n  `).join(\"\");''',
              'player average strip markup'
          )

          # 2) Add tightly-scoped styling. Existing B1 geometry remains intact; the strip is absolute,
          #    and the existing 12px gap is expanded only enough to clear its 20px height.
          css_marker = '/* Averages box (under 3-round viewport) */'
          css = r'''/* >>> PATCH:SC017_PLAYER_AVG_STRIP START */
.livev2panel .v2Scores{
  margin-bottom: 24px;
}
.livev2panel .v2ScoreBox{
  position: relative;
}
.livev2panel .v2MiniAvg{
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 3px);
  height: 20px;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(0,0,0,.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.045);
  color: rgba(245,247,255,.88);
  pointer-events: none;
}
.livev2panel .v2MiniAvgMetric{
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  white-space: nowrap;
  overflow: hidden;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.livev2panel .v2MiniAvgMetric + .v2MiniAvgMetric{
  border-left: 1px solid rgba(255,255,255,.08);
}
.livev2panel .v2MiniAvgLab{
  font-size: 7px;
  font-weight: 800;
  letter-spacing: .02em;
  color: rgba(184,192,204,.76);
}
.livev2panel .v2MiniAvgVal{
  font-size: 10px;
  font-weight: 900;
  color: rgba(247,248,250,.96);
}
.livev2panel[style*=\"--sqV2P: 5\"] .v2MiniAvgMetric,
.livev2panel[style*=\"--sqV2P: 6\"] .v2MiniAvgMetric{
  flex-direction: column;
  gap: 0;
}
.livev2panel[style*=\"--sqV2P: 5\"] .v2MiniAvgLab,
.livev2panel[style*=\"--sqV2P: 6\"] .v2MiniAvgLab{ font-size: 6px; }
.livev2panel[style*=\"--sqV2P: 5\"] .v2MiniAvgVal,
.livev2panel[style*=\"--sqV2P: 6\"] .v2MiniAvgVal{ font-size: 8px; }
/* Reclaim the strip's extra vertical footprint from B3. This trims Game Race by
   ~12-14px across supported portrait sizes while preserving its local score scale. */
body.livev2-on[data-page=\"game\"] #liveV2Panel{
  --sqV2InfoH: clamp(198px, 24.5vh, 248px);
}
/* <<< PATCH:SC017_PLAYER_AVG_STRIP END */

'''
          if s.count(css_marker) != 1:
              raise SystemExit(f'average strip CSS marker: expected exactly 1 match, found {s.count(css_marker)}')
          s = s.replace(css_marker, css + css_marker, 1)

          # 3) Shared display helper using the same completed-round and getPerRoundScore semantics
          #    as the existing B3 3R/MTC rows. Partial rounds are intentionally excluded.
          helper_marker = 'function __sqSetupLiveV2Sizing(panel){'
          helper = r'''function __sqV2PlayerAverages(pIdx, currentRound){
  try{
    const cr0 = Math.max(0, Number.isFinite(+currentRound) ? +currentRound : 0);
    const done = [];
    for(let r=0; r<=cr0; r++){
      const entry = state.score?.[pIdx]?.[r];
      const complete = (r < cr0) || (entry && entry.darts && entry.darts[2] != null);
      if(complete) done.push(r);
    }
    const meanFor = (rounds)=>{
      let sum = 0, n = 0;
      rounds.forEach((r)=>{
        const v = getPerRoundScore(r, pIdx);
        if(Number.isFinite(+v)){ sum += +v; n++; }
      });
      return n ? (sum / n) : NaN;
    };
    return { r3: meanFor(done.slice(-3)), mtc: meanFor(done) };
  }catch(_){ return { r3: NaN, mtc: NaN }; }
}

'''
          if s.count(helper_marker) != 1:
              raise SystemExit(f'average helper marker: expected exactly 1 match, found {s.count(helper_marker)}')
          s = s.replace(helper_marker, helper + helper_marker, 1)

          # 4) Paint the always-visible average strip during the existing player-total update loop.
          update_old = '''    if(v2w){\n      const wins = Math.max(0, Number(__v2MatchWins[i] || 0) || 0);\n      const totalDots = Math.max(__v2GamesInMatch, wins);\n      v2w.innerHTML = Array.from({length: totalDots}, (_,k)=>`<i class=\\\"v2WinDot${k < wins ? ' on' : ''}\\\"></i>`).join('');\n    }\n  }'''
          update_new = '''    if(v2w){\n      const wins = Math.max(0, Number(__v2MatchWins[i] || 0) || 0);\n      const totalDots = Math.max(__v2GamesInMatch, wins);\n      v2w.innerHTML = Array.from({length: totalDots}, (_,k)=>`<i class=\\\"v2WinDot${k < wins ? ' on' : ''}\\\"></i>`).join('');\n    }\n\n    const __miniAvg = __sqV2PlayerAverages(i, cr);\n    const __mini3R = document.getElementById(\"v2Mini3R\" + i);\n    const __miniMtc = document.getElementById(\"v2MiniMtc\" + i);\n    if(__mini3R) __mini3R.textContent = __sqFmtAvg(__miniAvg.r3);\n    if(__miniMtc) __miniMtc.textContent = __sqFmtAvg(__miniAvg.mtc);\n  }'''
          replace_one(update_old, update_new, 'average strip live update')

          # 5) Draw the complete HS/PB/WR reference path across all rounds. Crucially, leave the
          #    Y-axis scale calculation above untouched: only played rounds + one lookahead affect
          #    maxV, so players remain locally readable instead of being flattened by the final HS.
          replace_one(
              'const recTo = Math.min(recData.length, rc, playedTo + 1);   // never past the scaled range',
              'const recTo = Math.min(recData.length, rc);   // full reference path; Y-axis remains local to played rounds',
              'full high-score reference path'
          )

          path.write_text(s, encoding='utf-8')

          # Extend the existing focused visual-fit regression rather than creating a parallel suite.
          tpath = Path('tools/ui-smoke/verify-classic-visual-fit.js')
          t = tpath.read_text(encoding='utf-8')

          old = """    await page.locator('#pad .dtBullBtn').first().click();\n    await page.waitForTimeout(650);\n    assert(await page.locator('#liveV2Panel .v2Total').allTextContents().then(v=>v.some(x=>Number(x)>0)), 'score totals update');\n    console.log('PASS score totals update after a real button press');"""
          new = """    await page.locator('#pad .dtBullBtn').first().click();\n    await page.waitForTimeout(650);\n    assert(await page.locator('#liveV2Panel .v2Total').allTextContents().then(v=>v.some(x=>Number(x)>0)), 'score totals update');\n    console.log('PASS score totals update after a real button press');\n    await page.locator('#pad .dtBullBtn').first().click();\n    await page.locator('#pad .dtBullBtn').first().click();\n    await page.waitForTimeout(500);\n    const miniAvgs = await page.evaluate(() => ({\n      r3: document.getElementById('v2Mini3R0')?.textContent || '',\n      mtc: document.getElementById('v2MiniMtc0')?.textContent || '',\n      box: document.querySelector('.v2ScoreBox[data-p=\\\"0\\\"]')?.getBoundingClientRect() || null,\n      mini: document.querySelector('.v2ScoreBox[data-p=\\\"0\\\"] .v2MiniAvg')?.getBoundingClientRect() || null,\n      rows: document.querySelector('.v2RowsWrap')?.getBoundingClientRect() || null\n    }));\n    assert(miniAvgs.r3 && miniAvgs.r3 !== '–', '3R AV appears after a completed round');\n    assert(miniAvgs.mtc && miniAvgs.mtc !== '–', 'MTC AV appears after a completed round');\n    assert.equal(miniAvgs.r3, miniAvgs.mtc, 'single completed round yields matching 3R and MTC averages');\n    assert(miniAvgs.box && miniAvgs.mini && miniAvgs.rows, 'average-strip geometry is measurable');\n    assert(miniAvgs.mini.top >= miniAvgs.box.bottom, 'average strip sits below player info cell');\n    assert(miniAvgs.mini.bottom <= miniAvgs.rows.top + 2, 'average strip does not overlap round rows');\n    console.log('PASS compact 3R AV / MTC AV strip');"""
          if t.count(old) != 1:
              raise SystemExit(f'test average insertion: expected 1 match, found {t.count(old)}')
          t = t.replace(old, new, 1)

          old = "return {gap:pad.top-panel.bottom, height:host.height, width:host.width, canvasWidth:canvas.getBoundingClientRect().width, overflow:document.documentElement.scrollWidth>innerWidth+1};"
          new = "return {gap:pad.top-panel.bottom, height:host.height, pagerHeight:document.querySelector('.v2InfoPager')?.getBoundingClientRect().height || 0, width:host.width, canvasWidth:canvas.getBoundingClientRect().width, overflow:document.documentElement.scrollWidth>innerWidth+1};"
          if t.count(old) != 1:
              raise SystemExit(f'test pager geometry: expected 1 match, found {t.count(old)}')
          t = t.replace(old, new, 1)

          old = """      assert(fit.height>=80,'graph retains readable height');"""
          new = """      assert(fit.height>=80,'graph retains readable height');\n      if (size.width===390 && size.height===844) assert(fit.pagerHeight<210,'Game Race/B3 panel height reduced to make room for average strip');\n      if (size.width===320 && size.height===568) assert(fit.pagerHeight<205,'short-screen Game Race/B3 panel height reduced');"""
          if t.count(old) != 1:
              raise SystemExit(f'test reduced graph height: expected 1 match, found {t.count(old)}')
          t = t.replace(old, new, 1)

          old = """    const graph = await page.evaluate(() => {\n      const c=document.createElement('canvas'); const host=document.createElement('div');\n      host.style.cssText='width:390px;height:180px';host.append(c);document.body.append(host);\n      const motion={grow:[],combo:[],burst:[],lastLen:[],lastFull:[],maxV:0};\n      __sqDrawArcadeRace(c,{labels:Array.from({length:14},(_,i)=>String(i+10)),series:[{data:[10,...Array(13).fill(null)],color:'#7bdcff'}],record:{data:Array.from({length:14},(_,i)=>(i+1)*50)}},motion,performance.now());\n      const max=motion.maxV;host.remove();return max;\n    });\n    assert(graph<150,'early scores scale against played rounds, not full-game record');\n    console.log('PASS beta graph early-round scaling');"""
          new = """    const graph = await page.evaluate(() => {\n      const proto=CanvasRenderingContext2D.prototype;\n      const oldDash=proto.setLineDash, oldLine=proto.lineTo;\n      let dashed=false; const recordXs=[];\n      proto.setLineDash=function(v){ dashed=Array.isArray(v)&&v.length===2&&v[0]===5&&v[1]===4; return oldDash.call(this,v); };\n      proto.lineTo=function(x,y){ if(dashed) recordXs.push(x); return oldLine.call(this,x,y); };\n      const c=document.createElement('canvas'); const host=document.createElement('div');\n      host.style.cssText='width:390px;height:180px';host.append(c);document.body.append(host);\n      try{\n        const motion={grow:[],combo:[],burst:[],lastLen:[],lastFull:[],maxV:0};\n        __sqDrawArcadeRace(c,{labels:Array.from({length:14},(_,i)=>String(i+10)),series:[{data:[10,...Array(13).fill(null)],color:'#7bdcff'}],record:{data:Array.from({length:14},(_,i)=>(i+1)*50)}},motion,performance.now());\n        return {max:motion.maxV,maxRecordX:recordXs.length?Math.max(...recordXs):0};\n      } finally { proto.setLineDash=oldDash; proto.lineTo=oldLine; host.remove(); }\n    });\n    assert(graph.max<150,'early scores scale against played rounds, not full-game record');\n    assert(graph.maxRecordX>360,'high-score reference path is plotted through the final round');\n    console.log('PASS beta graph local scale + full high-score path');"""
          if t.count(old) != 1:
              raise SystemExit(f'test graph replacement: expected 1 match, found {t.count(old)}')
          t = t.replace(old, new, 1)

          # Confirm the compact B3 still contains all five Game Stats rows after the height trim.
          anchor = """    await page.setViewportSize({width:390,height:844});\n    for (const type of ['lastDartImg','desmondImg','voldyImg']) {"""
          insert = """    await page.setViewportSize({width:390,height:844});\n    await page.waitForTimeout(250);\n    const statsFit = await page.evaluate(() => {\n      const card=document.getElementById('v2InfoCell');\n      const grid=document.getElementById('v2Avg');\n      const last=grid&&grid.lastElementChild;\n      if(!card||!grid||!last)return null;\n      const c=card.getBoundingClientRect(), l=last.getBoundingClientRect();\n      return {cardBottom:c.bottom,lastBottom:l.bottom};\n    });\n    assert(statsFit && statsFit.lastBottom<=statsFit.cardBottom+2,'Game Stats rows remain inside B3 after height reduction');\n    console.log('PASS reduced B3 keeps Game Stats content contained');\n    for (const type of ['lastDartImg','desmondImg','voldyImg']) {"""
          if t.count(anchor) != 1:
              raise SystemExit(f'test stats-fit insertion: expected 1 match, found {t.count(anchor)}')
          t = t.replace(anchor, insert, 1)
          tpath.write_text(t, encoding='utf-8')
          PY
          git diff --check
      - name: Install existing UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run focused and full scoring regression
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-classic-visual-fit.js | tee classic-visual-results.txt
          node tools/ui-smoke/smoke.js | tee smoke-results.txt
          node tools/ui-smoke/verify-saveplayer-card.js | tee saved-player-results.txt
      - name: Commit tested patch and remove temporary runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sc017-apply.yml
          git add index.html tools/ui-smoke/verify-classic-visual-fit.js
          git diff --check
          git commit -m "SC-017: extend race reference and add live averages"
          git push origin HEAD:sc017-live-race-avgs
      - name: Keep QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc017-qa-evidence
          path: |
            qa-artifacts
            *-results.txt
