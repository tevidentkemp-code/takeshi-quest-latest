name: SC-017 bounded Live Game patch
on:
  push:
    branches:
      - sc017-live-race-avgs
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patch
        run: python3 tools/sc017_apply.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Install test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run focused and scoring regressions
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-classic-visual-fit.js
          node tools/ui-smoke/smoke.js
          node tools/ui-smoke/verify-saveplayer-card.js
      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sc017-apply.yml tools/sc017_apply.py
          git add index.html tools/ui-smoke/verify-classic-visual-fit.js
          git diff --check
          git commit -m "SC-017: extend race reference and add live averages"
          git push origin HEAD:sc017-live-race-avgs
