name: SC-023 bounded build
on:
  push:
    branches: [sc023-turbo-live-recovery]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'SC-023: run bounded Turbo recovery build'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded SC-023 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          p = Path('index.html')
          text = p.read_text()

          text = replace_once(text,
          """  function turnKey(){
              try{ return [state.currentRound,state.currentPlayer,state.currentDart].map(v=>String(v ?? '')).join('|'); }catch(_){ return ''; }
            }
""",
          """  function turnKey(){
              // Turbo's strict clock is per 3-dart turn, not per individual dart.
              try{ return [state.currentRound,state.currentPlayer].map(v=>String(v ?? '')).join('|'); }catch(_){ return ''; }
            }
""",
          'Turbo turn key')

          text = replace_once(text,
          """  function ensureTimer(){
              if (!gameActive()){ timer = null; clearBoxes(); return; }
              if (Number(state?.currentDart || 0) !== 0){ timer = null; clearBoxes(); return; }
              const key = turnKey();
              if (!timer || timer.key !== key) timer = { key, startedAt: performance.now(), fired:false };
            }
""",
          """  function ensureTimer(){
              if (!gameActive()){ timer = null; clearBoxes(); return; }
              const key = turnKey();
              if (!timer || timer.key !== key) timer = { key, startedAt: performance.now(), fired:false };
            }
""",
          'Turbo timer lifetime')

          text = replace_once(text,
          """  function autoMissTurn(key){
              if (firing) return;
              try{
                if (!gameActive() || !timer || timer.key !== key || Number(state?.currentDart || 0) !== 0) return;
                firing = true;
                try{ window.__sqDmdHardClearQueue?.(); }catch(_){ }
                try{ window.__sqDmdBulkMiss = true; }catch(_){ }
                for (let i=0; i<3; i++){
                  if (state?.finished) break;
                  if (typeof window.recordThrow === 'function') window.recordThrow({ kind:'Miss' });
                  else if (typeof recordThrow === 'function') recordThrow({ kind:'Miss' });
                }
""",
          """  function autoMissTurn(key){
              if (firing) return;
              try{
                if (!gameActive() || !timer || timer.key !== key) return;
                const remaining = Math.max(0, 3 - Math.max(0, Math.min(3, Number(state?.currentDart || 0))));
                if (!remaining) return;
                firing = true;
                try{ window.__sqDmdHardClearQueue?.(); }catch(_){ }
                try{ window.__sqDmdBulkMiss = true; }catch(_){ }
                for (let i=0; i<remaining; i++){
                  if (state?.finished) break;
                  if (typeof window.recordThrow === 'function') window.recordThrow({ kind:'Miss' });
                  else if (typeof recordThrow === 'function') recordThrow({ kind:'Miss' });
                }
""",
          'Turbo timeout remaining darts')

          text = replace_once(text,
          """      const wrapped = function(){ const ret = oldRecordThrow.apply(this, arguments); timer = null; setTimeout(renderTimer,0); return ret; };
""",
          """      const wrapped = function(){ const ret = oldRecordThrow.apply(this, arguments); setTimeout(renderTimer,0); return ret; };
""",
          'Turbo throw timer reset')

          text = replace_once(text,
          """    const __classicThrowRace = live.length >= 2 && !__turboRace && !__practiceRace && !__shadowRace;
""",
          """    // Current throw-by-throw race presentation is shared by competitive Classic and Turbo.
            // Practice and Vs Shadow remain deliberately isolated from this path.
            const __classicThrowRace = live.length >= 2 && !__practiceRace && !__shadowRace;
""",
          'Turbo modern race gate')

          text = replace_once(text,
          """      const hs = await client.from('v_high_score_league_turbo_from_games_clean')
                .select('player,best_score,best_ts,game_id')
                .order('best_score', { ascending:false })
                .order('best_ts', { ascending:false })
                .limit(1);
              if (hs && hs.error) throw hs.error;
              const top = Array.isArray(hs && hs.data) ? hs.data[0] : null;
              if (!top || !top.game_id) return null;
""",
          """      // The direct Turbo ranking view can exceed the client-role statement timeout.
              // Use the existing clean materialized game-score feed to identify the all-time Turbo PB,
              // then keep the established round-score views below for the record's actual pace.
              const hs = await client.from('v_latest_scores_turbo_clean')
                .select('game_id,created_at,player_scores')
                .order('created_at', { ascending:false })
                .limit(5000);
              if (hs && hs.error) throw hs.error;
              let top = null;
              (Array.isArray(hs && hs.data) ? hs.data : []).forEach(function(g){
                let scores = g && g.player_scores;
                if (typeof scores === 'string') { try{ scores = JSON.parse(scores); }catch(_){ scores = []; } }
                if (!Array.isArray(scores)) return;
                scores.forEach(function(r){
                  const player = String((r && (r.player_name || r.player)) || '').trim();
                  const score = Number(r && r.score);
                  if (!player || !Number.isFinite(score) || score <= 0) return;
                  const candidate = { player:player, best_score:score, best_ts:(g && g.created_at) || '', game_id:(g && g.game_id) || '' };
                  const ct = Date.parse(candidate.best_ts || '') || 0;
                  const tt = top ? (Date.parse(top.best_ts || '') || 0) : 0;
                  if (!top || score > Number(top.best_score || 0) ||
                      (score === Number(top.best_score || 0) && ct > tt) ||
                      (score === Number(top.best_score || 0) && ct === tt && String(candidate.game_id) > String(top.game_id || ''))) top = candidate;
                });
              });
              if (!top || !top.game_id) return null;
""",
          'Turbo record source')

          p.write_text(text)

          t = Path('tools/ui-smoke/verify-classic-visual-fit.js')
          test = t.read_text()

          test = replace_once(test,
          """          shadowRuntime: (typeof __sqIsVsShadowRuntime === 'function') ? __sqIsVsShadowRuntime() : false
""",
          """          shadowRuntime: (typeof __sqIsVsShadowRuntime === 'function') ? __sqIsVsShadowRuntime() : false,
                  labels: Array.isArray(packet.labels) ? packet.labels.slice() : [],
                  offset: Number(packet.offset || 0),
                  record: packet.record ? {name:packet.record.name || '', label:packet.record.label || '', data:Array.isArray(packet.record.data) ? packet.record.data.slice() : []} : null,
                  series: (packet.series || []).map(s => ({name:s.name || '', data:Array.isArray(s.data) ? s.data.slice() : [], throwData:Array.isArray(s.throwData) ? s.throwData.slice() : []}))
""",
          'Race packet capture fields')

          insert_anchor = """async function verifyResumedRaceRoute(label, savedState, expected){
"""
          new_fn = r'''async function verifySc023TurboLiveRecovery(){
  const {browser, page, consoleErrs} = await H.launch({width:390,height:844});
  try {
    await H.boot(page);
    await installRacePacketCapture(page);
    await page.evaluate(() => {
      window.__sc023Tables = [];
      const latest = [{
        game_id:'turbo-record-game', created_at:'2026-09-10T19:59:03.349Z',
        player_scores:[
          {player_key:'record ace',player_name:'RECORD ACE',score:359,rounds:7,avg_round:51.3},
          {player_key:'other',player_name:'OTHER',score:349,rounds:7,avg_round:49.9}
        ]
      }];
      const pace = [85,18,57,120,0,54,25].map((round_score,i)=>({
        mode_key:'turbo', player:'RECORD ACE', player_key:'record ace', game_id:'turbo-record-game',
        created_at:'2026-09-10T19:59:03.349Z', round_index:i+7, round_score
      }));
      const rowsFor = table => table === 'v_latest_scores_turbo_clean' ? latest :
        (table === 'mv_player_round_scores_mode_clean_app' || table === 'v_player_round_scores_mode_clean') ? pace : [];
      const from = table => {
        window.__sc023Tables.push(table);
        let q;
        const base = {
          select(){return q;}, order(){return q;}, limit(){return q;}, eq(){return q;}, gte(){return q;}, lte(){return q;},
          then(resolve){ resolve({data:rowsFor(table),error:null}); }, catch(){return q;}
        };
        q = new Proxy(base,{get(target,prop){return prop in target ? target[prop] : (()=>q);}});
        return q;
      };
      window.sb = {from}; window.__sb = window.sb;
      window.__sqTurboRaceRecordCache = null;
    });

    await startNewRaceGame(page, 'turbo');
    assert(await page.isVisible('.sq-turbo-ready-start'), 'Turbo ready gate is shown before the strict turn clock starts');
    await page.click('.sq-turbo-ready-start');
    await page.waitForFunction(() => {
      const s=window.__sqTurboTimerStatus?.();
      const box=document.querySelector('.livev2panel .v2ScoreBox[data-p="'+Number(state?.currentPlayer||0)+'"]');
      return !!(s?.active && s.timer && box?.classList.contains('sqTurboTimerActive') && box.querySelector('svg.sqTurboSvg'));
    });
    await page.waitForTimeout(700);
    const before = await page.evaluate(() => {
      const s=window.__sqTurboTimerStatus();
      const box=document.querySelector('.livev2panel .v2ScoreBox[data-p="'+Number(state.currentPlayer||0)+'"]');
      return {key:s.timer.key,elapsed:s.timer.elapsedMs,dash:box.querySelector('.sqTurboProgress')?.style.strokeDashoffset||'',deg:box.style.getPropertyValue('--sqTurboDeg')};
    });
    assert(before.elapsed >= 500, 'Turbo 20-second turn clock advances after START GAME');

    await page.waitForTimeout(350);
    const moving = await page.evaluate(() => {
      const s=window.__sqTurboTimerStatus();
      const box=document.querySelector('.livev2panel .v2ScoreBox[data-p="'+Number(state.currentPlayer||0)+'"]');
      return {elapsed:s.timer.elapsedMs,dash:box.querySelector('.sqTurboProgress')?.style.strokeDashoffset||'',deg:box.style.getPropertyValue('--sqTurboDeg')};
    });
    assert(moving.elapsed > before.elapsed && (moving.dash !== before.dash || moving.deg !== before.deg), 'Turbo perimeter light visibly progresses with the same turn clock');

    const openingPacket = await waitForRacePacket(page, true, {matchMode:'turbo'});
    assert.deepEqual(openingPacket.labels, ['17','18','19','20','D','T','B'], 'Turbo modern race uses the actual seven-round Turbo window');
    assert.equal(openingPacket.offset, 7, 'Turbo race keeps its round offset');

    await page.locator('#pad [data-score-label="Single"]').click();
    await page.waitForFunction(() => state.currentDart === 1);
    await page.waitForTimeout(220);
    const dart1 = await page.evaluate(() => {
      const s=window.__sqTurboTimerStatus();
      const box=document.querySelector('.livev2panel .v2ScoreBox[data-p="'+Number(state.currentPlayer||0)+'"]');
      return {key:s.timer?.key||'',elapsed:s.timer?.elapsedMs||0,svg:!!box?.querySelector('svg.sqTurboSvg')};
    });
    assert.equal(dart1.key, before.key, 'Turbo clock remains the same clock after Dart 1');
    assert(dart1.elapsed > before.elapsed && dart1.svg, 'Turbo countdown/perimeter remains active after Dart 1');

    await page.locator('#pad .dtActBtn.miss').click();
    await page.waitForFunction(() => state.currentDart === 2);
    await page.waitForTimeout(160);
    const dart2 = await page.evaluate(() => window.__sqTurboTimerStatus());
    assert.equal(dart2.timer.key, before.key, 'Turbo clock remains the same clock after Dart 2');
    assert(dart2.timer.elapsedMs > dart1.elapsed, 'Turbo strict turn countdown does not restart per dart');
    await page.waitForFunction(() => (window.__sc021RacePackets || []).some(p => p.matchMode === 'turbo' && p.classicThrowRace && p.series?.[0]?.throwData?.length >= 3));
    const livePacket = await page.evaluate(() => (window.__sc021RacePackets || []).slice().reverse().find(p => p.matchMode === 'turbo' && p.classicThrowRace && p.series?.[0]?.throwData?.length >= 3));
    assert.deepEqual(livePacket.series[0].throwData.slice(0,3), [0,17,17], 'Turbo race advances once per dart and a miss keeps Y unchanged');

    await page.locator('#pad [data-score-label="Single"]').click();
    await page.waitForFunction(() => state.currentPlayer === 1 && state.currentDart === 0);
    await page.waitForFunction(oldKey => {
      const s=window.__sqTurboTimerStatus?.(); return !!(s?.timer && s.timer.key !== oldKey);
    }, before.key);
    const nextTurn = await page.evaluate(() => window.__sqTurboTimerStatus());
    assert.notEqual(nextTurn.timer.key, before.key, 'Turbo clock resets only when the player turn changes');

    const record = await page.evaluate(() => __sqBuildTurboRecordPaceSeries(14,7));
    assert(record, 'Turbo race record reference resolves');
    assert.equal(record.name, 'Turbo HS: RECORD ACE (359)', 'Turbo race labels the isolated Turbo record');
    assert.deepEqual(record.data, [85,103,160,280,280,334,359], 'Turbo race uses the record game round-by-round cumulative pace');
    const sourceAudit = await page.evaluate(() => window.__sc023Tables.slice());
    assert(sourceAudit.includes('v_latest_scores_turbo_clean'), 'Turbo race record uses the clean materialized Turbo score feed');
    assert(!sourceAudit.includes('v_high_score_league_turbo_from_games_clean'), 'Turbo race avoids the timed-out direct ranking view');

    await page.evaluate(() => { window.__sqTurboRaceRecordCache = null; window.__sqV2InfoDmdUpdate(); });
    await page.waitForFunction(() => (window.__sc021RacePackets || []).some(p => p.matchMode === 'turbo' && p.classicThrowRace && p.record && p.record.data?.at(-1) === 359));
    const recordPacket = await page.evaluate(() => (window.__sc021RacePackets || []).slice().reverse().find(p => p.matchMode === 'turbo' && p.classicThrowRace && p.record && p.record.data?.at(-1) === 359));
    assert.deepEqual(recordPacket.record.data, [85,103,160,280,280,334,359], 'Turbo High Score reference reaches the live Game Race packet');

    assertNoUnexpectedErrors(consoleErrs, 'SC-023 Turbo live recovery');
    console.log('PASS SC-023 Turbo 20-second turn clock / moving perimeter / modern per-dart race / Turbo High Score reference');
  } finally { await browser.close(); }
}

'''
          test = replace_once(test, insert_anchor, new_fn + insert_anchor, 'Insert SC-023 verifier')
          test = replace_once(test,
          """  await verifyNewRaceRoute('turbo', false);
          await verifyVsShadowAndPracticeAliasRoutes();
""",
          """  await verifySc023TurboLiveRecovery();
          await verifyNewRaceRoute('turbo', true);
          await verifyVsShadowAndPracticeAliasRoutes();
""",
          'Turbo route expectation')
          t.write_text(test)
          PY

          git diff --check
          git diff --stat
      - name: Install UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, tempfile, pathlib
          html=pathlib.Path('index.html').read_text()
          tags=re.findall(r'<script([^>]*)>(.*?)</script>',html,re.I|re.S)
          checked=0
          for attrs,body in tags:
              if re.search(r'\bsrc\s*=',attrs,re.I) or re.search(r'type\s*=\s*["\'](?:application/(?:json|ld\+json)|importmap)["\']',attrs,re.I):
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(body); name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              pathlib.Path(name).unlink(missing_ok=True)
              if r.returncode:
                  raise SystemExit(f'Inline script {checked+1} syntax FAIL:\n{r.stderr}')
              checked+=1
          print(f'PASS inline JavaScript syntax {checked}/{checked}')
          PY
      - name: Run targeted visual and routing regression
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc023-results.txt
      - name: Remove temporary build machinery and commit verified patch
        shell: bash
        run: |
          rm -f .github/workflows/sc023-turbo-diagnostic.yml .github/workflows/sc023-build.yml
          git diff --check
          git status --short
          git config user.name 'tevidentkemp-code'
          git config user.email 'tevidentkemp@gmail.com'
          git add index.html tools/ui-smoke/verify-classic-visual-fit.js .github/workflows/sc023-turbo-diagnostic.yml .github/workflows/sc023-build.yml
          git commit -m 'SC-023: restore Turbo live timer and race'
          git push origin HEAD:sc023-turbo-live-recovery
