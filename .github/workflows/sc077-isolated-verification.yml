name: SC-077 isolated zero-flash verification
on:
  push:
    branches: [work/sc077-zero-flash-verification]
    paths: [.github/workflows/sc077-isolated-verification.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 35ffe81b52faad1651cc10cb6a83a0bfcb135ae0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install existing locked tooling
        run: |
          npm ci --prefix scripts --ignore-scripts
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/ui-smoke --ignore-scripts
          npx --prefix tools/ui-smoke playwright install --with-deps chromium webkit
      - name: Add render-time regression to the existing Turbo suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/ui-smoke/verify-sc067-turbo-identity.js')
          s=p.read_text()
          marker='async function readPresentation(page) {'
          assert s.count(marker)==1
          helpers='''// SC-077: inspect every wall replacement, before any delayed cleanup.
          // Test-only instrumentation delegates to the native setter unchanged.
          async function installPreStartProbe(ctx) {
            await ctx.addInitScript(() => {
              window.__sqPreStartProbe = {commits:0, invalid:[]};
              const native = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
              Object.defineProperty(Element.prototype, 'innerHTML', {...native, set(value) {
                native.set.call(this, value);
                if (this.id !== 'v2Rows' || typeof __sqIsTurboVisualRuntime !== 'function' || !__sqIsTurboVisualRuntime()) return;
                const probe = window.__sqPreStartProbe;
                const cutoff = __sqTurboRaceStartIndex(state, ROUNDS.length);
                probe.commits++;
                for (const cell of this.querySelectorAll('.v2Cell[data-round],.v2Badge[data-round]')) {
                  if (Number(cell.dataset.round) >= cutoff) continue;
                  const text = cell.textContent.trim();
                  if (text && probe.invalid.length < 32) probe.invalid.push({round:Number(cell.dataset.round), text});
                }
              }});
            });
          }
          async function assertPreStartBlank(page) {
            const probe = await page.evaluate(() => window.__sqPreStartProbe);
            assert(probe.commits > 0, 'SC-077 observed actual score-wall renders');
            if (probe.invalid.length) console.log('SC077_BASELINE_WITNESS=' + JSON.stringify(probe));
            assert.deepEqual(probe.invalid, [], 'SC077_PRESTART_CONTENT: excluded Turbo rounds must be blank at render time');
          }
          
          '''
          s=s.replace(marker,helpers+marker)
          before='    await isolate(ctx); await H.boot(page,{settle:1000});'
          assert s.count(before)==1
          s=s.replace(before,'    await installPreStartProbe(ctx);\n'+before)
          before='      const s=await readPresentation(page); snapshots.push({width,...s});'
          assert s.count(before)==1
          s=s.replace(before,before+"\n      await assertPreStartBlank(page);\n      assert.equal(await page.locator('#v2Rows .v2Cell[data-round=\"7\"][data-p=\"1\"] .v2CellNum').textContent(), '0', 'SC-077 preserves zero scores in the played Turbo range');")
          before="    assert.deepEqual(pageErrors,[], 'No uncaught runtime errors');"
          assert s.count(before)==1
          s=s.replace(before,"    await assertPreStartBlank(page);\n    console.log('PASS SC-077 no pre-start content across startup, resize, Single, Miss and Undo renders');\n"+before)
          p.write_text(s)
          PY
          node --check tools/ui-smoke/verify-sc067-turbo-identity.js
      - name: Reproduce the original defect without modifying application files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = tools/ui-smoke/verify-sc067-turbo-identity.js
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc077-baseline-http.log 2>&1 &
          pid=$!; trap 'kill "$pid" || true' EXIT
          set +e
          SQ_APP_URL=http://127.0.0.1:8123/index.html timeout 180s node tools/ui-smoke/verify-sc067-turbo-identity.js > sc077-baseline.txt 2>&1
          status=$?
          set -e
          cat sc077-baseline.txt
          test "$status" -eq 1
          grep -q SC077_BASELINE_WITNESS= sc077-baseline.txt
          grep -q SC077_PRESTART_CONTENT sc077-baseline.txt
          test "$(git diff --name-only)" = tools/ui-smoke/verify-sc067-turbo-identity.js
      - name: Patch only the semantic renderer and prepare candidate version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('src/live-game/live-v2.js'); raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='0597f0c3a563a4c34711b6d2a519beabd04dda3c'
          s=raw.decode()
          before='    const totalR = (typeof ROUNDS!=="undefined" && Array.isArray(ROUNDS) && ROUNDS.length) ? ROUNDS.length : Math.max(cr+1, 1);'
          assert s.count(before)==1
          s=s.replace(before,before+"\n    const __sqTurboWallStart = __sqIsTurboVisualRuntime() ? __sqTurboRaceStartIndex(state, totalR) : 0;")
          before='      // Compute per-round max (for faint green highlight)\n      let maxV = -Infinity;'
          assert s.count(before)==1, 'Expected exactly the active renderer, not the disabled next-row copy'
          block='''      // SC-077: emit pre-start Turbo placeholders blank, before any paint.
                // The delayed legacy cleanup must not expose intermediate zero scores.
                if(r < __sqTurboWallStart){
                  out.push(`<div class="v2Badge${rowClass} sqTurboPreStartBadge" data-round="${r}"></div>`);
                  for(let i=0; i<pCount; i++){
                    out.push(`<div class="v2Cell${rowClass} sqTurboPreStartCell" data-p="${i}" data-round="${r}"></div>`);
                  }
                  if(pCount === 1) out.push(`<div class="v2Cell${rowClass} v2SoloPbCell sqTurboPreStartCell"></div>`);
                  continue;
                }
          
          '''
          s=s.replace(before,block+before);p.write_text(s)
          p=Path('src/legacy/quarantine/core-pre-modals.js');s=p.read_text()
          before="const RUNNING_VERSION = '0.14.1';";assert s.count(before)==1
          p.write_text(s.replace(before,"const RUNNING_VERSION = '0.14.2';"))
          p=Path('assets/release-metadata.json');s=p.read_text();old=json.loads(s)
          assert old['currentVersion']=='0.14.1'
          s=s.replace('"currentVersion": "0.14.1"','"currentVersion": "0.14.2"',1)
          s=s.replace('"currentReleaseId": "SC-071-TURBO-TIMER-PERIMETER"','"currentReleaseId": "SC-077-TURBO-PRESTART-ROWS"',1)
          entry={'version':'0.14.2','releaseId':'SC-077-TURBO-PRESTART-ROWS','date':'2026-10-07','title':'Stop Turbo pre-start score flashes','changes':['Kept rounds before Turbo starts blank throughout scoring redraws, removing the brief zero flash.','Preserved real scores, the countdown perimeter, scoring actions and other game modes.']}
          rendered='\n'.join('    '+line for line in json.dumps(entry,indent=2).splitlines())
          marker='  "releases": [\n';assert s.count(marker)==1
          s=s.replace(marker,marker+rendered+',\n',1)
          assert json.loads(s)['releases'][1:]==old['releases']
          p.write_text(s)
          PY
          node scripts/materialize-runtime.mjs
          node scripts/build-core-js-from-source.mjs --verify-current > sc077-js-parity.json
          node scripts/build-core-styles-from-source.mjs --verify-current > sc077-css-parity.json
          node tools/ui-smoke/verify-sc050-release-notes.mjs
          git diff --check
      - name: Verify both browsers against source and dist with identical assertions
        shell: bash
        run: |
          set -euo pipefail
          npm run build > sc077-build.txt 2>&1
          npm run verify:dist > sc077-dist.txt 2>&1
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc077-source-http.log 2>&1 &
          source_pid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc077-dist-http.log 2>&1 &
          dist_pid=$!
          trap 'kill "$source_pid" "$dist_pid" || true' EXIT
          for browser in chromium webkit; do
            for build in source dist; do
              port=8123; if [ "$build" = dist ]; then port=8124; fi
              SQ_BROWSER="$browser" SQ_APP_URL="http://127.0.0.1:$port/index.html" SQ_SCREENSHOTS="sc077-images/$browser-$build" timeout 180s node tools/ui-smoke/verify-sc067-turbo-identity.js | tee "sc077-$browser-$build.txt"
            done
          done
          node scripts/build-core-js-from-source.mjs --verify-current >/dev/null
          node scripts/build-core-styles-from-source.mjs --verify-current >/dev/null
      - name: Package the exact five-file candidate only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,shutil
          expected=['assets/release-metadata.json','src/legacy/quarantine/core-pre-modals.js','src/legacy/scripts/inline-005.js','src/live-game/live-v2.js','tools/ui-smoke/verify-sc067-turbo-identity.js']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(changed)==sorted(expected),changed
          out=Path('/tmp/sc077-write');out.mkdir()
          receipt={'base':'35ffe81b52faad1651cc10cb6a83a0bfcb135ae0','files':{},'releaseApproved':False}
          for f in expected:
            target=out/f;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(f,target)
            receipt['files'][f]=hashlib.sha256(target.read_bytes()).hexdigest()
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          Path('sc077-diff.txt').write_bytes(subprocess.check_output(['git','diff','--',*expected]))
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sc077-verified-write
          path: /tmp/sc077-write/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sc077-reproduction-evidence
          path: |
            sc077-*.txt
            sc077-*.json
            sc077-images/
          retention-days: 14
  store:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sc077-verified-write
          path: /tmp/sc077-write
      - name: Store verified bytes on the isolated branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/sc077-zero-flash-verification
          test "$(git ls-remote origin refs/heads/work/sc077-zero-flash-verification | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,subprocess
          root=Path('/tmp/sc077-write');r=json.loads((root/'receipt.json').read_text())
          expected={'assets/release-metadata.json','src/legacy/quarantine/core-pre-modals.js','src/legacy/scripts/inline-005.js','src/live-game/live-v2.js','tools/ui-smoke/verify-sc067-turbo-identity.js'}
          assert r['base']=='35ffe81b52faad1651cc10cb6a83a0bfcb135ae0' and set(r['files'])==expected
          for f,h in r['files'].items():
            assert hashlib.sha256((root/f).read_bytes()).hexdigest()==h
            shutil.copyfile(root/f,f)
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==expected
          PY
          git diff --check
          git add -- assets/release-metadata.json src/legacy/quarantine/core-pre-modals.js src/legacy/scripts/inline-005.js src/live-game/live-v2.js tools/ui-smoke/verify-sc067-turbo-identity.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SC-077: verified Turbo pre-start render fix [skip ci]'
          git push origin HEAD:work/sc077-zero-flash-verification
          echo "SC077_STORED_COMMIT=$(git rev-parse HEAD)"
          git ls-tree -r HEAD -- assets/release-metadata.json src/legacy/quarantine/core-pre-modals.js src/legacy/scripts/inline-005.js src/live-game/live-v2.js tools/ui-smoke/verify-sc067-turbo-identity.js
