name: SC-077 isolated zero-flash verification
on:
  push:
    branches: [work/sc077-zero-flash-verification]
    paths: [.github/workflows/sc077-isolated-verification.yml]
permissions:
  contents: read
env:
  SC077_BASE: da7b6401be3cd73469affd9a1a851b43b8a6d742
  SC077_OLD: 73437b04db8e84a660be037e785796a78a8752b8
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: da7b6401be3cd73469affd9a1a851b43b8a6d742
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Guard exact inputs and retain the existing regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SC077_BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SC077_BASE"
          test "$(git ls-remote origin refs/heads/fix/sc077-turbo-prestart-zero-flash | cut -f1)" = "$SC077_OLD"
          git fetch --no-tags --depth=2 origin "$SC077_OLD"
          test "$(git rev-parse "$SC077_OLD^")" = 35ffe81b52faad1651cc10cb6a83a0bfcb135ae0
          git diff --exit-code "$SC077_OLD^" "$SC077_BASE" -- src/live-game/live-v2.js
          git show "$SC077_OLD:tools/ui-smoke/verify-sc067-turbo-identity.js" > tools/ui-smoke/verify-sc067-turbo-identity.js
          node --check tools/ui-smoke/verify-sc067-turbo-identity.js
      - name: Install existing locked tooling
        run: |
          npm ci --prefix scripts --ignore-scripts
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/ui-smoke --ignore-scripts
          npx --prefix tools/ui-smoke playwright install --with-deps chromium webkit
      - name: Reproduce on current main before copying the existing renderer fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = tools/ui-smoke/verify-sc067-turbo-identity.js
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc077-baseline-http.log 2>&1 &
          pid=$!; trap 'kill "$pid" || true' EXIT
          set +e
          SQ_APP_URL=http://127.0.0.1:8123/index.html timeout 180s node tools/ui-smoke/verify-sc067-turbo-identity.js > sc077-baseline.txt 2>&1
          status=$?
          set -e
          cat sc077-baseline.txt
          test "$status" -eq 1
          grep -q SC077_BASELINE_WITNESS= sc077-baseline.txt
          grep -q SC077_PRESTART_CONTENT sc077-baseline.txt
          test "$(git diff --name-only)" = tools/ui-smoke/verify-sc067-turbo-identity.js
      - name: Reconcile the unchanged fix to v0.14.3 without rewriting history
        run: |
          set -euo pipefail
          git show "$SC077_OLD:src/live-game/live-v2.js" > src/live-game/live-v2.js
          python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          p=Path('src/legacy/quarantine/core-pre-modals.js');s=p.read_text()
          before="const RUNNING_VERSION = '0.14.2';"
          assert s.count(before)==1
          p.write_text(s.replace(before,"const RUNNING_VERSION = '0.14.3';"))
          p=Path('assets/release-metadata.json');s=p.read_text();base=json.loads(s)
          assert base['currentVersion']=='0.14.2' and base['currentReleaseId']=='SC-072-LINEUP-CARDS'
          prior=json.loads(subprocess.check_output(['git','show',os.environ['SC077_OLD']+':assets/release-metadata.json']))
          entry=prior['releases'][0]
          assert entry['releaseId']=='SC-077-TURBO-PRESTART-ROWS' and entry['version']=='0.14.2'
          entry['version']='0.14.3'
          s=s.replace('"currentVersion": "0.14.2"','"currentVersion": "0.14.3"',1)
          s=s.replace('"currentReleaseId": "SC-072-LINEUP-CARDS"','"currentReleaseId": "SC-077-TURBO-PRESTART-ROWS"',1)
          marker='  "releases": [\n';assert s.count(marker)==1
          rendered='\n'.join('    '+line for line in json.dumps(entry,indent=2).splitlines())
          s=s.replace(marker,marker+rendered+',\n',1)
          assert json.loads(s)['releases'][1:]==base['releases']
          assert s.split(marker,1)[1].endswith(p.read_text().split(marker,1)[1])
          p.write_text(s)
          PY
          node scripts/materialize-runtime.mjs
          node scripts/build-core-js-from-source.mjs --verify-current > sc077-js-parity.json
          node scripts/build-core-styles-from-source.mjs --verify-current > sc077-css-parity.json
          node tools/ui-smoke/verify-sc050-release-notes.mjs
          git diff --check
      - name: Verify source and dist with unchanged Chromium and WebKit assertions
        shell: bash
        run: |
          set -euo pipefail
          npm run build > sc077-build.txt 2>&1
          npm run verify:dist > sc077-dist.txt 2>&1
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc077-source-http.log 2>&1 &
          source_pid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc077-dist-http.log 2>&1 &
          dist_pid=$!
          trap 'kill "$source_pid" "$dist_pid" || true' EXIT
          for browser in chromium webkit; do
            for build in source dist; do
              port=8123; if [ "$build" = dist ]; then port=8124; fi
              SQ_BROWSER="$browser" SQ_APP_URL="http://127.0.0.1:$port/index.html" SQ_SCREENSHOTS="sc077-images/$browser-$build" timeout 180s node tools/ui-smoke/verify-sc067-turbo-identity.js | tee "sc077-$browser-$build.txt"
            done
          done
          node scripts/build-core-js-from-source.mjs --verify-current >/dev/null
          node scripts/build-core-styles-from-source.mjs --verify-current >/dev/null
      - name: Package only verified files from the current-main candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,shutil
          expected=['assets/release-metadata.json','src/legacy/quarantine/core-pre-modals.js','src/legacy/scripts/inline-005.js','src/live-game/live-v2.js','tools/ui-smoke/verify-sc067-turbo-identity.js']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(changed)==sorted(expected),changed
          for f in ['src/live-game/live-v2.js','tools/ui-smoke/verify-sc067-turbo-identity.js']:
            assert Path(f).read_bytes()==subprocess.check_output(['git','show',os.environ['SC077_OLD']+':'+f])
          out=Path('/tmp/sc077-write');out.mkdir()
          receipt={'base':os.environ['SC077_BASE'],'previousCandidate':os.environ['SC077_OLD'],'version':'0.14.3','files':{},'blobs':{},'releaseApproved':False}
          for f in expected:
            target=out/f;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(f,target)
            data=target.read_bytes()
            receipt['files'][f]=hashlib.sha256(data).hexdigest()
            receipt['blobs'][f]=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          subprocess.run(['git','add','--',*expected],check=True)
          receipt['verifiedTree']=subprocess.check_output(['git','write-tree'],text=True).strip()
          subprocess.run(['git','diff','--cached','--check'],check=True)
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          Path('sc077-receipt.json').write_text(json.dumps(receipt,indent=2))
          Path('sc077-diff.txt').write_bytes(subprocess.check_output(['git','diff','--cached','--',*expected]))
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sc077-verified-write
          path: /tmp/sc077-write/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sc077-reproduction-evidence
          path: |
            sc077-*.txt
            sc077-*.json
            sc077-images/
          retention-days: 14
  store:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sc077-verified-write
          path: /tmp/sc077-write
      - name: Store verified bytes on the existing isolated helper only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/sc077-zero-flash-verification
          test "$(git ls-remote origin refs/heads/work/sc077-zero-flash-verification | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SC077_BASE"
          test "$(git ls-remote origin refs/heads/fix/sc077-turbo-prestart-zero-flash | cut -f1)" = "$SC077_OLD"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,subprocess,os
          root=Path('/tmp/sc077-write');r=json.loads((root/'receipt.json').read_text())
          expected={'assets/release-metadata.json','src/legacy/quarantine/core-pre-modals.js','src/legacy/scripts/inline-005.js','src/live-game/live-v2.js','tools/ui-smoke/verify-sc067-turbo-identity.js'}
          assert r['base']==os.environ['SC077_BASE'] and r['previousCandidate']==os.environ['SC077_OLD']
          assert set(r['files'])==expected and r['releaseApproved'] is False
          for f,h in r['files'].items():
            data=(root/f).read_bytes()
            assert hashlib.sha256(data).hexdigest()==h
            assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==r['blobs'][f]
            shutil.copyfile(root/f,f)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed and changed.issubset(expected),changed
          print(json.dumps(r,indent=2))
          PY
          git diff --check
          git add -- assets/release-metadata.json src/legacy/quarantine/core-pre-modals.js src/legacy/scripts/inline-005.js src/live-game/live-v2.js tools/ui-smoke/verify-sc067-turbo-identity.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SC-077: verified current-main v0.14.3 candidate [skip ci]'
          git push origin HEAD:work/sc077-zero-flash-verification
          echo "SC077_STORED_COMMIT=$(git rev-parse HEAD)"
          git ls-tree -r HEAD -- assets/release-metadata.json src/legacy/quarantine/core-pre-modals.js src/legacy/scripts/inline-005.js src/live-game/live-v2.js tools/ui-smoke/verify-sc067-turbo-identity.js
