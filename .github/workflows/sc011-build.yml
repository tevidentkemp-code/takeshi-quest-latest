name: SC-011 Progression rolling average build

on:
  push:
    branches:
      - fix/sc011-progression-rolling-average
    paths:
      - .github/workflows/sc011-build.yml

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/sc011-progression-rolling-average
          fetch-depth: 0

      - name: Apply bounded SC-011 patch
        run: python3 tools/sc011_patch.py

      - name: Diff guard
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html tools/ui-smoke/verify-progression-modes.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI smoke dependencies
        working-directory: tools/ui-smoke
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: tools/ui-smoke
        run: npx playwright install --with-deps chromium

      - name: Start local app server
        run: |
          python3 -m http.server 8123 >/tmp/sc011-http.log 2>&1 &
          echo $! >/tmp/sc011-http.pid
          sleep 2

      - name: Player Stats regression
        working-directory: tools/ui-smoke
        run: node verify-pstats.js

      - name: Progression rolling-average regression
        working-directory: tools/ui-smoke
        run: node verify-progression-modes.js

      - name: Full mobile smoke
        working-directory: tools/ui-smoke
        run: node smoke.js

      - name: Commit verified bounded patch
        run: |
          rm -f tools/sc011_patch.py .github/workflows/sc011-build.yml
          git add -A index.html tools/ui-smoke/verify-progression-modes.js tools/sc011_patch.py .github/workflows/sc011-build.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SC-011: correct Progression rolling averages"
          git push origin HEAD:fix/sc011-progression-rolling-average
