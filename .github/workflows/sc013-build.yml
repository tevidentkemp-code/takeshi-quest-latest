name: SC-013 Spider scale and target eligibility build
on:
  push:
    branches: [fix/sc013-spider-scale-eligibility]
    paths: [.github/workflows/sc013-build.yml]
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/sc013-spider-scale-eligibility
      - name: Apply bounded SC-013 patch
        run: python3 tools/sc013_patch.py
      - name: Diff guard before tests
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html | head -n 600
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install UI smoke dependencies
        working-directory: tools/ui-smoke
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tools/ui-smoke
        run: npx playwright install --with-deps chromium
      - name: Prepare legacy screenshot path
        run: |
          sudo mkdir -p /tmp/shateki-ui-shots
          sudo chown -R "$USER":"$USER" /tmp/shateki-ui-shots
          sudo mkdir -p /home/user/takeshi-quest-latest/docs/ui-audit/screenshots
          sudo chown -R "$USER":"$USER" /home/user/takeshi-quest-latest
      - name: Start local app server
        run: |
          python3 -m http.server 8123 >/tmp/sc013-http.log 2>&1 &
          echo $! > /tmp/sc013-http.pid
          sleep 2
      - name: Player Stats regression
        working-directory: tools/ui-smoke
        run: node verify-pstats.js
      - name: SC-008 regression
        working-directory: tools/ui-smoke
        run: node verify-sc008.js
      - name: SC-009 regression
        working-directory: tools/ui-smoke
        run: node verify-sc009.js
      - name: SC-010 regression
        working-directory: tools/ui-smoke
        run: node verify-sc010.js
      - name: SC-011 Progression regression
        working-directory: tools/ui-smoke
        run: node verify-progression-modes.js
      - name: SC-012 target rankings / Spider comparison regression
        working-directory: tools/ui-smoke
        run: node verify-sc012.js
      - name: SC-013 Spider scale / eligibility regression
        working-directory: tools/ui-smoke
        run: node verify-sc013.js
      - name: Full mobile smoke
        working-directory: tools/ui-smoke
        run: node smoke.js
      - name: Commit verified bounded patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'SC-013: refine Spider scale and ranking eligibility' || exit 0
          git push
