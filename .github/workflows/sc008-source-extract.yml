name: SC-008 bounded client apply

on:
  push:
    branches:
      - fix/sc008-achievement-ui
    paths:
      - '.github/workflows/sc008-source-extract.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify production base and apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "c5688cf19d2d8f7bf57cd9c991009f97292cb8a3"
          python tools/sc008_patch.py
          git diff --check
          test "$(git diff --name-only)" = "index.html"

      - name: Commit bounded client patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "fix(sc008): expose achievement v2 and Misfire history"
          git push

# SC-008 rerun after app-script-only syntax validation adjustment.
