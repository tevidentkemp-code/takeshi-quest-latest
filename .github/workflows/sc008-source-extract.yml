name: SC-008 source extract

on:
  push:
    branches:
      - fix/sc008-achievement-ui
    paths:
      - '.github/workflows/sc008-source-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact production file and capture bounded source slices
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "c5688cf19d2d8f7bf57cd9c991009f97292cb8a3"
          python - <<'PY'
          from pathlib import Path

          text = Path('index.html').read_text(encoding='utf-8')
          outdir = Path('.sc008'); outdir.mkdir(exist_ok=True)

          def slice_file(name, needle, before, after):
              positions=[]; start=0
              while True:
                  p=text.find(needle,start)
                  if p < 0: break
                  positions.append(p); start=p+len(needle)
              chunks=[f'INDEX_BLOB=c5688cf19d2d8f7bf57cd9c991009f97292cb8a3',f'NEEDLE={needle!r}',f'POSITIONS={positions}']
              for i,p in enumerate(positions,1):
                  lo=max(0,p-before); hi=min(len(text),p+len(needle)+after)
                  chunks.append(f'\n===== MATCH {i} @ {p} [{lo}:{hi}] =====\n{text[lo:hi]}')
              (outdir/name).write_text('\n'.join(chunks),encoding='utf-8')

          slice_file('catalog.txt','const SQ_ACH = {',1000,30000)
          slice_file('trophy-case.txt','function __sqTrophyCase',1500,18000)
          slice_file('pstats.txt','openPlayerStatsDialog',12000,18000)
          slice_file('ach-fetch.txt','v_player_achievements',7000,7000)
          slice_file('ach-map.txt','achMap',7000,7000)
          PY

      - name: Commit diagnostic extracts to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sc008/catalog.txt .sc008/trophy-case.txt .sc008/pstats.txt .sc008/ach-fetch.txt .sc008/ach-map.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(sc008): capture bounded Player Stats source slices"
            git push
          fi
