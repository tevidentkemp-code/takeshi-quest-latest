name: SC-008 source extract

on:
  push:
    branches:
      - fix/sc008-achievement-ui
    paths:
      - '.github/workflows/sc008-source-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact production file and capture targeted excerpts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "c5688cf19d2d8f7bf57cd9c991009f97292cb8a3"
          python - <<'PY'
          from pathlib import Path

          text = Path('index.html').read_text(encoding='utf-8')
          targets = [
              'Trophy Vault',
              'v_player_achievements',
              'v_player_xp',
              'player_achievements',
              'Player Stats',
              'Achievements',
              'achievement',
              'giftXp',
              'giftXP',
              'XP gift',
              'Misfire',
          ]
          radius = 2600
          max_matches = 8
          out = [f'INDEX_BLOB=c5688cf19d2d8f7bf57cd9c991009f97292cb8a3', f'INDEX_CHARS={len(text)}']
          for target in targets:
              out.append(f'\n===== TARGET: {target!r} =====')
              start = 0
              found = 0
              while found < max_matches:
                  pos = text.find(target, start)
                  if pos < 0:
                      break
                  found += 1
                  lo = max(0, pos - radius)
                  hi = min(len(text), pos + len(target) + radius)
                  out.append(f'\n--- MATCH {found} @ {pos} [{lo}:{hi}] ---\n{text[lo:hi]}')
                  start = pos + len(target)
              out.append(f'COUNT_SHOWN={found}')
          Path('.sc008').mkdir(exist_ok=True)
          Path('.sc008/extract.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit diagnostic extract to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sc008/extract.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(sc008): capture exact targeted source excerpts"
            git push
          fi
