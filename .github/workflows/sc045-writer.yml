name: SC-045 guarded writer
on:
  push:
    branches: [sc045-dmd-arcade-language]
    paths:
      - tools/sc045_apply_patch.py
      - .github/workflows/sc045-writer.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sc045-dmd-arcade-language
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Confirm exact production parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8b2647bb92083d4a9b6fcb3a9de01c4a8643c29d HEAD
          git status --short
      - name: Apply bounded SC-045 patch
        run: python3 tools/sc045_apply_patch.py
      - name: Install deterministic tooling
        run: |
          npm ci --prefix scripts --ignore-scripts
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate semantic runtime and verify
        shell: bash
        run: |
          set -euo pipefail
          npm run materialize
          node tools/ui-smoke/verify-sc045-dmd-arcade.mjs
          node --check src/game/engine.js
          node --check src/app/router-ui.js
          node --check src/app/state.js
          node --check src/live-game/live-v2.js
          node --check src/legacy/scripts/inline-007.js
          node scripts/verify-modularization.mjs
          npm run build
          npm run verify:dist
          git diff --check
      - name: Prove bounded write set
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          for f in $changed; do
            case "$f" in
              src/game/engine.js|src/app/router-ui.js|src/app/state.js|src/live-game/live-v2.js|src/legacy/scripts/inline-005.js|src/legacy/scripts/inline-007.js|src/legacy/intentional-patches.json|tools/ui-smoke/verify-sc045-dmd-arcade.mjs|tools/ui-smoke/verify-sc045-dmd-arcade.js|.github/workflows/sc045-dmd-arcade-qa.yml|tools/sc045_apply_patch.py|.github/workflows/sc045-writer.yml) ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done
      - name: Commit implementation and remove one-shot writer
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/sc045_apply_patch.py .github/workflows/sc045-writer.yml
          git config user.name "shateki-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SC-045: upgrade DMD arcade language and pinball motion"
          git push origin HEAD:sc045-dmd-arcade-language
