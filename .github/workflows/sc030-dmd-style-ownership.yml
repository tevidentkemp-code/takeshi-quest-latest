name: SC-030 DMD visual ownership

on:
  push:
    branches: [sc030-dmd-v2-modular]
    paths:
      - scripts/sc030-staticize-dmd-style.mjs
      - .github/workflows/sc030-dmd-style-ownership.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc030-dmd-style-ownership
  cancel-in-progress: false

jobs:
  verify-dmd-style-ownership:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Confirm production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Apply exact DMD visual ownership migration in verification workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sc030-style-generated sc030-style-write
          mkdir -p sc030-style-generated sc030-style-write
          node scripts/sc030-staticize-dmd-style.mjs sc030-style-generated/patch-evidence.json
          node --check src/live-game/dmd/controller.mjs
          node --check src/live-game/dmd/bootstrap.mjs
          node tools/ui-smoke/verify-sc030-dmd-v2.mjs | tee sc030-style-unit-results.txt
          git diff --check -- \
            src/live-game/dmd/controller.mjs \
            src/live-game/dmd/bootstrap.mjs \
            src/styles/live-game/topbar.css \
            tools/ui-smoke/verify-sc030-dmd-v2.mjs \
            tools/ui-smoke/verify-sc030-dmd-runtime.js

      - name: Build compatibility CSS from semantic source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-core-styles-from-source.mjs \
            --output sc030-style-generated/inline-002.css \
            --evidence sc030-style-generated/css-build-evidence.json \
            | tee sc030-style-css-build-results.txt
          cp sc030-style-generated/inline-002.css src/legacy/styles/inline-002.css
          node scripts/verify-core-styles-v2.mjs
          git diff --check -- src/styles src/legacy/styles/inline-002.css

      - name: Confirm core JS and HTML runtime remain source-current
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-core-js-from-source.mjs --verify-current | tee sc030-style-js-current-results.txt
          node scripts/render-index-from-source.mjs \
            --output sc030-style-generated/index.html \
            --evidence sc030-style-generated/html-build-evidence.json \
            | tee sc030-style-html-build-results.txt
          cmp -s sc030-style-generated/index.html index.html

      - name: Stage exact verified write set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            sc030-style-write/src/live-game/dmd \
            sc030-style-write/src/styles/live-game \
            sc030-style-write/src/legacy/styles \
            sc030-style-write/tools/ui-smoke
          cp src/live-game/dmd/controller.mjs sc030-style-write/src/live-game/dmd/controller.mjs
          cp src/live-game/dmd/bootstrap.mjs sc030-style-write/src/live-game/dmd/bootstrap.mjs
          cp src/styles/live-game/topbar.css sc030-style-write/src/styles/live-game/topbar.css
          cp src/legacy/styles/inline-002.css sc030-style-write/src/legacy/styles/inline-002.css
          cp tools/ui-smoke/verify-sc030-dmd-v2.mjs sc030-style-write/tools/ui-smoke/verify-sc030-dmd-v2.mjs
          cp tools/ui-smoke/verify-sc030-dmd-runtime.js sc030-style-write/tools/ui-smoke/verify-sc030-dmd-runtime.js
          cp sc030-style-generated/patch-evidence.json sc030-style-write/patch-evidence.json
          cp sc030-style-generated/css-build-evidence.json sc030-style-write/css-build-evidence.json

      - name: Install deterministic UI test dependencies
        shell: bash
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run DMD style ownership and full behaviour regression
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-sc030-dmd-runtime.js | tee sc030-style-dmd-runtime-results.txt
          node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc030-style-undo-results.txt
          node tools/ui-smoke/verify-sc014.js | tee sc030-style-setup-results.txt
          node tools/ui-smoke/smoke.js | tee sc030-style-smoke-results.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc030-style-classic-results.txt
          node tools/ui-smoke/verify-training-modes.js | tee sc030-style-training-results.txt
          node tools/ui-smoke/verify-progression-modes.js | tee sc030-style-progression-results.txt
          node tools/ui-smoke/verify-pstats.js | tee sc030-style-pstats-results.txt
          node tools/ui-smoke/verify-p23.js | tee sc030-style-admin-close-results.txt
          node tools/ui-smoke/verify-n5-stacking.js | tee sc030-style-admin-stacking-results.txt

      - name: Package verified DMD style write set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc030-style-write
          retention-days: 1
          path: sc030-style-write/

      - name: Keep DMD style QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc030-style-evidence
          retention-days: 7
          path: |
            sc030-style-generated/
            sc030-style-*-results.txt
            qa-artifacts

  commit-verified-dmd-style:
    needs: verify-dmd-style-ownership
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Confirm branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sc030-dmd-v2-modular
          test "$(git rev-parse origin/sc030-dmd-v2-modular)" = "${GITHUB_SHA}"

      - name: Download verified DMD style write set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sc030-style-write
          path: sc030-style-write

      - name: Validate and commit only approved visual ownership files
        shell: bash
        run: |
          set -euo pipefail
          expected=$'css-build-evidence.json\npatch-evidence.json\nsrc/legacy/styles/inline-002.css\nsrc/live-game/dmd/bootstrap.mjs\nsrc/live-game/dmd/controller.mjs\nsrc/styles/live-game/topbar.css\ntools/ui-smoke/verify-sc030-dmd-runtime.js\ntools/ui-smoke/verify-sc030-dmd-v2.mjs'
          actual="$(find sc030-style-write -type f -printf '%P\n' | sort)"
          test "$actual" = "$expected"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const patch = JSON.parse(fs.readFileSync('sc030-style-write/patch-evidence.json', 'utf8'));
          const css = JSON.parse(fs.readFileSync('sc030-style-write/css-build-evidence.json', 'utf8'));
          const map = {
            controller: 'src/live-game/dmd/controller.mjs',
            bootstrap: 'src/live-game/dmd/bootstrap.mjs',
            css: 'src/styles/live-game/topbar.css',
            unit: 'tools/ui-smoke/verify-sc030-dmd-v2.mjs',
            runtime: 'tools/ui-smoke/verify-sc030-dmd-runtime.js',
          };
          if (patch.layoutHeightChanged !== false || patch.scoringChanged !== false || patch.rendererChanged !== false || patch.blendModePresent !== false) {
            throw new Error('DMD visual migration contract changed');
          }
          for (const [key, path] of Object.entries(map)) {
            const current = fs.readFileSync(path);
            const verified = fs.readFileSync(`sc030-style-write/${path}`);
            if (sha(current) !== patch.files[key].oldSha256) throw new Error(`${path} moved since verified input`);
            if (sha(verified) !== patch.files[key].newSha256) throw new Error(`${path} verified output hash mismatch`);
          }
          const generatedCss = fs.readFileSync('sc030-style-write/src/legacy/styles/inline-002.css');
          if (css.authority !== 'semantic-css-source' || css.runtimeTarget !== 'src/legacy/styles/inline-002.css') throw new Error('unexpected CSS source authority');
          if (sha(generatedCss) !== css.runtimeSha256) throw new Error('generated compatibility CSS hash mismatch');
          NODE
          cp sc030-style-write/src/live-game/dmd/controller.mjs src/live-game/dmd/controller.mjs
          cp sc030-style-write/src/live-game/dmd/bootstrap.mjs src/live-game/dmd/bootstrap.mjs
          cp sc030-style-write/src/styles/live-game/topbar.css src/styles/live-game/topbar.css
          cp sc030-style-write/src/legacy/styles/inline-002.css src/legacy/styles/inline-002.css
          cp sc030-style-write/tools/ui-smoke/verify-sc030-dmd-v2.mjs tools/ui-smoke/verify-sc030-dmd-v2.mjs
          cp sc030-style-write/tools/ui-smoke/verify-sc030-dmd-runtime.js tools/ui-smoke/verify-sc030-dmd-runtime.js
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -v '^sc030-style-write/' || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/live-game/dmd/(controller|bootstrap)\.mjs|src/styles/live-game/topbar\.css|src/legacy/styles/inline-002\.css|tools/ui-smoke/verify-sc030-dmd-v2\.mjs|tools/ui-smoke/verify-sc030-dmd-runtime\.js)$' || true)"
          if [ -n "$bad" ]; then
            echo "Refusing write: unexpected DMD style files:"
            echo "$bad"
            exit 1
          fi
          git diff --check -- \
            src/live-game/dmd/controller.mjs \
            src/live-game/dmd/bootstrap.mjs \
            src/styles/live-game/topbar.css \
            src/legacy/styles/inline-002.css \
            tools/ui-smoke/verify-sc030-dmd-v2.mjs \
            tools/ui-smoke/verify-sc030-dmd-runtime.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/live-game/dmd/controller.mjs \
            src/live-game/dmd/bootstrap.mjs \
            src/styles/live-game/topbar.css \
            src/legacy/styles/inline-002.css \
            tools/ui-smoke/verify-sc030-dmd-v2.mjs \
            tools/ui-smoke/verify-sc030-dmd-runtime.js
          git commit -m "SC-030: move DMD skin to semantic CSS [skip ci]"
          git push origin HEAD:sc030-dmd-v2-modular
