name: SC-024 Misfire leaderboard build
on:
  push:
    branches:
      - sc024-misfire-leaderboards
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc024-misfire-leaderboards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded patch
        run: |
          python3 tools/ui-smoke/sc024-patch.py
          git diff --check
          git diff --stat
      - name: Install UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run SC-024 and standard regressions
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-sc008.js
          node tools/ui-smoke/verify-sc009.js
          node tools/ui-smoke/verify-sc010.js
          node tools/ui-smoke/verify-sc014.js
          node tools/ui-smoke/smoke.js
          node tools/ui-smoke/verify-saveplayer-card.js
      - name: Commit bounded product and regression files only
        run: |
          git diff --check
          git rm .github/workflows/sc024-build.yml tools/ui-smoke/sc024-patch.py
          git add index.html tools/ui-smoke/verify-sc009.js
          git status --short
          git config user.name 'tevidentkemp-code'
          git config user.email 'tevidentkemp@gmail.com'
          git commit -m 'SC-024: add Misfire award leaderboards'
          git push origin HEAD:sc024-misfire-leaderboards
