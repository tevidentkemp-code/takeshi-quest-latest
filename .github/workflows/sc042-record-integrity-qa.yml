name: SC-042 record integrity QA
on:
  push:
    branches:
      - sc042-record-integrity-fix
  pull_request:
    paths:
      - src/legacy/quarantine/core-pre-modals.js
      - src/legacy/scripts/inline-026.js
      - src/ui/modals.js
      - tools/ui-smoke/verify-sc025.js
      - tools/ui-smoke/verify-sc042-record-integrity.js
      - tools/ui-smoke/verify-sc042-record-integrity.mjs
      - .github/workflows/sc042-record-integrity-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Static contract and syntax
        run: |
          node tools/ui-smoke/verify-sc042-record-integrity.mjs
          node --check src/legacy/quarantine/core-pre-modals.js
          node --check src/legacy/scripts/inline-026.js
          node --check src/ui/modals.js
          node --check tools/ui-smoke/verify-sc025.js
          node --check tools/ui-smoke/verify-sc042-record-integrity.js
      - name: Architecture verification and exact build
        run: |
          npm ci --prefix scripts --ignore-scripts
          node scripts/verify-modularization.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Source and dist acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc042-source.log 2>&1 & spid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc042-dist.log 2>&1 & dpid=$!
          trap 'kill "$spid" "$dpid" || true' EXIT
          export SQ_APP_URL=http://127.0.0.1:8123/index.html
          node tools/ui-smoke/verify-sc042-record-integrity.js
          node tools/ui-smoke/verify-sc025.js
          export SQ_APP_URL=http://127.0.0.1:8124/index.html
          node tools/ui-smoke/verify-sc042-record-integrity.js
          node tools/ui-smoke/verify-sc025.js
      - name: Branch diff whitespace
        run: |
          git fetch origin main --quiet
          git diff --check origin/main...HEAD
