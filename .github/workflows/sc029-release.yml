name: SC-029 bounded release QA
on:
  push:
    branches: [sc029-player-stats-hub-polish-v2]
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc029-player-stats-hub-polish-v2
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded SC-029 patch
        run: |
          python3 tools/sc029_apply.py
          python3 tools/sc029_narrow_fix.py
      - name: Install existing UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run focused and regression QA
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-sc029.js | tee sc029-results.txt
          node tools/ui-smoke/verify-sc028.js | tee sc028-results.txt
          node tools/ui-smoke/verify-pstats.js | tee pstats-results.txt
          node tools/ui-smoke/verify-sc009.js | tee sc009-results.txt
          node tools/ui-smoke/verify-sc010.js | tee sc010-results.txt
          node tools/ui-smoke/verify-sc025.js | tee sc025-results.txt
          node tools/ui-smoke/smoke.js | tee smoke-results.txt
          git diff --check
      - name: Commit verified product patch
        shell: bash
        run: |
          git config user.name "tevidentkemp-code"
          git config user.email "tevidentkemp@gmail.com"
          git add index.html tools/ui-smoke/pstats-fixture.js tools/ui-smoke/verify-sc029.js .github/workflows/setup-qa.yml
          git commit -m "SC-029: polish Player Stats hub and restore Power Rank"
          git push origin HEAD:sc029-player-stats-hub-polish-v2
