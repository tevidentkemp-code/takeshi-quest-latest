name: SC-031 preview package

on:
  push:
    branches: [sc031-modular-architecture-migration]
    paths:
      - package.json
      - package-lock.json
      - vite.config.mjs
      - scripts/**
      - src/**
      - assets/**
      - tools/ui-smoke/**
      - .github/workflows/sc031-preview-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc031-preview-package
  cancel-in-progress: false

jobs:
  verify-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Confirm production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Install architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Materialize source-authority runtime
        run: node scripts/materialize-runtime.mjs

      - name: Install deterministic build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Vite preview candidate
        run: npm run build

      - name: Verify Vite dist contract
        run: npm run verify:dist

      - name: Install deterministic UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run preview scoring smoke and cloud-failure resilience
        shell: bash
        env:
          SQ_APP_URL: http://127.0.0.1:8123/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 --directory dist >/tmp/sc031-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/smoke.js | tee sc031-preview-smoke-results.txt
          node tools/ui-smoke/verify-cloud-failure-resilience.js | tee sc031-preview-cloud-results.txt

      - name: Stage exact preview write set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sc031-preview-write
          mkdir -p sc031-preview-write/preview/sc031
          cp -a dist/. sc031-preview-write/preview/sc031/
          cat > sc031-preview-write/preview/sc031/SC031_PREVIEW_BUILD.txt <<EOF
          SC-031 TEST PREVIEW
          Source commit: ${GITHUB_SHA}
          Production main remains unchanged.
          Built and smoke-tested by SC-031 preview package workflow.
          EOF
          test -f sc031-preview-write/preview/sc031/index.html
          test -f sc031-preview-write/preview/sc031/.nojekyll

      - name: Check source patch whitespace
        run: git diff --check

      - name: Package verified preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc031-preview-write
          retention-days: 1
          include-hidden-files: true
          path: sc031-preview-write/

      - name: Keep preview QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc031-preview-evidence
          retention-days: 14
          path: |
            sc031-preview-smoke-results.txt
            sc031-preview-cloud-results.txt
            sc031-vite-build-evidence.json

  commit-preview:
    needs: verify-preview
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Confirm branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sc031-modular-architecture-migration
          test "$(git rev-parse origin/sc031-modular-architecture-migration)" = "${GITHUB_SHA}"

      - name: Download verified preview
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sc031-preview-write
          path: sc031-preview-write

      - name: Apply only preview output
        shell: bash
        run: |
          set -euo pipefail
          test -f sc031-preview-write/preview/sc031/index.html
          test -f sc031-preview-write/preview/sc031/.nojekyll
          rm -rf preview/sc031
          mkdir -p preview
          cp -a sc031-preview-write/preview/sc031 preview/sc031

          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -v '^sc031-preview-write/' || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^preview/sc031/' || true)"
          if [ -n "$bad" ]; then
            echo 'Refusing preview write: unexpected changed paths:'
            echo "$bad"
            exit 1
          fi
          test -n "$changed"
          git diff --check -- preview/sc031
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A preview/sc031
          git commit -m 'SC-031: publish verified test preview [skip ci]'
          git push origin HEAD:sc031-modular-architecture-migration
