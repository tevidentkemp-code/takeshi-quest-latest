name: SC-023 Turbo diagnostic
on:
  push:
    branches: [sc023-turbo-live-recovery]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect original Turbo timer block
        shell: bash
        run: |
          git show e9f2f5986a56506547dc63ce3d22fbd502f20740:index.html > /tmp/old.html
          line=$(grep -n 'PATCH:FIX76_TURBO_20SEC_TIMER START' /tmp/old.html | head -1 | cut -d: -f1)
          echo "FIX76 line=$line"
          if [ -n "$line" ]; then sed -n "${line},$((line+190))p" /tmp/old.html; fi
          echo '=== countdown-related identifiers ==='
          grep -Ein 'countdown|timer-count|seconds-left|time-left|sqTurbo.*count' /tmp/old.html | head -80 || true
