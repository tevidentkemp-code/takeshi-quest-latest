name: SC-023 Turbo recovery
on:
  push:
    branches: [sc023-turbo-live-recovery]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 tools/sc023_patch.py
      - name: Check patch
        run: |
          node --check tools/ui-smoke/verify-classic-visual-fit.js
          git diff --check
          git diff --stat
      - name: Install test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run Turbo and race regression
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc023-results.txt
      - name: Commit verified branch patch
        run: |
          rm -f .github/workflows/sc023-turbo-diagnostic.yml .github/workflows/sc023-build.yml tools/sc023_patch.py
          git diff --check
          git config user.name 'tevidentkemp-code'
          git config user.email 'tevidentkemp@gmail.com'
          git add -A
          git commit -m 'SC-023: restore Turbo live timer and race'
          git push origin HEAD:sc023-turbo-live-recovery
