name: SC-023 Turbo diagnostic
on:
  push:
    branches: [sc023-turbo-live-recovery]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find Turbo timer/race introduction
        run: |
          echo '=== FIX76 introduction ==='
          git log --all --reverse --format='%H %ad %s' --date=iso -S'FIX76_TURBO_20SEC_TIMER' -- index.html | head -20
          echo '=== sqTurboSvg introduction ==='
          git log --all --reverse --format='%H %ad %s' --date=iso -S'sqTurboSvg' -- index.html | head -20
          echo '=== Turbo ready/countdown text history ==='
          git log --all --format='%H %ad %s' --date=iso -G'countdown|COUNTDOWN|20.SEC|sqTurboTimer|sqTurboSvg' -- index.html | head -40
