name: SC-032 DMD ownership QA

on:
  pull_request:
    paths:
      - src/legacy/scripts/inline-003.js
      - src/legacy/scripts/inline-004.js
      - src/legacy/scripts/inline-005.js
      - src/legacy/scripts/inline-007.js
      - src/legacy/scripts/inline-016.js
      - src/game/engine.js
      - src/live-game/live-v2.js
      - src/live-game/dmd/**
      - src/legacy/intentional-patches.json
      - tools/ui-smoke/verify-sc032-dmd-ownership.mjs
      - tools/ui-smoke/verify-sc032-dmd-runtime.js
      - docs/SC-032-DMD-PRODUCTION-AUDIT.md
      - .github/workflows/sc032-dmd-ownership-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Verify bounded DMD ownership contract
        run: node tools/ui-smoke/verify-sc032-dmd-ownership.mjs

      - name: Verify DMD module contracts and legacy patch evidence
        shell: bash
        run: |
          set -euo pipefail
          node --check src/live-game/dmd/controller.mjs
          node --check src/live-game/dmd/bootstrap.mjs
          node --check src/live-game/dmd/motion.mjs
          node --check src/game/engine.js
          node tools/ui-smoke/verify-sc030-dmd-v2.mjs | tee sc032-dmd-unit.txt
          node tools/ui-smoke/verify-sc030-reduced-motion.mjs | tee sc032-motion-unit.txt
          node scripts/verify-modularization.mjs | tee sc032-modular.txt

      - name: Install deterministic Vite dependencies and build dist
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee sc032-vite-build.txt
          npm run verify:dist | tee sc032-dist-verify.txt

      - name: Install deterministic UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run DMD runtime matrix against source and dist
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc032-source-http.log 2>&1 &
          source_pid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc032-dist-http.log 2>&1 &
          dist_pid=$!
          trap 'kill "$source_pid" "$dist_pid" || true' EXIT

          export SQ_APP_URL=http://127.0.0.1:8123/index.html
          export SQ_SCREENSHOTS=${{ github.workspace }}/qa-artifacts-sc032-source
          node tools/ui-smoke/verify-sc032-dmd-runtime.js | tee sc032-dmd-source.txt
          node tools/ui-smoke/verify-sc030-reduced-motion-runtime.js | tee sc032-source-motion.txt
          node tools/ui-smoke/verify-sc030-dmd-runtime.js | tee sc032-source-controller.txt
          node tools/ui-smoke/verify-sc030-actions-runtime.js | tee sc032-source-actions.txt
          node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc032-source-undo.txt
          node tools/ui-smoke/verify-sc030-artwork-isolation.js | tee sc032-source-artwork.txt
          node tools/ui-smoke/verify-sc030-responsive-runtime.js | tee sc032-source-responsive.txt
          node tools/ui-smoke/verify-sc030-final-convergence.js | tee sc032-source-convergence.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc032-source-classic.txt

          export SQ_APP_URL=http://127.0.0.1:8124/index.html
          export SQ_SCREENSHOTS=${{ github.workspace }}/qa-artifacts-sc032-dist
          node tools/ui-smoke/verify-sc032-dmd-runtime.js | tee sc032-dmd-dist.txt
          node tools/ui-smoke/verify-sc030-reduced-motion-runtime.js | tee sc032-dist-motion.txt
          node tools/ui-smoke/verify-sc030-dmd-runtime.js | tee sc032-dist-controller.txt
          node tools/ui-smoke/verify-sc030-actions-runtime.js | tee sc032-dist-actions.txt
          node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc032-dist-undo.txt
          node tools/ui-smoke/verify-sc030-artwork-isolation.js | tee sc032-dist-artwork.txt
          node tools/ui-smoke/verify-sc030-responsive-runtime.js | tee sc032-dist-responsive.txt
          node tools/ui-smoke/verify-sc030-final-convergence.js | tee sc032-dist-convergence.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc032-dist-classic.txt

      - name: Check delivery whitespace
        run: git diff --check HEAD^ HEAD

      - name: Keep focused DMD evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc032-dmd-ownership-evidence
          retention-days: 14
          path: |
            sc032-*.txt
            qa-artifacts-sc032-source/
            qa-artifacts-sc032-dist/
