name: SC-030 final visual convergence writer

on:
  push:
    branches: [sc030-dmd-v2-modular]
    paths:
      - scripts/sc030-final-convergence.mjs
      - .github/workflows/sc030-final-convergence-writer.yml

permissions:
  contents: write

concurrency:
  group: sc030-final-convergence-writer
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: sc030-dmd-v2-modular

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Confirm isolated branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "sc030-dmd-v2-modular"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Apply bounded convergence patch
        run: node scripts/sc030-final-convergence.mjs

      - name: Materialize source-authoritative runtime
        run: node scripts/materialize-runtime.mjs

      - name: Pre-commit verification
        shell: bash
        run: |
          set -euo pipefail
          node --check src/legacy/scripts/inline-007.js
          node --check tools/ui-smoke/verify-classic-visual-fit.js
          node --check tools/ui-smoke/verify-sc030-final-convergence.js
          node tools/ui-smoke/verify-sc030-dmd-v2.mjs
          node scripts/verify-modularization.mjs
          git diff --check

      - name: Remove one-shot writer surface and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/sc030-final-convergence.mjs
          rm -f .github/workflows/sc030-final-convergence-writer.yml
          rm -f .sc031-build-html-evidence.json .sc031-build-css-evidence.json .sc031-build-js-evidence.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No convergence changes to commit"; exit 1; }
          git commit -m "SC-030: converge final DMD and live-game framing"
          git push origin HEAD:sc030-dmd-v2-modular
