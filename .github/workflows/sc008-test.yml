name: SC-008 Player Stats regression

on:
  push:
    branches:
      - fix/sc008-achievement-ui
    paths:
      - '.github/workflows/sc008-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Install UI smoke dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Serve app
        run: |
          python3 -m http.server 8123 >/tmp/sc008-http.log 2>&1 &
          echo $! >/tmp/sc008-http.pid
          sleep 2

      - name: Run Player Stats regression
        working-directory: tools/ui-smoke
        run: node verify-pstats.js

      - name: Run SC-008 regression
        working-directory: tools/ui-smoke
        run: node verify-sc008.js

      - name: Run full mobile smoke journey
        working-directory: tools/ui-smoke
        run: node smoke.js
