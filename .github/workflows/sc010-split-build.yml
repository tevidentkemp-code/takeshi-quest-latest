name: SC-010 positive achievement split-read build

on:
  push:
    branches:
      - fix/sc010-achievement-split-read
    paths:
      - .github/workflows/sc010-split-build.yml

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/sc010-achievement-split-read
          fetch-depth: 0

      - name: Apply bounded SC-010 split-read patch
        run: python3 tools/sc010_split_patch.py

      - name: Diff guard
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html tools/ui-smoke/pstats-fixture.js tools/ui-smoke/verify-sc010.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert "SB.from('v_ach_base').select('code,cnt,xp').eq('player_id', playerId)" in s
          assert "SB.from('v_ach_david_goliath').select('code,cnt,xp').eq('player_id', playerId)" in s
          start = s.index('const SQ_ACH = {')
          end = s.index('window.SQ_ACH = SQ_ACH;', start)
          ach = s[start:end]
          assert "SB.from('v_player_achievements')" not in ach
          assert 'distinctBaseCodes >= 10' in ach
          assert 'distinctBaseCodes >= 20' in ach
          print('SC-010 source guards PASS')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI smoke dependencies
        working-directory: tools/ui-smoke
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: tools/ui-smoke
        run: npx playwright install --with-deps chromium

      - name: Prepare legacy screenshot path
        run: |
          sudo mkdir -p /home/user/takeshi-quest-latest/docs/ui-audit/screenshots
          sudo chown -R "$USER":"$USER" /home/user/takeshi-quest-latest

      - name: Start local app server
        run: |
          python3 -m http.server 8123 >/tmp/sc010-http.log 2>&1 &
          echo $! >/tmp/sc010-http.pid
          sleep 2

      - name: Player Stats regression
        working-directory: tools/ui-smoke
        run: node verify-pstats.js

      - name: SC-008 regression
        working-directory: tools/ui-smoke
        run: node verify-sc008.js

      - name: SC-009 regression
        working-directory: tools/ui-smoke
        run: node verify-sc009.js

      - name: SC-010 split-read regression
        working-directory: tools/ui-smoke
        run: node verify-sc010.js

      - name: SC-011 Progression regression
        working-directory: tools/ui-smoke
        run: node verify-progression-modes.js

      - name: Full mobile smoke
        working-directory: tools/ui-smoke
        run: node smoke.js

      - name: Commit verified bounded patch
        run: |
          rm -f tools/sc010_split_patch.py .github/workflows/sc010-split-build.yml
          git add -A index.html tools/ui-smoke/pstats-fixture.js tools/ui-smoke/verify-sc010.js tools/sc010_split_patch.py .github/workflows/sc010-split-build.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SC-010: split positive achievement reads"
          git push origin HEAD:fix/sc010-achievement-split-read
