name: SC-012 cleanup temporary build artifacts
on:
  push:
    branches: [feature/sc012-target-rankings-spider-compare]
    paths: [.github/workflows/sc012-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sc012-target-rankings-spider-compare
          fetch-depth: 0
      - name: Remove temporary SC-012 build artifacts
        run: |
          git rm -r _sc012_extract
          git rm .github/workflows/sc012-build.yml
          git rm .github/workflows/sc012-extract.yml
          git rm .github/workflows/sc012-cleanup.yml
          git rm tools/sc012_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'SC-012: remove temporary build artifacts'
          git push
