name: SC-052 DMD Brutal Commentary QA
on:
  pull_request:
    paths:
      - src/game/engine.js
      - src/live-game/dmd/bootstrap.mjs
      - src/live-game/dmd/commentary.mjs
      - tools/ui-smoke/verify-sc052-dmd-commentary.mjs
      - tools/ui-smoke/verify-sc052-dmd-commentary.js
      - .github/workflows/sc052-dmd-commentary-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts
      - name: Commentary contracts
        run: |
          node --check src/live-game/dmd/commentary.mjs
          node --check src/live-game/dmd/bootstrap.mjs
          node --check src/game/engine.js
          node --check tools/ui-smoke/verify-sc052-dmd-commentary.mjs
          node --check tools/ui-smoke/verify-sc052-dmd-commentary.js
          node tools/ui-smoke/verify-sc052-dmd-commentary.mjs
          node scripts/verify-modularization.mjs
      - name: Build exact candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Source and dist commentary runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc052-source.log 2>&1 & spid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc052-dist.log 2>&1 & dpid=$!
          trap 'kill "$spid" "$dpid" || true' EXIT
          export SQ_APP_URL=http://127.0.0.1:8123/index.html
          node tools/ui-smoke/verify-sc052-dmd-commentary.js
          node tools/ui-smoke/verify-sc032-dmd-runtime.js
          export SQ_APP_URL=http://127.0.0.1:8124/index.html
          node tools/ui-smoke/verify-sc052-dmd-commentary.js
          node tools/ui-smoke/verify-sc032-dmd-runtime.js
      - name: Existing DMD arcade regression
        run: node tools/ui-smoke/verify-sc045-dmd-arcade.mjs
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
