name: SC-034 + SC-036 release candidate QA

on:
  push:
    branches: [batch-sc034-sc036]
    paths:
      - src/**
      - tools/ui-smoke/**
      - scripts/**
      - package.json
      - package-lock.json
      - vite.config.*
      - .github/workflows/sc034-batch-qa.yml
  # Pull-request coverage is consolidated in core-release-qa.yml.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc034-sc036-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Confirm current production ancestry and clean delivery surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git diff --check origin/main...HEAD

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Verify semantic source authority and static contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-modularization.mjs | tee sc03436-modular.txt
          node scripts/build-core-js-from-source.mjs --verify-current | tee sc03436-js-authority.txt
          node scripts/build-core-styles-from-source.mjs --verify-current | tee sc03436-css-authority.txt
          node tools/ui-smoke/verify-sc032-dmd-ownership.mjs | tee sc03436-dmd-ownership.txt
          node tools/ui-smoke/verify-sc030-dmd-v2.mjs | tee sc03436-dmd-unit.txt
          node tools/ui-smoke/verify-sc030-reduced-motion.mjs | tee sc03436-motion-unit.txt
          node tools/ui-smoke/verify-sc042-record-integrity.mjs | tee sc03436-record-static.txt
          node tools/ui-smoke/verify-sc045-dmd-arcade.mjs | tee sc03436-arcade-static.txt
          node --check src/game/engine.js
          node --check src/live-game/live-v2.js
          node --check src/legacy/scripts/inline-030.js
          node --check tools/ui-smoke/verify-sc034-add-player.js
          node --check tools/ui-smoke/verify-sc036-skip-go.js

      - name: Build exact production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee sc03436-vite-build.txt
          npm run verify:dist | tee sc03436-dist-verify.txt
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/build-core-styles-from-source.mjs --verify-current

      - name: Install deterministic browser QA
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Full source runtime acceptance
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts-sc03436-source
          SQ_APP_URL: http://127.0.0.1:8123/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc03436-source.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          timeout 180s node tools/ui-smoke/verify-sc034-add-player.js | tee sc03436-source-add-player.txt
          timeout 180s node tools/ui-smoke/verify-sc036-skip-go.js | tee sc03436-source-skip-go.txt
          timeout 180s node tools/ui-smoke/verify-sc033-throw-order.js | tee sc03436-source-throw-order.txt
          timeout 240s node tools/ui-smoke/smoke.js | tee sc03436-source-smoke.txt
          timeout 180s node tools/ui-smoke/verify-sc014.js | tee sc03436-source-setup.txt
          timeout 180s node tools/ui-smoke/verify-saveplayer-card.js | tee sc03436-source-saveplayer.txt
          timeout 180s node tools/ui-smoke/verify-classic-visual-fit.js | tee sc03436-source-classic.txt
          timeout 180s node tools/ui-smoke/verify-training-modes.js | tee sc03436-source-training.txt
          timeout 180s node tools/ui-smoke/verify-progression-modes.js | tee sc03436-source-progression.txt
          timeout 180s node tools/ui-smoke/verify-pstats.js | tee sc03436-source-pstats.txt
          timeout 180s node tools/ui-smoke/verify-p23.js | tee sc03436-source-p23.txt
          timeout 180s node tools/ui-smoke/verify-n5-stacking.js | tee sc03436-source-n5.txt
          timeout 180s node tools/ui-smoke/verify-sc042-record-integrity.js | tee sc03436-source-record.txt
          timeout 180s node tools/ui-smoke/verify-sc042-postgame-polish.js | tee sc03436-source-postgame.txt
          timeout 180s node tools/ui-smoke/verify-sc025.js | tee sc03436-source-sc025.txt
          timeout 180s node tools/ui-smoke/verify-sc045-dmd-arcade.js | tee sc03436-source-arcade.txt
          timeout 180s node tools/ui-smoke/verify-sc032-dmd-runtime.js | tee sc03436-source-dmd.txt
          timeout 180s node tools/ui-smoke/verify-sc030-reduced-motion-runtime.js | tee sc03436-source-motion.txt
          timeout 180s node tools/ui-smoke/verify-sc030-actions-runtime.js | tee sc03436-source-actions.txt
          timeout 180s node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc03436-source-undo.txt
          timeout 180s node tools/ui-smoke/verify-cloud-failure-resilience.js | tee sc03436-source-cloud.txt

      - name: Full built-dist runtime acceptance
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts-sc03436-dist
          SQ_APP_URL: http://127.0.0.1:8124/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc03436-dist.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          timeout 180s node tools/ui-smoke/verify-sc034-add-player.js | tee sc03436-dist-add-player.txt
          timeout 180s node tools/ui-smoke/verify-sc036-skip-go.js | tee sc03436-dist-skip-go.txt
          timeout 180s node tools/ui-smoke/verify-sc033-throw-order.js | tee sc03436-dist-throw-order.txt
          timeout 240s node tools/ui-smoke/smoke.js | tee sc03436-dist-smoke.txt
          timeout 180s node tools/ui-smoke/verify-classic-visual-fit.js | tee sc03436-dist-classic.txt
          timeout 180s node tools/ui-smoke/verify-training-modes.js | tee sc03436-dist-training.txt
          timeout 180s node tools/ui-smoke/verify-progression-modes.js | tee sc03436-dist-progression.txt
          timeout 180s node tools/ui-smoke/verify-pstats.js | tee sc03436-dist-pstats.txt
          timeout 180s node tools/ui-smoke/verify-sc042-record-integrity.js | tee sc03436-dist-record.txt
          timeout 180s node tools/ui-smoke/verify-sc042-postgame-polish.js | tee sc03436-dist-postgame.txt
          timeout 180s node tools/ui-smoke/verify-sc045-dmd-arcade.js | tee sc03436-dist-arcade.txt
          timeout 180s node tools/ui-smoke/verify-sc032-dmd-runtime.js | tee sc03436-dist-dmd.txt
          timeout 180s node tools/ui-smoke/verify-sc030-reduced-motion-runtime.js | tee sc03436-dist-motion.txt
          timeout 180s node tools/ui-smoke/verify-sc030-actions-runtime.js | tee sc03436-dist-actions.txt
          timeout 180s node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc03436-dist-undo.txt
          timeout 180s node tools/ui-smoke/verify-cloud-failure-resilience.js | tee sc03436-dist-cloud.txt

      - name: Final candidate cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          git status --short

      - name: Keep SC-034/036 release-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sc034-sc036-release-candidate-evidence
          retention-days: 14
          path: |
            sc03436-*.txt
            qa-artifacts-sc03436-source/
            qa-artifacts-sc03436-dist/
