name: SXP-04 clean sidequest release QA

on:
  push:
    branches: [release/sxp04-sidequest-clean]
    paths:
      - package.json
      - package-lock.json
      - vite.config.mjs
      - scripts/**
      - src/**
      - assets/release-metadata.json
      - tools/ui-smoke/**
      - .github/workflows/sxp04-clean-sidequest-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sxp04-clean-sidequest-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Confirm clean production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "5631969c235ff375b6d59ca5fdbaf45d7ca09648"

      - name: Install architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Materialize canonical runtime
        run: node scripts/materialize-runtime.mjs

      - name: Verify generated source authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/build-core-styles-from-source.mjs --verify-current

      - name: Run side-quest regression guard
        run: node tools/ui-smoke/verify-sxp04-sidequest.mjs

      - name: Install deterministic build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Vite candidate
        run: npm run build

      - name: Verify Vite dist contract
        run: npm run verify:dist

      - name: Install deterministic UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run scoring smoke offline
        shell: bash
        env:
          SQ_APP_URL: http://127.0.0.1:8123/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 --directory dist >/tmp/sxp04-clean-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/smoke.js | tee sxp04-clean-smoke.txt

      - name: Run post-game XP readiness regression
        shell: bash
        env:
          SQ_APP_URL: http://127.0.0.1:8124/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sxp04-clean-xp-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-sc038-ui.js | tee sxp04-clean-xp.txt

      - name: Run classic mobile visual fit
        shell: bash
        env:
          SQ_APP_URL: http://127.0.0.1:8125/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8125 --bind 127.0.0.1 --directory dist >/tmp/sxp04-clean-fit-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sxp04-clean-visual-fit.txt

      - name: Stage generated runtime only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sxp04-clean-write
          mkdir -p sxp04-clean-write/src/legacy/styles sxp04-clean-write/src/legacy/scripts
          cp index.html sxp04-clean-write/index.html
          cp src/legacy/styles/inline-002.css sxp04-clean-write/src/legacy/styles/inline-002.css
          cp src/legacy/scripts/inline-005.js sxp04-clean-write/src/legacy/scripts/inline-005.js

      - name: Package generated runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sxp04-clean-write
          retention-days: 1
          path: sxp04-clean-write/

      - name: Keep QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sxp04-clean-evidence
          retention-days: 14
          path: |
            sxp04-clean-smoke.txt
            sxp04-clean-xp.txt
            sxp04-clean-visual-fit.txt
            sc031-vite-build-evidence.json

  commit-generated:
    needs: verify
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Confirm branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/sxp04-sidequest-clean
          test "$(git rev-parse origin/release/sxp04-sidequest-clean)" = "${GITHUB_SHA}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sxp04-clean-write
          path: sxp04-clean-write

      - name: Apply generated runtime only
        shell: bash
        run: |
          set -euo pipefail
          cp sxp04-clean-write/index.html index.html
          cp sxp04-clean-write/src/legacy/styles/inline-002.css src/legacy/styles/inline-002.css
          cp sxp04-clean-write/src/legacy/scripts/inline-005.js src/legacy/scripts/inline-005.js
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -v '^sxp04-clean-write/' || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(index.html|src/legacy/styles/inline-002.css|src/legacy/scripts/inline-005.js)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Refusing generated write: unexpected changed paths:'
            echo "$bad"
            exit 1
          fi
          test -n "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/legacy/styles/inline-002.css src/legacy/scripts/inline-005.js
          git commit -m 'SXP-04: materialize clean sidequest runtime [skip ci]'
          git push origin HEAD:release/sxp04-sidequest-clean
