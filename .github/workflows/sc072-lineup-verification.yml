name: SC-072 isolated line-up verification
on:
  push:
    branches: [work/sc072-lineup-verification]
    paths: [.github/workflows/sc072-lineup-verification.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 35ffe81b52faad1651cc10cb6a83a0bfcb135ae0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install existing locked tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sc072-evidence" "$RUNNER_TEMP/sc072-patch"
          npm ci --ignore-scripts
          npm ci --prefix scripts --ignore-scripts
          npm ci --prefix tools/ui-smoke --ignore-scripts
          npx --prefix tools/ui-smoke playwright install --with-deps chromium webkit
      - name: Classify only observed offline fixture noise in both baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/ui-smoke/verify-sc014.js'); s=p.read_text()
          a='async function info(page) {'
          helper='''// SC-072: WebKit reports the harness-aborted cloud sync as Load failed.
          // Require an observed failed cloud GET; do not suppress other runtime errors.
          function expectedBlockedPlayerSync(text, observed) {
            return observed && /^syncSavedPlayersFromCloud failed \\{message: TypeError: Load failed, details: , hint: , code: \\}$/.test(text);
          }
          '''
          assert s.count(a)==1; s=s.replace(a,helper+a)
          a='  const { browser, page, consoleErrs } = await H.launch({ width: 390, height: 844 });'
          b=a+'''
            let blockedCloudReads = 0;
            const pageErrors = [];
            page.on('requestfailed', r => { if(r.method()==='GET' && /^https:\\/\\/[^/]+\\.supabase\\.co\\//.test(r.url())) blockedCloudReads++; });
            page.on('pageerror', e => pageErrors.push(e.message));'''
          assert s.count(a)==1; s=s.replace(a,b)
          a="    const unexpected = consoleErrs.filter(e => !/supabase|Failed to fetch|fetch failed|net::|NetworkError|load resource|Content Security Policy|connect-src/i.test(e));"
          b="    const unexpected = consoleErrs.filter(e => !/supabase|Failed to fetch|fetch failed|net::|NetworkError|load resource|Content Security Policy|connect-src/i.test(e) && !expectedBlockedPlayerSync(e, blockedCloudReads > 0));"
          assert s.count(a)==1; s=s.replace(a,b)
          a="    check('No unexpected console errors', unexpected.length === 0, unexpected.slice(0, 3).join(' | '));"
          b=a+'''
            check('No uncaught JavaScript errors', pageErrors.length === 0, pageErrors.join(' | '));
            const fixtureMessage='syncSavedPlayersFromCloud failed {message: TypeError: Load failed, details: , hint: , code: }';
            check('Offline noise classifier is scoped', expectedBlockedPlayerSync(fixtureMessage,true) && !expectedBlockedPlayerSync(fixtureMessage,false) && !expectedBlockedPlayerSync('TypeError: Load failed',true) && !expectedBlockedPlayerSync('syncSavedPlayersFromCloud failed {message: ReferenceError: broken}',true));
            console.log('SC072 observed offline cloud GET failures: '+blockedCloudReads);'''
          assert s.count(a)==1; p.write_text(s.replace(a,b))
          PY
          node --check tools/ui-smoke/verify-sc014.js
      - name: Verify original application and capture before images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc072-source.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for browser in chromium webkit; do
            SQ_APP_URL=http://127.0.0.1:8123/index.html SQ_BROWSER="$browser" SQ_SCREENSHOTS="$RUNNER_TEMP/sc072-evidence/before-$browser" timeout 180s node tools/ui-smoke/verify-sc014.js | tee "$RUNNER_TEMP/sc072-evidence/before-$browser.txt"
          done
      - name: Apply bounded semantic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          css=Path('src/styles/setup/match-card-intake.css')
          s=css.read_text()
          old='''#players .ms-players-list{ margin-top:10px; gap:8px; }
          #players .ms2-slot.filled{'''
          new='''#players .ms-players-list{ margin-top:10px; gap:8px; }
          /* SC-072: one card geometry for open and selected line-up places. */
          #players .ms2-slot{ border-radius:var(--sq-radius-card); }
          #players .ms2-slot.filled{'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''#players .ms2-slot.empty{
            min-height:26px; padding:0 12px; border:1px dashed #344254;
            background:rgba(16,24,39,.3); color:#aab4c3; box-shadow:none;
            font-size:9px; letter-spacing:.14em; font-variant-numeric:tabular-nums;
          }'''
          new='''#players .ms2-slot.empty{
            min-height:52px; padding:0 12px; border:1px solid #344254;
            background:#101827; color:#b8c0cc;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
            font-size:11px; font-weight:700; letter-spacing:.12em; font-variant-numeric:tabular-nums;
          }'''
          assert s.count(old)==1
          css.write_text(s.replace(old,new))
          p=Path('tools/ui-smoke/verify-sc014.js'); s=p.read_text()
          anchor='async function info(page) {'
          helper='''// SC-072: exercise all roster densities at the same mobile viewports.
          async function checkLineupCards(page, count) {
            const identity = await page.evaluate(() => JSON.stringify(__msPlayers));
            for (const width of [320, 390, 430]) {
              await page.setViewportSize({width, height:844});
              const v = await page.evaluate(() => {
                const cards = [...document.querySelectorAll('#msPlayersList .ms2-slot')];
                return {
                  cards: cards.map(el => {
                    const s = getComputedStyle(el), r = el.getBoundingClientRect();
                    return {empty:el.classList.contains('empty'), h:r.height, x:r.x, right:r.right,
                      border:s.borderTopStyle, radius:s.borderTopLeftRadius, bg:s.backgroundColor,
                      font:parseFloat(s.fontSize), text:el.textContent.trim()};
                  }),
                  overflow:document.documentElement.scrollWidth > innerWidth,
                  identity:JSON.stringify(__msPlayers),
                  count:document.getElementById('msRosterCount').textContent,
                  remove:[...document.querySelectorAll('#msPlayersList .ms-remove')].map(el => {
                    const r=el.getBoundingClientRect(); return {w:r.width,h:r.height};
                  })
                };
              });
              check(`SC072 ${count}/5 at ${width}: solid contained cards`, v.cards.length===5 &&
                v.cards.every(c=>c.border==='solid' && c.radius==='14px' && c.x>=0 && c.right<=width) && !v.overflow);
              check(`SC072 ${count}/5 at ${width}: readable honest empty places`,
                v.cards.filter(c=>c.empty).length===5-count && v.cards.filter(c=>c.empty).every((c,i)=>
                  c.h>=52 && c.font>=11 && c.bg==='rgb(16, 24, 39)' &&
                  c.text===`${String(count+i+1).padStart(2,'0')}  /  OPEN SLOT`));
              check(`SC072 ${count}/5 at ${width}: selected controls and identity preserved`,
                v.cards.filter(c=>!c.empty).every(c=>c.h>=68) && v.remove.length===count &&
                v.remove.every(r=>r.w>=44 && r.h>=44) && v.identity===identity && v.count===`${count} / 5 selected`);
              await screenshot(page, `sc072-${count}p-${width}`);
            }
            await page.setViewportSize({width:390,height:844});
          }

          '''
          assert s.count(anchor)==1; s=s.replace(anchor,helper+anchor)
          anchors=[("await screenshot(page, 'sc014-empty-mobile');",0),
          ("check('One Classic player cannot start', !(await info(page)).ready);",1),
          ("await screenshot(page, 'sc014-ready-mobile');",2),
          ("check('Five players disable both add controls and explain why', s.players === 5 && s.guestsDisabled && s.savedDisabled && /5/.test(s.hint));",5)]
          for a,n in anchors:
            assert s.count(a)==1,a
            s=s.replace(a,a+f'\n    await checkLineupCards(page, {n});')
          p.write_text(s)
          p=Path('src/legacy/quarantine/core-pre-modals.js'); s=p.read_text()
          a="const RUNNING_VERSION = '0.14.1';"
          assert s.count(a)==1
          p.write_text(s.replace(a,"const RUNNING_VERSION = '0.14.2';"))
          p=Path('assets/release-metadata.json'); s=p.read_text(); original=json.loads(s)
          assert original['currentVersion']=='0.14.1'
          s=s.replace('"currentVersion": "0.14.1"','"currentVersion": "0.14.2"',1).replace('"currentReleaseId": "SC-071-TURBO-TIMER-PERIMETER"','"currentReleaseId": "SC-072-LINEUP-CARDS"',1)
          entry={'version':'0.14.2','releaseId':'SC-072-LINEUP-CARDS','date':'2026-10-07','title':'Clearer player line-up cards','changes':['Replaced thin dashed OPEN SLOT rows with readable dark cards matching the selected-player line-up.','Preserved selection order, player limits, naming, removal and setup navigation.']}
          raw=json.dumps(entry,ensure_ascii=False,indent=2)
          indented='\n'.join('    '+line for line in raw.splitlines())
          a='"releases": [\n'; assert s.count(a)==1
          s=s.replace(a,a+indented+',\n',1)
          assert json.loads(s)['releases'][1:]==original['releases']
          p.write_text(s)
          print('SC072 bounded source patch applied')
          PY
      - name: Materialise and build through existing source authority
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/ui-smoke/verify-sc014.js
          npm run build | tee "$RUNNER_TEMP/sc072-evidence/build.txt"
          npm run verify:dist | tee "$RUNNER_TEMP/sc072-evidence/verify-dist.txt"
      - name: Verify changed setup in both browsers and builds
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc072-source.log 2>&1 &
          p1=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc072-dist.log 2>&1 &
          p2=$!
          trap 'kill "$p1" "$p2" || true' EXIT
          for browser in chromium webkit; do
            for build in source dist; do
              port=8123; if [ "$build" = dist ]; then port=8124; fi
              SQ_APP_URL="http://127.0.0.1:$port/index.html" SQ_BROWSER="$browser" SQ_SCREENSHOTS="$RUNNER_TEMP/sc072-evidence/after-$browser-$build" timeout 180s node tools/ui-smoke/verify-sc014.js | tee "$RUNNER_TEMP/sc072-evidence/after-$browser-$build.txt"
            done
          done
      - name: Verify final patch boundary and retain changed bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, json, pathlib, os, hashlib
          expected=sorted(['src/styles/setup/match-card-intake.css','src/legacy/styles/inline-002.css','tools/ui-smoke/verify-sc014.js','assets/release-metadata.json','src/legacy/quarantine/core-pre-modals.js','src/legacy/scripts/inline-005.js'])
          actual=sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          subprocess.run(['git','diff','--check'],check=True)
          old=subprocess.check_output(['git','show','HEAD:assets/release-metadata.json'],text=True)
          new=pathlib.Path('assets/release-metadata.json').read_text()
          assert json.loads(new)['releases'][1:]==json.loads(old)['releases']
          assert new.endswith(old.split('"releases": [\n',1)[1]),'Predecessor raw release entries changed'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sc072-patch'
          patch=subprocess.check_output(['git','diff','--binary','--']+expected)
          (out/'candidate.patch').write_bytes(patch)
          receipt={'base':'35ffe81b52faad1651cc10cb6a83a0bfcb135ae0','paths':expected,'patch_sha256':hashlib.sha256(patch).hexdigest(),'files':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},'tests':'Baseline36; candidate72; Chromium+WebKit; source+dist; offline backend fixture','production_write':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git diff --stat | tee "$RUNNER_TEMP/sc072-evidence/diff-stat.txt"
      - name: Keep all review evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sc072-lineup-evidence
          path: ${{ runner.temp }}/sc072-evidence/
          retention-days: 14
      - name: Keep only verified patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sc072-verified-patch
          path: ${{ runner.temp }}/sc072-patch/
          retention-days: 14
  prepare-branch:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 35ffe81b52faad1651cc10cb6a83a0bfcb135ae0
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sc072-verified-patch
          path: ${{ runner.temp }}/sc072-patch
      - name: Prepare new unmerged candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          base=35ffe81b52faad1651cc10cb6a83a0bfcb135ae0
          target=fix/sc072-lineup-cards
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test -z "$(git ls-remote origin "refs/heads/$target")"
          python3 - <<'PY'
          import pathlib,json,os,hashlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sc072-patch'
          r=json.loads((out/'receipt.json').read_text())
          data=(out/'candidate.patch').read_bytes()
          assert r['base']=='35ffe81b52faad1651cc10cb6a83a0bfcb135ae0'
          assert hashlib.sha256(data).hexdigest()==r['patch_sha256']
          subprocess.run(['git','apply','--check',str(out/'candidate.patch')],check=True)
          subprocess.run(['git','apply',str(out/'candidate.patch')],check=True)
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==r['paths']
          for p,sha in r['files'].items():
            assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==sha,p
          subprocess.run(['git','add','--']+r['paths'],check=True)
          PY
          git switch -c "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'SC-072: style open line-up places as readable dark cards'
          git push origin "HEAD:refs/heads/$target"
          printf 'SC072_CANDIDATE=%s\n' "$(git rev-parse HEAD)"
          printf 'SC072_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
