name: SC-030 release candidate QA

on:
  push:
    branches: [sc030-dmd-v2-modular]
    paths:
      - index.html
      - src/**
      - tools/ui-smoke/**
      - scripts/verify-vite-dist.mjs
      - docs/SC-030-LIVE-GAME-DMD-V2-MODULAR.md
      - package.json
      - package-lock.json
      - vite.config.mjs
      - .github/workflows/sc030-release-candidate-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc030-release-candidate-qa
  cancel-in-progress: true

jobs:
  verify-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Confirm production ancestry and clean SC-030 delivery surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test ! -e scripts/sc030-add-dmd-transient-channel.mjs
          test ! -e scripts/sc030-adopt-undo-dmd.mjs
          test ! -e scripts/sc030-modernize-actions.mjs
          test ! -e scripts/sc030-staticize-dmd-style.mjs
          test ! -e scripts/sc030-final-convergence.mjs
          test ! -e scripts/sc030-tighten-outer-shell.mjs
          test ! -e .github/workflows/sc030-action-responsiveness.yml
          test ! -e .github/workflows/sc030-dmd-style-ownership.yml
          test ! -e .github/workflows/sc030-dmd-transient-channel.yml
          test ! -e .github/workflows/sc030-dmd-v2-modular.yml
          test ! -e .github/workflows/sc030-undo-adoption.yml
          test ! -e .github/workflows/sc030-reduced-motion-qa.yml
          test ! -e .github/workflows/sc030-final-convergence-writer.yml
          test ! -e .github/workflows/sc030-tighten-outer-shell-writer.yml

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Verify modular source authority and SC-030 unit contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sc030-final-generated
          mkdir -p sc030-final-generated
          node --check src/live-game/dmd/controller.mjs
          node --check src/live-game/dmd/bootstrap.mjs
          node --check src/live-game/dmd/motion.mjs
          node tools/ui-smoke/verify-sc030-dmd-v2.mjs | tee sc030-final-dmd-unit.txt
          node tools/ui-smoke/verify-sc030-reduced-motion.mjs | tee sc030-final-motion-unit.txt
          node scripts/verify-modularization.mjs | tee sc030-final-modular.txt
          node scripts/render-index-from-source.mjs \
            --output sc030-final-generated/index.html \
            --evidence sc030-final-generated/html-build-evidence.json \
            | tee sc030-final-html.txt
          cmp -s sc030-final-generated/index.html index.html
          git diff --check

      - name: Install deterministic Vite dependencies and build dist
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee sc030-final-vite-build.txt
          npm run verify:dist | tee sc030-final-dist-verify.txt

      - name: Install deterministic UI test dependencies
        shell: bash
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Full source-runtime regression
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts-source
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-source-http.log 2>&1 &
          source_pid=$!
          trap 'kill "$source_pid" || true' EXIT
          node tools/ui-smoke/verify-sc030-reduced-motion-runtime.js | tee sc030-final-source-motion.txt
          node tools/ui-smoke/verify-sc030-dmd-runtime.js | tee sc030-final-source-dmd.txt
          node tools/ui-smoke/verify-sc030-final-convergence.js | tee sc030-final-source-convergence.txt
          node tools/ui-smoke/verify-sc030-responsive-runtime.js | tee sc030-final-source-responsive.txt
          node tools/ui-smoke/verify-sc030-actions-runtime.js | tee sc030-final-source-actions.txt
          node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc030-final-source-undo.txt
          node tools/ui-smoke/verify-sc014.js | tee sc030-final-source-setup.txt
          node tools/ui-smoke/smoke.js | tee sc030-final-source-smoke.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc030-final-source-classic.txt
          node tools/ui-smoke/verify-sc030-artwork-isolation.js | tee sc030-final-source-artwork-isolation.txt
          node tools/ui-smoke/verify-training-modes.js | tee sc030-final-source-training.txt
          node tools/ui-smoke/verify-progression-modes.js | tee sc030-final-source-progression.txt
          node tools/ui-smoke/verify-pstats.js | tee sc030-final-source-pstats.txt
          node tools/ui-smoke/verify-p23.js | tee sc030-final-source-admin-close.txt
          node tools/ui-smoke/verify-n5-stacking.js | tee sc030-final-source-admin-stacking.txt

      - name: Full dist-runtime regression
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts-dist
        run: |
          set -euo pipefail
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sq-dist-http.log 2>&1 &
          dist_pid=$!
          trap 'kill "$dist_pid" || true' EXIT
          export SQ_APP_URL=http://127.0.0.1:8124/index.html
          node tools/ui-smoke/verify-sc030-reduced-motion-runtime.js | tee sc030-final-dist-motion.txt
          node tools/ui-smoke/verify-sc030-dmd-runtime.js | tee sc030-final-dist-dmd.txt
          node tools/ui-smoke/verify-sc030-final-convergence.js | tee sc030-final-dist-convergence.txt
          node tools/ui-smoke/verify-sc030-responsive-runtime.js | tee sc030-final-dist-responsive.txt
          node tools/ui-smoke/verify-sc030-actions-runtime.js | tee sc030-final-dist-actions.txt
          node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sc030-final-dist-undo.txt
          node tools/ui-smoke/verify-sc014.js | tee sc030-final-dist-setup.txt
          node tools/ui-smoke/smoke.js | tee sc030-final-dist-smoke.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sc030-final-dist-classic.txt
          node tools/ui-smoke/verify-sc030-artwork-isolation.js | tee sc030-final-dist-artwork-isolation.txt
          node tools/ui-smoke/verify-training-modes.js | tee sc030-final-dist-training.txt
          node tools/ui-smoke/verify-progression-modes.js | tee sc030-final-dist-progression.txt
          node tools/ui-smoke/verify-pstats.js | tee sc030-final-dist-pstats.txt
          node tools/ui-smoke/verify-p23.js | tee sc030-final-dist-admin-close.txt
          node tools/ui-smoke/verify-n5-stacking.js | tee sc030-final-dist-admin-stacking.txt

      - name: Synthetic cloud-failure resilience on source and dist
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-cloud-source-http.log 2>&1 &
          source_pid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sq-cloud-dist-http.log 2>&1 &
          dist_pid=$!
          trap 'kill "$source_pid" "$dist_pid" || true' EXIT
          SQ_APP_URL=http://127.0.0.1:8123/index.html \
            node tools/ui-smoke/verify-cloud-failure-resilience.js \
            | tee sc030-final-cloud-source.txt
          SQ_APP_URL=http://127.0.0.1:8124/index.html \
            node tools/ui-smoke/verify-cloud-failure-resilience.js \
            | tee sc030-final-cloud-dist.txt

      - name: Keep release-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc030-release-candidate-evidence
          retention-days: 14
          path: |
            sc030-final-generated/
            sc030-final-*.txt
            qa-artifacts-source/
            qa-artifacts-dist/
