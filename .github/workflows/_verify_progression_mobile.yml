name: Verify Progression mobile controls

on:
  push:
    branches:
      - fix/progression-mode-isolation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded mobile control correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = '// ==== (3) Progression — per-game bar chart + avg overlay =================='
          end = '// ==== (4) Target Hit % / Target Points % — canonical Supabase-view loaders ====='
          i = text.index(start)
          j = text.index(end, i)
          block = text[i:j]
          replacements = {
              "b.style.minHeight = '40px';": "b.style.minHeight = '44px';",
              "b.style.padding = '8px 11px';": "b.style.padding = '8px 8px';\n    b.style.fontSize = '11px';\n    b.style.letterSpacing = '.04em';",
              "header.style.flexWrap = 'wrap';": "header.style.flexWrap = 'nowrap';\n  const headerLeft = header.firstElementChild;\n  const headerRight = header.lastElementChild;\n  if (headerLeft){ headerLeft.style.minWidth='0'; headerLeft.style.flex='1 1 auto'; }\n  if (headerRight){ headerRight.style.marginLeft='auto'; headerRight.style.flex='0 0 auto'; }"
          }
          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'expected one Progression token, got {block.count(old)}: {old}')
              block = block.replace(old, new, 1)
          p.write_text(text[:i] + block + text[j:], encoding='utf-8')
          PY
          git diff --check -- index.html
      - name: Install UI test dependencies
        working-directory: tools/ui-smoke
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        working-directory: tools/ui-smoke
        run: npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 8123 >/tmp/sq-http.log 2>&1 &
          sleep 2
      - name: Run strengthened Progression verifier
        working-directory: tools/ui-smoke
        run: node verify-progression-modes.js
      - name: Run full UI smoke suite
        working-directory: tools/ui-smoke
        run: node smoke.js
      - name: Commit verified correction and remove temporary workflow
        run: |
          git config user.name "Shateki Coding"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/_verify_progression_mobile.yml
          git commit -m "Fix Progression mobile mode controls [skip ci]"
          git push origin HEAD:fix/progression-mode-isolation
