name: SC-012 target ranking and spider comparison build
on:
  push:
    branches: [feature/sc012-target-rankings-spider-compare]
    paths: [.github/workflows/sc012-build.yml]
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/sc012-target-rankings-spider-compare
      - name: Apply bounded SC-012 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          literal="highlightTableRow('\x00')"
          escaped="highlightTableRow('\\0')"
          print('SC-012 board sentinel forms', {'literal_nul':s.count(literal), 'escaped':s.count(escaped)})
          if s.count(literal)==1 and s.count(escaped)==0:
              p.write_text(s.replace(literal, escaped, 1))
          PY
          python3 tools/sc012_patch.py
      - name: Diff guard before tests
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html | head -n 500
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install UI smoke dependencies
        working-directory: tools/ui-smoke
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tools/ui-smoke
        run: npx playwright install --with-deps chromium
      - name: Prepare legacy screenshot path
        run: |
          sudo mkdir -p /tmp/shateki-ui-shots
          sudo chown -R "$USER":"$USER" /tmp/shateki-ui-shots
      - name: Start local app server
        run: |
          python3 -m http.server 8123 >/tmp/sc012-http.log 2>&1 &
          echo $! > /tmp/sc012-http.pid
          sleep 2
      - name: Player Stats regression
        working-directory: tools/ui-smoke
        run: node verify-pstats.js
      - name: SC-008 regression
        working-directory: tools/ui-smoke
        run: node verify-sc008.js
      - name: SC-009 regression
        working-directory: tools/ui-smoke
        run: node verify-sc009.js
      - name: SC-010 regression
        working-directory: tools/ui-smoke
        run: node verify-sc010.js
      - name: SC-011 Progression regression
        working-directory: tools/ui-smoke
        run: node verify-sc011.js
      - name: SC-012 target ranking / Spider comparison regression
        working-directory: tools/ui-smoke
        run: node verify-sc012.js
      - name: Full mobile smoke
        working-directory: tools/ui-smoke
        run: node smoke.js
      - name: Commit verified bounded patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'SC-012: add target rankings and spider comparison' || exit 0
          git push
