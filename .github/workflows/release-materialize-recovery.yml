name: Release materialize recovery
on:
  push:
    branches: [fix/release-metadata-gate-20260924]
    paths:
      - .github/workflows/release-materialize-recovery.yml
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/release-metadata-gate-20260924
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci --prefix scripts --ignore-scripts
      - run: npm run materialize
      - name: Commit exact generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html src/legacy/scripts/inline-005.js src/legacy/styles/inline-002.css; then
            echo "Generated outputs already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/legacy/scripts/inline-005.js src/legacy/styles/inline-002.css
          git commit -m "Materialize exact generated release outputs"
          git push origin HEAD:fix/release-metadata-gate-20260924
