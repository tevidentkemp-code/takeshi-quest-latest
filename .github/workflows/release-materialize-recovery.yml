name: Release materialize recovery
# rerun after legacy patch evidence repair
on:
  push:
    branches: [fix/release-metadata-gate-20260924]
    paths:
      - .github/workflows/release-materialize-recovery.yml
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/release-metadata-gate-20260924
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci --prefix scripts --ignore-scripts
      - name: Generate compatibility outputs from authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-index-from-source.mjs --output .release-index.html
          cp .release-index.html index.html
          node scripts/build-core-styles-from-source.mjs --output .release-core.css
          cp .release-core.css src/legacy/styles/inline-002.css
          node scripts/build-core-js-from-source.mjs --output .release-core.js
          cp .release-core.js src/legacy/scripts/inline-005.js
      - name: Capture architecture diagnostic
        shell: bash
        run: |
          node scripts/verify-modularization.mjs > release-architecture-diagnostic.txt 2>&1 || true
          node scripts/build-core-js-from-source.mjs --verify-current >> release-architecture-diagnostic.txt 2>&1 || true
          sha256sum src/legacy/scripts/inline-030.js >> release-architecture-diagnostic.txt
          wc -c src/legacy/scripts/inline-030.js >> release-architecture-diagnostic.txt
      - name: Commit exact generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/legacy/scripts/inline-005.js src/legacy/styles/inline-002.css release-architecture-diagnostic.txt
          git commit -m "Materialize exact generated release outputs"
          git push origin HEAD:fix/release-metadata-gate-20260924
