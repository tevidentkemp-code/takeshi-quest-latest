name: SC-023 final semantic refinement
on:
  push:
    branches: [sc023-turbo-live-recovery]
permissions:
  contents: write
jobs:
  refine:
    if: github.event.head_commit.message == 'SC-023: run final semantic refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc023-turbo-live-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded SC-023 semantic refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          text = index_path.read_text()

          old_flags = """    // Current throw-by-throw race presentation is shared by competitive Classic and Turbo.\n    // Practice and Vs Shadow remain deliberately isolated from this path.\n    const __classicThrowRace = live.length >= 2 && !__practiceRace && !__shadowRace;"""
          new_flags = """    // Keep the SC-021 Classic routing contract intact. Turbo gets the same modern\n    // per-throw presentation through its own mode-isolated packet flag.\n    const __classicThrowRace = live.length >= 2 && !__turboRace && !__practiceRace && !__shadowRace;\n    const __turboThrowRace = live.length >= 2 && __turboRace && !__practiceRace && !__shadowRace;"""
          if text.count(old_flags) != 1:
              raise SystemExit(f'expected one SC-023 race flag block, found {text.count(old_flags)}')
          text = text.replace(old_flags, new_flags, 1)

          old_slice = "      live = live.map(s => ({ ...s, data: Array.isArray(s.data) ? s.data.slice(__turboStartIdx) : [] }));"
          new_slice = """      live = live.map((s, pIdx) => {\n        // Turbo starts at its configured round. Rebuild the per-dart cumulative\n        // path from that point so resumed games can never inherit pre-Turbo X/Y data.\n        let run = 0;\n        const throwData = [0];\n        for (let r = __turboStartIdx; r < roundsCount(); r++){\n          const darts = Array.isArray(state.score?.[pIdx]?.[r]?.darts)\n            ? state.score[pIdx][r].darts.filter(v => v != null)\n            : [];\n          for (const dart of darts){\n            const pts = (typeof __sqV2DartPoints === 'function')\n              ? __sqV2DartPoints(dart)\n              : Number(dart && (dart.points ?? dart.score ?? dart.value ?? dart.total)) || 0;\n            run += Number.isFinite(Number(pts)) ? Number(pts) : 0;\n            throwData.push(run);\n          }\n        }\n        return { ...s, data: Array.isArray(s.data) ? s.data.slice(__turboStartIdx) : [], throwData };\n      });"""
          if text.count(old_slice) != 1:
              raise SystemExit(f'expected one Turbo race slice, found {text.count(old_slice)}')
          text = text.replace(old_slice, new_slice, 1)

          old_packet1 = "drawRace(canvas, {series:live, record:null, records:null, labels, offset, classicThrowRace:__classicThrowRace});"
          new_packet1 = "drawRace(canvas, {series:live, record:null, records:null, labels, offset, classicThrowRace:__classicThrowRace, turboThrowRace:__turboThrowRace});"
          if text.count(old_packet1) != 1:
              raise SystemExit(f'expected one initial race packet, found {text.count(old_packet1)}')
          text = text.replace(old_packet1, new_packet1, 1)
          old_packet2 = "drawRace(canvas, {series:live, record:rec, records, labels, offset, classicThrowRace:__classicThrowRace});"
          new_packet2 = "drawRace(canvas, {series:live, record:rec, records, labels, offset, classicThrowRace:__classicThrowRace, turboThrowRace:__turboThrowRace});"
          if text.count(old_packet2) != 1:
              raise SystemExit(f'expected one final race packet, found {text.count(old_packet2)}')
          text = text.replace(old_packet2, new_packet2, 1)

          fn_start = text.index('function __sqDrawArcadeRace(canvas, packet, st, now){')
          fn_end = text.index('\n\n// Fetch each player\'s level once', fn_start)
          chunk = text[fn_start:fn_end]
          decl = "    const classicThrowRace = !!(packet && packet.classicThrowRace);"
          if chunk.count(decl) != 1:
              raise SystemExit(f'expected one renderer classic flag, found {chunk.count(decl)}')
          injected = decl + "\n    const turboThrowRace = !!(packet && packet.turboThrowRace);\n    const perThrowRace = classicThrowRace || turboThrowRace;"
          chunk = chunk.replace(decl, injected, 1)
          marker = "    const perThrowRace = classicThrowRace || turboThrowRace;\n"
          split = chunk.index(marker) + len(marker)
          chunk = chunk[:split] + chunk[split:].replace('classicThrowRace', 'perThrowRace')
          text = text[:fn_start] + chunk + text[fn_end:]

          hs_start = text.index("      // The direct Turbo ranking view can exceed the client-role statement timeout.")
          hs_end_marker = "      if (!top || !top.game_id) return null;"
          hs_end = text.index(hs_end_marker, hs_start) + len(hs_end_marker)
          new_hs = """      // The live Turbo leaderboard sources were verified against the current Supabase schema.\n      // v_top50_scores_turbo_clean is mode-isolated and already ordered as the all-time\n      // Turbo score table; it identifies the same record as the heavier Turbo league view.\n      const hs = await client.from('v_top50_scores_turbo_clean')\n        .select('player_name,score,ts,game_id')\n        .order('score', { ascending:false })\n        .order('ts', { ascending:false })\n        .limit(1);\n      if (hs && hs.error) throw hs.error;\n      const topRow = Array.isArray(hs && hs.data) ? hs.data[0] : null;\n      const top = topRow ? {\n        player:String(topRow.player_name || '').trim(),\n        best_score:Number(topRow.score || 0),\n        best_ts:topRow.ts || '',\n        game_id:topRow.game_id || ''\n      } : null;\n      if (!top || !top.player || !top.game_id || !Number.isFinite(top.best_score) || top.best_score <= 0) return null;"""
          text = text[:hs_start] + new_hs + text[hs_end:]

          # Guard the already-confirmed strict-turn timer fix: one clock per 3-dart visit,
          # and a timeout fills only the remaining darts.
          required = [
              "return [state.currentRound,state.currentPlayer].map(v=>String(v ?? '')).join('|');",
              "const remaining = Math.max(0, 3 - Math.max(0, Math.min(3, Number(state?.currentDart || 0))));",
              "for (let i=0; i<remaining; i++){"
          ]
          for token in required:
              if token not in text:
                  raise SystemExit('missing confirmed Turbo timer guard: ' + token)
          if "if (Number(state?.currentDart || 0) !== 0){\n      timer = null; clearBoxes(); return;\n    }" in text:
              raise SystemExit('per-dart Turbo timer reset unexpectedly present')

          index_path.write_text(text)

          test_path = Path('tools/ui-smoke/verify-classic-visual-fit.js')
          test = test_path.read_text()
          cap_old = "          shadowRuntime: (typeof __sqIsVsShadowRuntime === 'function') ? __sqIsVsShadowRuntime() : false,\n          labels:"
          cap_new = "          shadowRuntime: (typeof __sqIsVsShadowRuntime === 'function') ? __sqIsVsShadowRuntime() : false,\n          turboThrowRace: packet.turboThrowRace === true,\n          labels:"
          if test.count(cap_old) != 1:
              raise SystemExit(f'expected one packet capture insertion point, found {test.count(cap_old)}')
          test = test.replace(cap_old, cap_new, 1)

          fixture_start = test.index("      const latest = [{game_id:'turbo-record-game'")
          fixture_end = test.index("      const pace =", fixture_start)
          top_fixture = "      const top50 = [{player_name:'RECORD ACE',score:359,ts:'2026-09-10T19:59:03.349Z',game_id:'turbo-record-game'}];\n"
          test = test[:fixture_start] + top_fixture + test[fixture_end:]
          old_rows = "      const rowsFor = table => table === 'v_latest_scores_turbo_clean' ? latest : (table === 'mv_player_round_scores_mode_clean_app' || table === 'v_player_round_scores_mode_clean') ? pace : [];"
          new_rows = "      const rowsFor = table => table === 'v_top50_scores_turbo_clean' ? top50 : (table === 'mv_player_round_scores_mode_clean_app' || table === 'v_player_round_scores_mode_clean') ? pace : [];"
          if test.count(old_rows) != 1:
              raise SystemExit(f'expected one SC-023 source fixture row, found {test.count(old_rows)}')
          test = test.replace(old_rows, new_rows, 1)

          opening_old = "    const openingPacket=await waitForRacePacket(page,true,{matchMode:'turbo'});"
          opening_new = "    const openingPacket=await waitForRacePacket(page,false,{matchMode:'turbo',turboThrowRace:true});\n    assert.equal(openingPacket.classicThrowRace,false,'Turbo does not reuse the SC-021 Classic routing flag');\n    assert.equal(openingPacket.turboThrowRace,true,'Turbo uses its own modern per-throw race flag');"
          if test.count(opening_old) != 1:
              raise SystemExit(f'expected one Turbo opening packet assertion, found {test.count(opening_old)}')
          test = test.replace(opening_old, opening_new, 1)

          test = test.replace("p.matchMode==='turbo'&&p.classicThrowRace", "p.matchMode==='turbo'&&!p.classicThrowRace&&p.turboThrowRace")

          audit_old = "    assert(sourceAudit.includes('v_latest_scores_turbo_clean'),'Turbo race record uses the clean materialized Turbo score feed');\n    assert(!sourceAudit.includes('v_high_score_league_turbo_from_games_clean'),'Turbo race avoids the timed-out direct ranking view');"
          audit_new = "    assert(sourceAudit.includes('v_top50_scores_turbo_clean'),'Turbo race record uses the verified mode-isolated Turbo top-score source');\n    assert(!sourceAudit.includes('v_high_score_league_official_from_games_clean'),'Turbo race never queries the Official high-score source');\n    assert(!sourceAudit.includes('v_high_score_league_official_clean'),'Turbo race never queries any Official league source');"
          if test.count(audit_old) != 1:
              raise SystemExit(f'expected one Turbo source audit block, found {test.count(audit_old)}')
          test = test.replace(audit_old, audit_new, 1)

          route_old = "  await verifyNewRaceRoute('turbo', true);"
          route_new = "  await verifyNewRaceRoute('turbo', false);"
          if test.count(route_old) != 1:
              raise SystemExit(f'expected one Turbo route expectation, found {test.count(route_old)}')
          test = test.replace(route_old, route_new, 1)

          test_path.write_text(test)
          PY
          git diff --check
          git diff --stat
      - name: Install existing UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run full offline regression suite
        shell: bash
        env:
          SQ_SCREENSHOTS: ${{ github.workspace }}/qa-artifacts
        run: |
          set -o pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          node tools/ui-smoke/verify-sc014.js | tee /tmp/sc023-setup.txt
          node tools/ui-smoke/smoke.js | tee /tmp/sc023-smoke.txt
          node tools/ui-smoke/verify-saveplayer-card.js | tee /tmp/sc023-saved.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee /tmp/sc023-visual.txt
      - name: Commit only final SC-023 product and regression files
        shell: bash
        run: |
          rm -f sc023-results.txt .github/workflows/sc023-final-refine.yml
          git diff --check
          git status --short
          git add -A
          git config user.name 'tevidentkemp-code'
          git config user.email 'tevidentkemp@gmail.com'
          git commit -m 'SC-023: finalize Turbo live timer and race recovery'
          git push origin HEAD:sc023-turbo-live-recovery
