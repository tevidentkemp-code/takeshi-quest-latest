name: SC-034 Turbo hardening writer
on:
  push:
    branches: [batch-sc034-sc036]
    paths:
      - scripts/sc034-turbo-hardening.mjs
      - .github/workflows/sc034-turbo-hardening.yml
permissions:
  contents: write
concurrency:
  group: sc034-turbo-hardening
  cancel-in-progress: false
jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci --prefix scripts --ignore-scripts
      - name: Apply Turbo hardening
        run: node scripts/sc034-turbo-hardening.mjs
      - name: Verify authority and build
        run: |
          node scripts/verify-modularization.mjs
          node scripts/build-core-js-from-source.mjs --verify-current
          node --check src/legacy/scripts/inline-030.js
          node --check tools/ui-smoke/verify-sc034-add-player.js
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist
      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run combined SC-034 + SC-033 acceptance
        env:
          SQ_APP_URL: http://127.0.0.1:8123/index.html
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc034-turbo.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          timeout 180s node tools/ui-smoke/verify-sc034-add-player.js
          timeout 180s node tools/ui-smoke/verify-sc033-throw-order.js
          timeout 180s node tools/ui-smoke/smoke.js
          timeout 180s node tools/ui-smoke/verify-sc014.js
      - name: Remove temporary writer
        run: |
          rm scripts/sc034-turbo-hardening.mjs
          rm .github/workflows/sc034-turbo-hardening.yml
          git diff --check
      - name: Commit verified Turbo hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SC-034: isolate Turbo late-entry catch-up'
          git push origin HEAD:batch-sc034-sc036
