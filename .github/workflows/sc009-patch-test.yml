name: SC009 patch and regression
on:
  push:
    branches:
      - fix/sc009-achievement-ui-parity

permissions:
  contents: write

jobs:
  patch-test:
    if: ${{ !contains(github.event.head_commit.message, '[sc009-patch-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded client patch
        run: python tools/sc009_patch.py
      - name: Syntax-check achievement application script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          hits=[x for x in scripts if 'const SQ_ACH =' in x and 'openPlayerStatsDialog' in x]
          if len(hits)!=1: raise SystemExit(f'expected one app script, got {len(hits)}')
          Path('/tmp/sc009-app.js').write_text(hits[0],encoding='utf-8')
          PY
          node --check /tmp/sc009-app.js
      - name: Install UI smoke dependencies
        working-directory: tools/ui-smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Player Stats regression
        working-directory: tools/ui-smoke
        run: node verify-pstats.js
      - name: SC-009 regression
        working-directory: tools/ui-smoke
        run: node verify-sc009.js
      - name: Commit patched index
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "[sc009-patch-output] achievement UI parity"
          git push
