name: SC-029 source inspection
on:
  push:
    branches:
      - sc029-player-stats-hub-polish
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact Power Rank implementation
        shell: bash
        run: |
          set -e
          grep -n "from('v_power_rankings_last56_official_clean')" index.html || true
          grep -n 'from("v_power_rankings_last56_official_clean")' index.html || true
          grep -n "const savedPlayersRows" index.html || true
          grep -n "let dbPower" index.html || true
          L=$(grep -n "let dbPower" index.html | tail -1 | cut -d: -f1)
          S=$((L-80)); E=$((L+190)); sed -n "${S},${E}p" index.html
