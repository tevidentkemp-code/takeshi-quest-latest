name: SC-029 live read diagnosis
on:
  push:
    branches:
      - sc029-player-stats-hub-polish
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        working-directory: tools/ui-smoke
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Read-only production diagnosis
        shell: bash
        run: |
          node - <<'JS'
          const { chromium } = require('./tools/ui-smoke/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch();
            const ctx = await browser.newContext({ viewport:{width:390,height:844}, isMobile:true, hasTouch:true, deviceScaleFactor:2 });
            await ctx.route('**/*', async route => {
              const req = route.request();
              if (req.url().includes('supabase.co') && !['GET','HEAD','OPTIONS'].includes(req.method())) {
                console.log('BLOCKED_WRITE', req.method(), req.url());
                return route.abort('blockedbyclient');
              }
              return route.continue();
            });
            const page = await ctx.newPage();
            page.on('console', m => console.log('CONSOLE', m.type(), m.text()));
            page.on('pageerror', e => console.log('PAGEERROR', String(e)));
            page.on('response', async r => {
              if (r.url().includes('v_power_rankings_last56_official_clean')) {
                let body=''; try{ body=(await r.text()).slice(0,5000); }catch(_){}
                console.log('POWER_RESPONSE', r.status(), r.url(), body);
              }
            });
            await page.goto('https://tevidentkemp-code.github.io/takeshi-quest-latest/', {waitUntil:'domcontentloaded', timeout:30000});
            await page.waitForTimeout(5000);
            const info = await page.evaluate(async () => {
              const result = {hasOpen:typeof window.openPlayerStatsHub==='function'};
              if (!result.hasOpen) return result;
              window.SQ_DEBUG = true;
              window.openPlayerStatsHub('Thom');
              return result;
            });
            console.log('OPEN_INFO', JSON.stringify(info));
            await page.waitForSelector('.sq-player-stats-hub .pp-hero', {timeout:20000});
            await page.waitForTimeout(3500);
            const snap = await page.locator('.sq-player-stats-hub').evaluate(el => ({
              text:el.innerText,
              tiles:[...el.querySelectorAll('.pp-tile')].map(t=>({label:t.querySelector('.pp-tile-label')?.textContent,value:t.querySelector('.pp-tile-value')?.textContent})),
              name:el.querySelector('.pp-hero-name')?.textContent,
              nick:el.querySelector('.pp-hero-nick')?.textContent,
            }));
            console.log('HUB_SNAPSHOT', JSON.stringify(snap));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
