name: SC009 exact source extract
on:
  push:
    branches:
      - fix/sc009-achievement-ui-parity

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[sc009-extract-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and persist targeted UI source
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('index.html')
          data = p.read_text(encoding='utf-8')
          out = Path('.sc009')
          out.mkdir(exist_ok=True)
          meta = [f'INDEX_BYTES={len(data.encode("utf-8"))}', f'INDEX_SHA1={hashlib.sha1(data.encode("utf-8")).hexdigest()}']
          needles = {
              'catalog_refs': 'SQ_ACH.CATALOG',
              'trophy': '__sqTrophyCase',
              'misfire': 'pp-misfires',
              'pstats': 'openPlayerStatsDialog',
              'misfire_module': 'SQ_MISFIRE',
              'avg10_hyphen': '10-game',
              'avg10_space': '10 game',
              'last10_upper': 'Last 10',
              'last10_lower': 'last 10',
              'avg10_var': 'avg10',
              'last10_var': 'last10',
          }
          for key, needle in needles.items():
              positions=[]; start=0
              while True:
                  i=data.find(needle,start)
                  if i<0: break
                  positions.append(i); start=i+len(needle)
              meta.append(f'{key}:{needle}:{positions}')
              parts=[]
              for n,i in enumerate(positions[:12],1):
                  lo=max(0,i-7000); hi=min(len(data),i+9000)
                  parts.append(f'=== {key} occurrence {n} chars {lo}:{hi} ===\n{data[lo:hi]}\n=== END ===\n')
              (out/f'{key}.txt').write_text('\n'.join(parts),encoding='utf-8')
          terms = ['Photo Finish','Runaway','Last Gasp','Special Forces','Steady Eddie','Century Streak','PB Smasher','Reverse Sweep','Clean Sweep','Untouchable','Treble Trouble','Triple Threat','Double Down','Double Trouble','Sharpshooter','flawless_game','treble_trouble','triple_threat','double_down','double_trouble']
          pieces=[]
          for term in terms:
              positions=[]; start=0
              while True:
                  i=data.find(term,start)
                  if i<0: break
                  positions.append(i); start=i+len(term)
              meta.append(f'term:{term}:{positions}')
              for n,i in enumerate(positions[:4],1):
                  lo=max(0,i-1800); hi=min(len(data),i+2200)
                  pieces.append(f'=== {term} {n} chars {lo}:{hi} ===\n{data[lo:hi]}\n=== END ===\n')
          (out/'catalog_terms.txt').write_text('\n'.join(pieces),encoding='utf-8')
          # Exact reusable UI blocks, bounded by stable comments/markers.
          for fname,start_marker,end_marker in [
              ('trophy_block.txt','function __sqTrophyCase(earnedMap){','// === Player Stats — redesigned overview'),
              ('misfire_panel_block.txt',"const mfCard = document.createElement('div');",'achPanel.appendChild(mfCard);'),
              ('trophy_detail_block.txt','async function __sqTrophyDetail(code, earnedMap){','// Per-game trophy detector'),
          ]:
              s=data.find(start_marker)
              e=data.find(end_marker,s+1) if s>=0 else -1
              if s>=0 and e>=0:
                  (out/fname).write_text(data[s:e+len(end_marker)],encoding='utf-8')
                  meta.append(f'block:{fname}:{s}:{e+len(end_marker)}')
          (out/'meta.txt').write_text('\n'.join(meta)+'\n',encoding='utf-8')
      - name: Commit temporary extracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .sc009
          git diff --cached --quiet && exit 0
          git commit -m "[sc009-extract-output] refresh exact source slices"
          git push
