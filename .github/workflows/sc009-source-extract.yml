name: SC009 exact source extract
on:
  push:
    branches:
      - fix/sc009-achievement-ui-parity

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[sc009-extract-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and persist targeted UI source
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('index.html')
          data = p.read_text(encoding='utf-8')
          out = Path('.sc009')
          out.mkdir(exist_ok=True)
          meta = [f'INDEX_BYTES={len(data.encode("utf-8"))}', f'INDEX_SHA1={hashlib.sha1(data.encode("utf-8")).hexdigest()}']
          needles = {
              'catalog': 'SQ_ACH.CATALOG',
              'trophy': '__sqTrophyCase',
              'misfire': 'pp-misfires',
              'misfire_row': 'pp-misfire-row',
              'pstats': 'openPlayerStatsDialog',
              'misfire_module': 'SQ_MISFIRE',
          }
          for key, needle in needles.items():
              positions=[]; start=0
              while True:
                  i=data.find(needle,start)
                  if i<0: break
                  positions.append(i); start=i+len(needle)
              meta.append(f'{key}:{needle}:{positions}')
              parts=[]
              for n,i in enumerate(positions[:6],1):
                  lo=max(0,i-14000); hi=min(len(data),i+18000)
                  parts.append(f'=== {key} occurrence {n} chars {lo}:{hi} ===\n{data[lo:hi]}\n=== END ===\n')
              (out/f'{key}.txt').write_text('\n'.join(parts),encoding='utf-8')
          (out/'meta.txt').write_text('\n'.join(meta)+'\n',encoding='utf-8')
      - name: Commit temporary extracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .sc009
          git diff --cached --quiet && exit 0
          git commit -m "[sc009-extract-output] temporary exact source slices"
          git push
