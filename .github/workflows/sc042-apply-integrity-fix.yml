name: SC-042 one-shot integrity patch
on:
  push:
    branches: [sc042-record-integrity-fix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sc042-record-integrity-fix
          fetch-depth: 2
      - name: Apply fail-closed bounded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {n}')
              p.write_text(s.replace(old,new,1))
              print(f'patched {label}: {path}')

          core='src/legacy/quarantine/core-pre-modals.js'
          old_game="""              const priorGameBest = Number(bestGameByPlayer.get(nameKey) || 0);
              if (score > 0 && score > priorGameBest) {
                pushEvent(ts, `GAME PB - ${nm} (${score})`, 'game_pb');
                bestGameByPlayer.set(nameKey, score);
              }
              if (score > 0 && score > globalGameBest) {
                pushEvent(ts, `NEW GAME RECORD SCORE - ${nm} - ${score} 🥇`, 'game_record');
                globalGameBest = score;
              }
"""
          new_game="""              const priorGameBest = Number(bestGameByPlayer.get(nameKey) || 0);
              const isGamePB = score > 0 && score > priorGameBest;
              const isGameRecord = score > 0 && score > globalGameBest;
              // A record is also a PB, but only print the higher-priority record event.
              if (isGameRecord) pushEvent(ts, `NEW GAME RECORD SCORE - ${nm} - ${score} 🥇`, 'game_record');
              else if (isGamePB) pushEvent(ts, `GAME PB - ${nm} (${score})`, 'game_pb');
              if (isGamePB) bestGameByPlayer.set(nameKey, score);
              if (isGameRecord) globalGameBest = score;
"""
          replace_once(core, old_game, new_game, 'game PB/record precedence')

          old_round="""                const priorRoundPB = Number(bestRoundByPlayer.get(playerRoundKey) || 0);
                const priorRoundWR = Number(bestRoundGlobal.get(roundKey) || 0);
                if (total > priorRoundPB) {
                  pushEvent(ts, `ROUND PB / ${roundKey} - ${nm} (${total}) - ${counts}`, 'round_pb');
                  bestRoundByPlayer.set(playerRoundKey, total);
                }
                if (total > priorRoundWR) {
                  pushEvent(ts, `ROUND WR / ${roundKey} - ${nm} (${total}) - ${counts}`, 'round_wr');
                  bestRoundGlobal.set(roundKey, total);
                }
"""
          new_round="""                const priorRoundPB = Number(bestRoundByPlayer.get(playerRoundKey) || 0);
                const priorRoundWR = Number(bestRoundGlobal.get(roundKey) || 0);
                const isRoundPB = total > priorRoundPB;
                const isRoundRecord = total > priorRoundWR;
                // A round record is also a PB, but only print the higher-priority record event.
                if (isRoundRecord) pushEvent(ts, `ROUND WR / ${roundKey} - ${nm} (${total}) - ${counts}`, 'round_wr');
                else if (isRoundPB) pushEvent(ts, `ROUND PB / ${roundKey} - ${nm} (${total}) - ${counts}`, 'round_pb');
                if (isRoundPB) bestRoundByPlayer.set(playerRoundKey, total);
                if (isRoundRecord) bestRoundGlobal.set(roundKey, total);
"""
          replace_once(core, old_round, new_round, 'round PB/record precedence')

          rhs='src/legacy/scripts/inline-026.js'
          holder_helpers="""  function cleanRoundRecordHolderToken(v){
    return String(v==null?'':v).trim().replace(/\\s+x\\d+\\s*$/i,'').trim();
  }
  function cleanRoundRecordHolders(v){
    var raw=Array.isArray(v)?v:(typeof v==='string'?v.split('/'):[]);
    var seen=new Set(), out=[];
    raw.forEach(function(h){
      var clean=cleanRoundRecordHolderToken(h);
      var key=norm(clean);
      if(clean && key && !seen.has(key)){seen.add(key);out.push(clean);}
    });
    return out;
  }
"""
          replace_once(rhs, "  async function fetchOfficialRoundHighScoresClean(){\n", holder_helpers+"  async function fetchOfficialRoundHighScoresClean(){\n", 'round holder helpers')
          old_holders="""      var holders=r&&r.holders;
      if(typeof holders==='string') holders=holders.split('/').map(function(h){return h.trim();}).filter(Boolean);
      if(!Array.isArray(holders)) holders=[];
      var holder=String(r&&r.holder||'').trim();
      if(holder && holders.indexOf(holder)<0) holders.unshift(holder);
"""
          new_holders="""      var holders=cleanRoundRecordHolders(r&&r.holders);
      var holderParts=cleanRoundRecordHolders(r&&r.holder);
      holderParts.slice().reverse().forEach(function(h){
        if(!holders.some(function(x){return norm(x)===norm(h);})){holders.unshift(h);}
      });
      var holder=holders.join(' / ');
"""
          replace_once(rhs, old_holders, new_holders, 'round holder display cleanup')

          modals='src/ui/modals.js'
          old_dir="""      const rows = data.map(r => ({
        player_id: r.player_id,
        name: String(r.name || '').trim(),
        games_played: Math.max(0, Number(r.games_played) || 0)
      })).filter(r => r.player_id);
"""
          new_dir="""      const rows = data.map(r => ({
        player_id: r.player_id,
        name: String(r.name || '').trim(),
        games_played: Math.max(0, Number(r.games_played) || 0)
      })).filter(r => r.player_id && r.games_played > 0);
"""
          replace_once(modals, old_dir, new_dir, 'achievement directory zero-game filter')

          milestone_helpers="""SQ_ACH.scoreMilestoneThreshold = function(code){
  const m = String(code || '').match(/^score_(100|200|300|400|500|600|700)$/);
  return m ? Number(m[1]) : 0;
};
SQ_ACH.forScoreMilestone = async function(code){
  const threshold = this.scoreMilestoneThreshold(code);
  if (!threshold) return [];
  const SB = window.sb || window.__sb || null;
  if (!SB || typeof SB.from !== 'function') return [];
  try{
    const directory = await this.playerDirectory();
    const byId = new Map((directory || []).map(p => [String(p.player_id || ''), p]));
    const byName = new Map((directory || []).map(p => [String(p.name || '').trim().toLowerCase(), p]));
    const counts = new Map();
    const pageSize = 1000;
    for (let from = 0; ; from += pageSize){
      const to = from + pageSize - 1;
      const { data, error } = await SB.from('v_player_game_scores_official_clean')
        .select('game_id,ts,player_id,player_id_alt,player_name,score')
        .gte('score', threshold)
        .order('ts', { ascending:true })
        .range(from, to);
      if (error) return [];
      const rows = Array.isArray(data) ? data : [];
      rows.forEach(r => {
        const ids = [r && r.player_id, r && r.player_id_alt].map(v => String(v || '').trim()).filter(Boolean);
        let p = null;
        for (const id of ids){ if (byId.has(id)){ p = byId.get(id); break; } }
        if (!p) p = byName.get(String((r && r.player_name) || '').trim().toLowerCase()) || null;
        if (!p) return;
        const key = String(p.player_id);
        counts.set(key, (counts.get(key) || 0) + 1);
      });
      if (rows.length < pageSize) break;
    }
    return (directory || []).map(p => ({
      player_id:p.player_id,
      name:p.name || '—',
      cnt:counts.get(String(p.player_id)) || 0,
      games_played:Math.max(0, Number(p.games_played) || 0)
    })).filter(r => r.cnt > 0)
      .sort((a,b) => (b.cnt-a.cnt) || String(a.name||'').localeCompare(String(b.name||'')) || String(a.player_id||'').localeCompare(String(b.player_id||'')));
  }catch(_){ return []; }
};

"""
          anchor='// Trophy detail popup: how to earn it + a leaderboard of everyone who has it.\n'
          replace_once(modals, anchor, milestone_helpers+anchor, 'score milestone occurrence source')
          old_source="  const rows = milestone ? await SQ_ACH.forMilestones() : await SQ_ACH.forCode(code);\n"
          new_source="""  const scoreThreshold = SQ_ACH.scoreMilestoneThreshold(code);
  const rows = scoreThreshold
    ? await SQ_ACH.forScoreMilestone(code)
    : (milestone ? await SQ_ACH.forMilestones() : await SQ_ACH.forCode(code));
"""
          replace_once(modals, old_source, new_source, 'score milestone detail routing')
          old_value="""      val.title = mode === 'average'
        ? ((Number(r.cnt)||0) + ' occurrence(s) over ' + (Number(r.games_played)||0) + ' eligible games' + (eligible ? '' : ' · Not ranked until 6 eligible games'))
        : (milestone ? 'Milestones achieved' : '');
"""
          new_value="""      val.title = mode === 'average'
        ? ((Number(r.cnt)||0) + ' occurrence(s) over ' + (Number(r.games_played)||0) + ' eligible games' + (eligible ? '' : ' · Not ranked until 6 eligible games'))
        : (scoreThreshold ? (scoreThreshold + '+ game scores') : (milestone ? 'Milestones achieved' : ''));
"""
          replace_once(modals, old_value, new_value, 'score milestone value description')
          PY
          node --check src/legacy/quarantine/core-pre-modals.js
          node --check src/legacy/scripts/inline-026.js
          node --check src/ui/modals.js
          git diff --check
      - name: Commit bounded patch and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/sc042-apply-integrity-fix.yml
          git config user.name "shateki-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy/quarantine/core-pre-modals.js src/legacy/scripts/inline-026.js src/ui/modals.js
          git commit -m "fix(sc042): repair record and milestone integrity"
          git push origin HEAD:sc042-record-integrity-fix
