name: SC-031 cloud failure resilience

on:
  pull_request:
    paths:
      - src/**
      - scripts/**
      - package.json
      - package-lock.json
      - vite.config.mjs
      - tools/ui-smoke/verify-cloud-failure-resilience.js
      - .github/workflows/sc031-cloud-failure-qa.yml
  push:
    branches: [sc031-modular-architecture-migration]
    paths:
      - src/**
      - scripts/**
      - package.json
      - package-lock.json
      - vite.config.mjs
      - tools/ui-smoke/verify-cloud-failure-resilience.js
      - .github/workflows/sc031-cloud-failure-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc031-cloud-failure-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cloud-failure-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Materialize source-authority runtime
        run: node scripts/materialize-runtime.mjs

      - name: Install deterministic Vite dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build dist candidate
        run: npm run build

      - name: Verify dist structure
        run: npm run verify:dist

      - name: Install deterministic UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Test synthetic Supabase failures against source runtime and dist
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-source-http.log 2>&1 &
          source_pid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sq-dist-http.log 2>&1 &
          dist_pid=$!
          trap 'kill "$source_pid" "$dist_pid" || true' EXIT

          SQ_APP_URL=http://127.0.0.1:8123/index.html \
            node tools/ui-smoke/verify-cloud-failure-resilience.js \
            | tee sc031-cloud-failure-source-results.txt

          SQ_APP_URL=http://127.0.0.1:8124/index.html \
            node tools/ui-smoke/verify-cloud-failure-resilience.js \
            | tee sc031-cloud-failure-dist-results.txt

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD -- tools/ui-smoke/verify-cloud-failure-resilience.js .github/workflows/sc031-cloud-failure-qa.yml docs

      - name: Keep failure-resilience evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc031-cloud-failure-resilience-evidence
          retention-days: 14
          path: |
            sc031-cloud-failure-source-results.txt
            sc031-cloud-failure-dist-results.txt
            sc031-vite-build-evidence.json
