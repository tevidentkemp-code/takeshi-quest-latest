name: SXP-04 Gate 5 iPhone acceptance candidate

on:
  push:
    branches: [sxp-04-gate5-iphone-acceptance]
    paths:
      - package.json
      - package-lock.json
      - vite.config.mjs
      - scripts/**
      - src/**
      - assets/release-metadata.json
      - tools/ui-smoke/**
      - .github/workflows/sxp04-gate5-iphone.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - vite.config.mjs
      - scripts/**
      - src/**
      - assets/release-metadata.json
      - tools/ui-smoke/**
      - .github/workflows/sxp04-gate5-iphone.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sxp04-gate5-iphone-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Confirm Gate 4 ancestry + exact latest-main integration
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 62a4fad4f7f02b68fddec32600850f39b0db0ede HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "88552fb3fbfe7686f49ad74f481ebf087a361a96"
          cmp <(git show origin/main:assets/release-metadata.json) assets/release-metadata.json
          cmp <(git show origin/main:src/styles/practice/solo-live-v2.css) src/styles/practice/solo-live-v2.css
          git diff --check 62a4fad4f7f02b68fddec32600850f39b0db0ede...HEAD

      - name: Install architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Materialize canonical runtime
        run: node scripts/materialize-runtime.mjs

      - name: Verify generated source authority + Experience 04 contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/build-core-styles-from-source.mjs --verify-current
          node tools/ui-smoke/verify-sxp04-gate4-equivalence-contract.mjs
          node tools/ui-smoke/verify-sxp04-gate3-quick-entry-contract.mjs
          node tools/ui-smoke/verify-sxp04-gate2-contract.mjs
          node tools/ui-smoke/verify-sxp04-gate1-miss-contract.mjs
          node tools/ui-smoke/verify-sxp04-sidequest.mjs

      - name: Install deterministic build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact Gate 5 candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee sxp04-gate5-build.txt
          npm run verify:dist | tee sxp04-gate5-dist.txt

      - name: Install deterministic browser QA
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Re-prove Experience 04 on exact Gate 5 candidate
        shell: bash
        env:
          SQ_APP_URL: http://127.0.0.1:8160/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8160 --bind 127.0.0.1 --directory dist >/tmp/sxp04-gate5-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT

          node tools/ui-smoke/verify-sxp04-gate4-equivalence.js | tee sxp04-gate5-equivalence.txt
          node tools/ui-smoke/verify-sxp04-gate3-quick-entry.js | tee sxp04-gate5-gesture.txt
          node tools/ui-smoke/verify-sxp04-gate2-nonblocking.js | tee sxp04-gate5-nonblocking.txt
          node tools/ui-smoke/verify-sxp04-gate1-miss-response.js | tee sxp04-gate5-latency.txt
          node tools/ui-smoke/verify-sc030-undo-runtime.js | tee sxp04-gate5-undo.txt
          node tools/ui-smoke/verify-progression-modes.js | tee sxp04-gate5-progression-modes.txt
          node tools/ui-smoke/verify-training-modes.js | tee sxp04-gate5-training-modes.txt
          node tools/ui-smoke/verify-classic-visual-fit.js | tee sxp04-gate5-visual-fit.txt
          node tools/ui-smoke/smoke.js | tee sxp04-gate5-smoke.txt

      - name: Stage exact offline iPhone preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sxp04-gate5-write
          mkdir -p sxp04-gate5-write/runtime/src/legacy/styles sxp04-gate5-write/runtime/src/legacy/scripts
          cp index.html sxp04-gate5-write/runtime/index.html
          cp src/legacy/styles/inline-002.css sxp04-gate5-write/runtime/src/legacy/styles/inline-002.css
          cp src/legacy/scripts/inline-005.js sxp04-gate5-write/runtime/src/legacy/scripts/inline-005.js

          mkdir -p sxp04-gate5-write/preview/sxp04-gate5
          cp -a dist/. sxp04-gate5-write/preview/sxp04-gate5/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sxp04-gate5-write/preview/sxp04-gate5/index.html')
          s=p.read_text()
          guard='''<script id="sxp04-gate5-offline-guard">(function(){var f=window.fetch;window.fetch=function(i,o){var u=String((i&&i.url)||i||"");if(/supabase\.co/i.test(u))return Promise.reject(new TypeError("SXP-04 Gate 5 preview blocks Supabase"));return f.apply(this,arguments)};try{var W=window.WebSocket;window.WebSocket=function(u,p){if(/supabase\.co/i.test(String(u||"")))throw new Error("SXP-04 Gate 5 preview blocks Supabase WebSocket");return new W(u,p)}}catch(_){}})();</script>'''
          note='''<div id="sxp04Gate5Note" style="position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483647;padding:8px 10px;border:1px solid rgba(255,122,0,.45);border-radius:9px;background:rgba(8,10,16,.92);color:#fff;font:600 11px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;pointer-events:none">SXP-04 GATE 5 • OFFLINE IPHONE ACCEPTANCE • Hold S/D/T 360ms → slide to ×2 / ×3 / RH → release. Release elsewhere cancels.</div>'''
          s=s.replace('<head>','<head>\n'+guard,1)
          s=s.replace('<body>','<body>\n'+note,1)
          p.write_text(s)
          PY
          cat > sxp04-gate5-write/preview/sxp04-gate5/SXP04_GATE5_BUILD.txt <<EOF
          SXP-04 GATE 5 OFFLINE IPHONE ACCEPTANCE
          Source commit: ${GITHUB_SHA}
          Integrated production main: 88552fb3fbfe7686f49ad74f481ebf087a361a96
          Gate 4 proof base: 62a4fad4f7f02b68fddec32600850f39b0db0ede
          SC-049: hold S/D/T 360ms; slide/release to x2/x3/RH; release elsewhere cancels.
          All quick entries use canonical recordThrow one dart at a time.
          Supabase requests are blocked before app boot.
          Production remains unchanged.
          EOF

      - name: Package Gate 5 candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sxp04-gate5-write
          retention-days: 1
          include-hidden-files: true
          path: sxp04-gate5-write/

      - name: Keep Gate 5 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sxp04-gate5-evidence
          retention-days: 14
          path: sxp04-gate5-*.txt

  commit-generated:
    needs: verify
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Confirm branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sxp-04-gate5-iphone-acceptance
          test "$(git rev-parse origin/sxp-04-gate5-iphone-acceptance)" = "${GITHUB_SHA}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sxp04-gate5-write
          path: sxp04-gate5-write

      - name: Apply generated runtime + pinned preview only
        shell: bash
        run: |
          set -euo pipefail
          cp sxp04-gate5-write/runtime/index.html index.html
          cp sxp04-gate5-write/runtime/src/legacy/styles/inline-002.css src/legacy/styles/inline-002.css
          cp sxp04-gate5-write/runtime/src/legacy/scripts/inline-005.js src/legacy/scripts/inline-005.js
          rm -rf preview/sxp04-gate5
          mkdir -p preview
          cp -a sxp04-gate5-write/preview/sxp04-gate5 preview/sxp04-gate5

          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -v '^sxp04-gate5-write/' || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(index.html|src/legacy/styles/inline-002.css|src/legacy/scripts/inline-005.js|preview/sxp04-gate5/)' || true)"
          if [ -n "$bad" ]; then
            echo 'Refusing generated write: unexpected changed paths:'
            echo "$bad"
            exit 1
          fi
          test -n "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/legacy/styles/inline-002.css src/legacy/scripts/inline-005.js preview/sxp04-gate5
          git commit -m 'SXP-04 Gate 5: materialize pinned iPhone candidate [skip ci]'
          git push origin HEAD:sxp-04-gate5-iphone-acceptance
