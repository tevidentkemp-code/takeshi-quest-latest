name: SC-037 provisional TV Mode QA

on:
  push:
    branches: [sc037-provisional-tv-mode]
    paths:
      - 'src/live-game/live-v2.js'
      - 'src/live-game/tv-mode.js'
      - 'src/styles/live-game/tv-mode.css'
      - 'src/legacy/scripts/inline-005.js'
      - 'tools/ui-smoke/verify-sc037-tv-mode.js'
      - '.github/workflows/sc037-tv-mode-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/live-game/live-v2.js'
      - 'src/live-game/tv-mode.js'
      - 'src/styles/live-game/tv-mode.css'
      - 'src/legacy/scripts/inline-005.js'
      - 'tools/ui-smoke/verify-sc037-tv-mode.js'
      - '.github/workflows/sc037-tv-mode-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc037-tv-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Verify source authority and syntax
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-core-js-from-source.mjs --verify-current
          node scripts/verify-core-domains.mjs
          node --check src/live-game/live-v2.js
          node --check src/live-game/tv-mode.js
          node --check tools/ui-smoke/verify-sc037-tv-mode.js
          git diff --check origin/main...HEAD

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run verify:dist

      - name: Install browser QA
        working-directory: tools/ui-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: TV Mode source and built-dist acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sc037-source.log 2>&1 &
          source_pid=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory dist >/tmp/sc037-dist.log 2>&1 &
          dist_pid=$!
          trap 'kill "$source_pid" "$dist_pid" || true' EXIT
          SQ_SCREENSHOTS=output/playwright/sc037-source node tools/ui-smoke/verify-sc037-tv-mode.js
          SQ_APP_URL=http://127.0.0.1:8124/index.html SQ_SCREENSHOTS=output/playwright/sc037-dist node tools/ui-smoke/verify-sc037-tv-mode.js
          node tools/ui-smoke/smoke.js
          node tools/ui-smoke/verify-sc033-throw-order.js
          node tools/ui-smoke/verify-sc034-add-player.js
          node tools/ui-smoke/verify-sc036-skip-go.js

      - name: Keep SC-037 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sc037-provisional-tv-mode-evidence
          retention-days: 14
          path: |
            output/playwright/sc037-source/
            output/playwright/sc037-dist/
