name: SC-030 reduced motion QA

on:
  push:
    branches: [sc030-dmd-v2-modular]
    paths:
      - src/live-game/dmd/bootstrap.mjs
      - src/live-game/dmd/motion.mjs
      - tools/ui-smoke/verify-sc030-reduced-motion.mjs
      - tools/ui-smoke/verify-sc030-reduced-motion-runtime.js
      - .github/workflows/sc030-reduced-motion-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc030-reduced-motion-qa
  cancel-in-progress: false

jobs:
  verify-reduced-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Install deterministic architecture tooling
        run: npm ci --prefix scripts --ignore-scripts

      - name: Confirm production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Verify source and architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/live-game/dmd/controller.mjs
          node --check src/live-game/dmd/bootstrap.mjs
          node --check src/live-game/dmd/motion.mjs
          node tools/ui-smoke/verify-sc030-reduced-motion.mjs
          node scripts/verify-modularization.mjs
          node scripts/render-index-from-source.mjs --output /tmp/sc030-motion-index.html --evidence /tmp/sc030-motion-html.json
          cmp -s /tmp/sc030-motion-index.html index.html
          git diff --check

      - name: Install deterministic UI test dependencies
        working-directory: tools/ui-smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run reduced-motion and full behaviour regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/sq-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tools/ui-smoke/verify-sc030-reduced-motion-runtime.js
          node tools/ui-smoke/verify-sc030-dmd-runtime.js
          node tools/ui-smoke/verify-sc030-actions-runtime.js
          node tools/ui-smoke/verify-sc030-undo-runtime.js
          node tools/ui-smoke/verify-sc014.js
          node tools/ui-smoke/smoke.js
          node tools/ui-smoke/verify-classic-visual-fit.js
          node tools/ui-smoke/verify-training-modes.js
          node tools/ui-smoke/verify-progression-modes.js
          node tools/ui-smoke/verify-pstats.js
          node tools/ui-smoke/verify-p23.js
          node tools/ui-smoke/verify-n5-stacking.js
